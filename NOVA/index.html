.kp-group{font-size:12px;color:#aac0df;font-weight:850;margin:17px 3px 8px}.kp-list{display:grid;gap:7px}

.tabbar button{width:min(20%,130px);border:0;background:transparent;color:#7287a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:760;cursor:pointer}

.back{border:0;background:transparent;color:#94bfff;font-weight:850;font-size:15px;padding:9px 8px;cursor:pointer}
.detail-title{flex:1;min-width:0;text-align:center;padding-right:48px}.detail-title b{display:block;font-size:13px}.detail-title small{display:block;color:#7f93b1;font-size:9.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-scroll,.note-scroll{flex:1;min-height:0;width:100%;overflow:auto;padding:14px max(14px,env(safe-area-inset-left)) calc(32px + var(--safe-b));max-width:760px;margin:auto}
.point-list{display:grid;gap:7px;margin:11px 0 17px}.point{border:1px solid #293e5e;background:#0e1a2d;border-radius:12px;padding:10px 11px}.point-top{display:flex;gap:8px;align-items:center}.point-code{font:850 11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#9ec3ff}.point-title{font-weight:820;font-size:13px}.point-desc{font-size:11px;color:#94a6c2;margin-top:4px;line-height:1.45}
.actions{display:grid;gap:8px}.note-button{border-color:#6b5b2f;background:linear-gradient(135deg,#493a18,#322914);color:#ffe3a0}
.sheet-bg,.modal-bg{display:none;position:fixed;inset:0;z-index:250;background:rgba(2,7,14,.72);backdrop-filter:blur(5px);align-items:flex-end;justify-content:center}

003c/div>\u003ch1>ISO-TP 分段重组：PCI、SF、FF、CF\u003c/h1>\u003cp>由原《CanTp 核心打印笔记》按课程 7.1 拆分。保留原笔记中的 CanTp 心智模型、帧结构与 CAN FD 相关内容。\u003c/p>\u003c/header>\n\u003cdiv class=\"split-note\">这份文件是独立课程笔记资产，不参与课程完成状态，也不会改变 ChatGPT 学习 Prompt。\u003c/div>\n\u003csection class=\"section\">\u003ch2>0. 30 秒脑内模型\u003c/h2>\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003cb>CanTp\u003c/b>\u003cbr/>完整数据太大时负责\u003cstrong>拆成多个 CAN N-PDU\u003c/strong>发送；接收时再\u003cstrong>拼回一个完整 N-SDU\u003c/strong>。\u003c/div>\n\u003cdiv class=\"card\">\u003cb>层级\u003c/b>\u003cbr/>\u003cspan class=\"code\">DCM ↔ PduR ↔ CanTp ↔ CanIf ↔ CAN Driver\u003c/span>\u003c/div>\n\u003cdiv class=\"card\">\u003cb>N-SDU\u003c/b>\u003cbr/>上层眼中的\u003cstrong>完整一包 TP 数据\u003c/strong>，例如整个诊断 Request / Response。\u003c/div>\n\u003cdiv class=\"card\">\u003cb>N-PDU\u003c/b>\u003cbr/>CanTp 与 CanIf 之间\u003cstrong>一帧一帧传输的 PDU\u003c/strong>，例如承载 SF/FF/CF/FC 的底层帧。\u003c/div>\n\u003cdiv class=\"card\">\u003cb>RxNSdu\u003c/b>\u003cbr/>\u003cstrong>本 ECU 收 DATA + 发 FC。\u003c/strong>\u003c/div>\n\u003cdiv class=\"card\">\u003cb>TxNSdu\u003c/b>\u003cbr/>\u003cstrong>本 ECU 发 DATA + 收 FC。\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"warn\">最重要条件反射：\u003cspan class=\"code\">RxNSdu = 收 DATA + 发 FC；TxNSdu = 发 DATA + 收 FC。\u003c/span>\u003c/div>\u003c/section>\u003csection class=\"section\">\u003ch2>1. 四种 CanTp 帧\u003c/h2>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>PCI\u003c/th>\u003cth>帧\u003c/th>\u003cth>一句话\u003c/th>\u003cth>最常见格式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>0x\u003c/b>\u003c/td>\u003ctd>SF\u003c/td>\u003ctd>数据一帧装完。\u003c/td>\u003ctd>\u003cspan class=\"code\">0X ...\u003c/span>；Classic CAN 常见 X=有效数据长度。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>1x\u003c/b>\u003c/td>\u003ctd>FF\u003c/td>\u003ctd>第一帧，告诉对方后面还有，同时带\u003cstrong>整个 N-SDU 总长度\u003c/strong>。\u003c/td>\u003ctd>\u003cspan class=\"code\">10 LL ...\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>2x\u003c/b>\u003c/td>\u003ctd>CF\u003c/td>\u003ctd>后续数据帧；低 4 bit 是 SN。\u003c/td>\u003ctd>\u003cspan class=\"code\">21,22,...,2F,20,21...\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>3x\u003c/b>\u003c/td>\u003ctd>FC\u003c/td>\u003ctd>Receiver 控制 Sender 后续 CF 怎么发。\u003c/td>\u003ctd>\u003cspan class=\"code\">30/31/32  BS  STmin\u003c/span>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>SF 示例\u003c/b>\u003cpre>03 22 F1 90 00 00 00 00\n03：SF，长度=3\n真正 UDS：22 F1 90\n后面的 00：Padding\u003c/pre>\u003c/div>\n\u003cdiv class=\"card\">\u003cb>FF 示例\u003c/b>\u003cpre>10 24 62 F1 90 ...\n0x024 = 36 Byte\n36 是整个 N-SDU 总长度，不是本帧长度。\u003c/pre>\u003c/div>\u003c/div>\n\u003ch3>FC：30 / 31 / 32\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>值\u003c/th>\u003cth>含义\u003c/th>\u003cth>人话\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>30 / CTS\u003c/b>\u003c/td>\u003ctd>Continue To Send\u003c/td>\u003ctd>\u003cstrong>继续发。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>31 / WAIT\u003c/b>\u003c/td>\u003ctd>Wait\u003c/td>\u003ctd>\u003cstrong>先等等，我还没准备好。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>32 / OVFLW\u003c/b>\u003c/td>\u003ctd>Overflow\u003c/td>\u003ctd>\u003cstrong>接收不了，本次传输失败。\u003c/strong>不是正常结束。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>BS / STmin / SN\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>概念\u003c/th>\u003cth>一句话\u003c/th>\u003cth>例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>BS\u003c/b>\u003c/td>\u003ctd>Receiver 允许 Sender \u003cstrong>连续发多少个 CF\u003c/strong>。\u003c/td>\u003ctd>\u003cspan class=\"code\">BS=8\u003c/span>：8 个 CF 后重新等 FC；\u003cspan class=\"code\">BS=0\u003c/span>：剩余 CF 可一直发完，不再因 BS 等新 FC。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>STmin\u003c/b>\u003c/td>\u003ctd>Receiver 要求 Sender 的\u003cstrong>相邻 CF 最小间隔\u003c/strong>。\u003c/td>\u003ctd>00~7F=0~127 ms；F1~F9=100~900 μs。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>SN\u003c/b>\u003c/td>\u003ctd>CF 的 Sequence Number，低 4 bit；必须连续。\u003c/td>\u003ctd>\u003cspan class=\"code\">21→22→...→2F→20→21\u003c/span>。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"note\">\u003cb>BS/STmin 到底谁决定？\u003c/b>\u003cbr/>\u003cstrong>我的 ECU 接收多帧 → BS/STmin 由我的 RxNSdu 配置决定，我通过 FC 告诉对方。\u003c/strong>\u003cbr/>\u003cstrong>我的 ECU 发送多帧 → BS/STmin 由对方 FC 决定，我照着执行。\u003c/strong>\u003cbr/>\u003cspan class=\"code\">CanTpChangeParameterApi=OFF\u003c/span> 时按 EB 固定配置理解；开启后可通过标准 API 在运行时修改 Rx 侧 BS/STmin。\u003c/div>\n\u003c/section>\u003csection class=\"section\">\u003ch2>11. CAN FD 下的 CanTp\u003c/h2>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>Classic CAN\u003c/th>\u003cth>CAN FD\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Payload 最大 8 Byte。\u003c/td>\u003ctd>Payload 最大 64 Byte。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Normal Addressing 下常见 SF：\u003cspan class=\"code\">0X\u003c/span>，X 可直接表示较短 SF 长度。\u003c/td>\u003ctd>较长 SF 可用\u003cstrong>扩展 SF_DL\u003c/strong>；不能机械认为低 4 bit 永远是完整长度。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>大数据需要 FF/FC/CF。\u003c/td>\u003ctd>一帧能装更多，但超过单帧能力仍然 FF/FC/CF。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>CAN FD 扩展 SF_DL 示例：\n00 14 62 F1 90 ...\n00：SF 的扩展长度形式\n0x14：20 Byte 的 SF_DL\n→ 不要看到 00 就误判成“长度为0”。\u003c/pre>\n\u003cdiv class=\"warn\">CAN FD 只是“每个 N-PDU 能装更多”；\u003cstrong>SF / FF / FC / CF、BS、STmin、SN、Timer 的核心思想都没变。\u003c/strong>\u003c/div>\n\u003cp>当前项目 \u003cspan class=\"code\">CanTpFlexibleDataRateSupport = ON\u003c/span>，表示 CanTp 具备 CAN FD 支持；具体某条 DIAG PDU 是否走 FD，还要看 CanIf / CAN Controller / PDU 配置。\u003c/p>\u003c/section>\u003csection class=\"section\">\u003ch2>易混淆速查\u003c/h2>\u003col>\u003cli>\u003cb>N-SDU 是整个数据；N-PDU 是一帧一帧的数据。\u003c/b>\u003c/li>\u003cli>\u003cb>FF 中长度是整个 N-SDU 总长度，不是 FF 本帧长度。\u003c/b>\u003c/li>\u003c/ol>\u003c/section>\u003csection class=\"section\">\u003ch2>15. 规范依据\u003c/h2>\n\u003cp>核心概念依据 AUTOSAR Classic Platform \u003cb>Specification of CAN Transport Layer\u003c/b> 与 \u003cb>Specification of PDU Router\u003c/b>；EB 字段中的具体数值与命名来自当前项目截图。Vendor 私有/实现型参数若无标准依据，不在核心笔记中强行解释。\u003c/p>\n\u003cp class=\"small\">AUTOSAR CP R24-11：Specification of CAN Transport Layer；Specification of PDU Router。\u003c/p>\u003c/section>\n\u003c/main>\u003c/body>\u003c/html>","notes/07/7.2.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#121b2c\">\n\u003ctitle>7.2 ISO-TP 流控与时序：FC、BS、STmin、N_xx Timeout｜BSW Learning 笔记\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\n:root{--ink:#131722;--muted:#647084;--line:#d7dde8;--panel:#f6f8fb;--accent:#315fa4;--warn:#a76412}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#edf1f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;line-height:1.5}\n.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:rgba(18,27,44,.96);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}\n.topbar a,.topbar button{border:1px solid rgba(255,255,255,.18);background:#1d2c48;color:#e9f1ff;border-radius:10px;padding:8px 11px;text-decoration:none;font:inherit;font-weight:750;cursor:pointer}\n.topbar .spacer{flex:1}.topbar .name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.page{width:min(100%,920px);margin:0 auto;background:#fff;min-height:100vh;padding:26px 34px 54px}\n.note-head{border-bottom:2px solid #263b60;padding-bottom:12px;margin-bottom:14px}\n.note-head .course{font:800 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#315fa4}\n.note-head h1{font-size  href=\"../../index.html#course=7.2\">‹ 返回课程\u003c/a>\u003cdiv class=\"name\">7.2 · ISO-TP 流控与时序：FC、BS、STmin、N_xx Timeout\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>\u003cbutton type=\"button\" onclick=\"window.print()\">打印 / PDF\u003c/button>\u003c/div>\n\u003cmain class=\"page\">\n\u003cheader class=\"note-head\">\u003cdiv class=\"course\">COURSE 7.2\u003c/div>\u003ch1>ISO-TP 流控与时序：FC、BS、STmin、N_xx Timeout\u003c/h1>\u003cp>由原《CanTp 核心打印笔记》按课程 7.2 拆分。重点保留 Flow Control、BS/STmin 与六个 N_Timer。\u003c/p>\u003c/header>\n\u003cdiv class=\"split-note\">这份文件是独立课程笔记资产，不参与课程完成状态，也不会改变 ChatGPT 学习 Prompt。\u003c/div>\n\u003csection class=\"section\">\u003ch2>1. Flow Control / BS / STmin\u003c/h2>\u003ch3>FC：30 / 31 / 32\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>值\u003c/th>\u003cth>含义\u003c/th>\u003cth>人话\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>30 / CTS\u003c/b>\u003c/td>\u003ctd>Continue To Send\u003c/td>\u003ctd>\u003cstrong>继续发。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>31 / WAIT\u003c/b>\u003c/td>\u003ctd>Wait\u003c/td>\u003ctd>\u003cstrong>先等等，我还没准备好。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>32 / OVFLW\u003c/b>\u003c/td>\u003ctd>Overflow\u003c/td>\u003ctd>\u003cstrong>接收不了，本次传输失败。\u003c/strong>不是正常结束。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>BS / STmin / SN\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>概念\u003c/th>\u003cth>一句话\u003c/th>\u003cth>例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>BS\u003c/b>\u003c/td>\u003ctd>Receiver 允许 Sender \u003cstrong>连续发多少个 CF\u003c/strong>。\u003c/td>\u003ctd>\u003cspan class=\"code\">BS=8\u003c/span>：8 个 CF 后重新等 FC；\u003cspan class=\"code\">BS=0\u003c/span>：剩余 CF 可一直发完，不再因 BS 等新 FC。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>STmin\u003c/b>\u003c/td>\u003ctd>Receiver 要求 Sender 的\u003cstrong>相邻 CF 最小间隔\u003c/strong>。\u003c/td>\u003ctd>00~7F=0~127 ms；F1~F9=100~900 μs。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>SN\u003c/b>\u003c/td>\u003ctd>CF 的 Sequence Number，低 4 bit；必须连续。\u003c/td>\u003ctd>\u003cspan class=\"code\">21→22→...→2F→20→21\u003c/span>。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"note\">\u003cb>BS/STmin 到底谁决定？\u003c/b>\u003cbr/>\u003cstrong>我的 ECU 接收多帧 → BS/STmin 由我的 RxNSdu 配置决定，我通过 FC 告诉对方。\u003c/strong>\u003cbr/>\u003cstrong>我的 ECU 发送多帧 → BS/STmin 由对方 FC 决定，我照着执行。\u003c/strong>\u003cbr/>\u003cspan class=\"code\">CanTpChangeParameterApi=OFF\u003c/span> 时按 EB 固定配置理解；开启后可通过标准 API 在运行时修改 Rx 侧 BS/STmin。\u003c/div>\n\u003c/section>\u003csection class=\"section\">\u003ch2>6. 六个 N_Timer + P2 / P2*\u003c/h2>\n\u003cp class=\"lead\">先背两个：\u003cspan class=\"code\">N_Bs = Sender 等 FC；N_Cr = Receiver 等下一 CF。\u003c/span>\u003c/p>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>Timer\u003c/th>\u003cth>站在哪边\u003c/th>\u003cth>人话记忆\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>N_As\u003c/b>\u003c/td>\u003ctd>Sender\u003c/td>\u003ctd>DATA N-PDU 交给下面去发后，\u003cstrong>这一帧不能一直不完成。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>N_Bs\u003c/b>\u003c/td>\u003ctd>Sender\u003c/td>\u003ctd>\u003cstrong>发完 FF / 一个 Block 后，等对方 FC。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>N_Cs\u003c/b>\u003c/td>\u003ctd>Sender\u003c/td>\u003ctd>轮到继续发 CF 时，\u003cstrong>准备下一块数据 / 下一 CF 不能拖太久。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>N_Ar\u003c/b>\u003c/td>\u003ctd>Receiver\u003c/td>\u003ctd>要发 FC 时，\u003cstrong>FC 交给下面后不能一直不完成。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>N_Br\u003c/b>\u003c/td>\u003ctd>Receiver\u003c/td>\u003ctd>收到 FF / 到了回 FC 阶段，\u003cstrong>准备 Buffer 和 FC 不能一直磨蹭。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>N_Cr\u003c/b>\u003c/td>\u003ctd>Receiver\u003c/td>\u003ctd>\u003cstrong>已经允许你发了，现在等下一 CF，不能无限等。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>P2\u003c/b>\u003c/td>\u003ctd>UDS / DCM\u003c/td>\u003ctd>Tester 发完 UDS Request 后，\u003cstrong>等 ECU 开始给诊断响应\u003c/strong>的时间概念。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>P2*\u003c/b>\u003c/td>\u003ctd>UDS / DCM\u003c/td>\u003ctd>ECU 通过 \u003cspan class=\"code\">7F xx 78\u003c/span> 表示还在处理后，使用更长的后续响应等待时间。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"note\">\u003cstrong>N_xx = CanTp 多帧传输过程时间；P2/P2* = UDS 请求与诊断响应时间。\u003c/strong>\u003c/div>\n\u003cdiv class=\"note\">\u003cstrong>STmin = 别发太快；N_Cr = 也别让我等太久。\u003c/strong>\u003c/div>\u003c/section>\u003csection class=\"section\">\u003ch2>易混淆速查\u003c/h2>\u003col>\u003cli>\u003cb>30=继续，31=等待，32=接收不了/失败。\u003c/b>\u003c/li>\u003cli>\u003cb>BS=0 不是不许发，而是剩余 CF 不再因 Block Size 等新 FC。\u003c/b>\u003c/li>\u003cli>\u003cb>STmin 管别太快；N_Cr 管也别让我等太久。\u003c/b>\u003c/li>\u003cli>\u003cb>Receiver 决定 BS/STmin，Sender 遵守。\u003c/b>\u003c/li>\u003cli>\u003cb>P2/P2* 属于 UDS 响应时间；N_As~N_Cr 属于 CanTp 传输时间。\u003c/b>\u003c/li>\u003c/ol>\u003c/section>\u003csection class=\"section\">\u003ch2>15. 规范依据\u003c/h2>\n\u003cp>核心概念依据 AUTOSAR Classic Platform \u003cb>Specification of CAN Transport Layer\u003c/b> 与 \u003cb>Specification of PDU Router\u003c/b>；EB 字段中的具体数值与命名来自当前项目截图。Vendor 私有/实现型参数若无标准依据，不在核心笔记中强行解释。\u003c/p>\n\u003cp class=\"small\">AUTOSAR CP R24-11：Specification of CAN Transport Layer；Specification of PDU Router。\u003c/p>\u003c/section>\n\u003c/main>\u003c/body>\u003c/html>","notes/07/7.3.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#121b2c\">\n\u003ctitle>7.3 寻址、Padding 与 Functional 限制｜BSW Learning 笔记\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\n:root{--ink:#131722;--muted:#647084;--line:#d7dde8;--panel:#f6f8fb;--accent:#315fa4;--warn:#a76412}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#edf1f6;color:var(--ink);font-family:-apple-system,BlinkMacSyst rder-collapse:collapse;margin:6px 0 10px;font-size:12px}th,td{border:1px solid #cbd2dc;padding:5px 7px;vertical-align:top;overflow-wrap:anywhere}th{background:#eef2f6;text-align:left}\n.tight th,.tight td{padding:4px 6px}.action-col,.edit-controls,.row-del,.table-del,.section-del{display:none!important}\nol,ul{padding-left:22px}\n.split-note{margin:12px 0;padding:8px 10px;border-radius:8px;background:#eef5ff;border:1px solid #c9dafa;color:#294a7a;font-size:12px}\n@media(max-width:700px){.page{padding:18px 14px 42px}.grid2{grid-template-columns:1fr}.note-head h1{font-size:22px}table{font-size:11px}pre{font-size:11px}.topbar .name{display:none}}\n@page{size:A4;margin:10mm}\n@media print{body{background:#fff}.topbar{display:none!important}.page{width:auto;max-width:none;min-height:0;padding:0}h2,h3{break-after:avoid-page}tr,.card,.note,.warn{break-inside:avoid}thead{display:table-header-group}.note-head{margin-bottom:8mm}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"topbar\">\u003ca href=\"../../index.html#course=7.3\">‹ 返回课程\u003c/a>\u003cdiv class=\"name\">7.3 · 寻址、Padding 与 Functional 限制\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>\u003cbutton type=\"button\" onclick=\"window.print()\">打印 / PDF\u003c/button>\u003c/div>\n\u003cmain class=\"page\">\n\u003cheader class=\"note-head\">\u003cdiv class=\"course\">COURSE 7.3\u003c/div>\u003ch1>寻址、Padding 与 Functional 限制\u003c/h1>\u003cp>由原《CanTp 核心打印笔记》按课程 7.3 拆分。重点保留 Physical/Functional、AddressingFormat 与相关限制。\u003c/p>\u003c/header>\n\u003cdiv class=\"split-note\">这份文件是独立课程笔记资产，不参与课程完成状态，也不会改变 ChatGPT 学习 Prompt。\u003c/div>\n\u003csection class=\"section\">\u003ch2>2. Physical / Functional 与 Addressing\u003c/h2>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>TaType：找谁？\u003c/b>\u003cbr/>\u003cb>PHYSICAL\u003c/b>：找某一台 ECU。\u003cbr/>\u003cb>FUNCTIONAL\u003c/b>：1:n，一次请求给一类 ECU。\u003c/div>\n\u003cdiv class=\"card\">\u003cb>AddressingFormat：地址放哪里？\u003c/b>\u003cbr/>STANDARD / EXTENDED / MIXED / NORMAL FIXED 决定地址信息放在 CAN ID 还是 Payload，以及 PCI 从哪个 Byte 开始。\u003c/div>\u003c/div>\n\u003cdiv class=\"warn\">不要混：\u003cb>Physical/Functional = 找谁；AddressingFormat = 地址信息放哪里。\u003c/b>\u003c/div>\n\u003cp>\u003cstrong>Functional Request 只走 SF。\u003c/strong>若功能请求触发的 Response 很大，ECU 通过 \u003cstrong>Physical TxNSdu\u003c/strong> 进行多帧响应。\u003c/p>\n\u003cpre>Tester → 多个 ECU：Functional SF Request\n某 ECU 需要返回很多数据\nECU → Tester：Physical FF\nTester → ECU：Physical FC\nECU → Tester：Physical CF / CF ...\u003c/pre>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>Addressing\u003c/th>\u003cth>人话\u003c/th>\u003cth>PCI 开始位置\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>STANDARD / Normal\u003c/b>\u003c/td>\u003ctd>CAN ID 已足够区分通信对象，Payload 不再额外放地址。\u003c/td>\u003ctd>\u003cb>Byte0\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>EXTENDED\u003c/b>\u003c/td>\u003ctd>CAN ID 还不够，所以 Payload 前再放 1 Byte 地址。\u003c/td>\u003ctd>\u003cb>Byte1\u003c/b>；Byte0 是地址\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>MIXED\u003c/b>\u003c/td>\u003ctd>CAN ID + Payload 中 Address Extension 一起决定通信关系。\u003c/td>\u003ctd>\u003cb>Byte1\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>NORMAL FIXED\u003c/b>\u003c/td>\u003ctd>固定格式 29-bit CAN ID 中编码源/目标地址。\u003c/td>\u003ctd>通常 \u003cb>Byte0\u003c/b>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>易混淆速查\u003c/h2>\u003col>\u003cli>\u003cb>TaType 决定 Physical/Functional；AddressingFormat 决定地址放在哪里。\u003c/b>\u003c/li>\u003cli>\u003cb>Functional Request 只用 SF；需要多帧的 Response 走 Physical Tx。\u003c/b>\u003c/li>\u003c/ol>\u003c/section>\u003csection class=\"section\">\u003ch2>15. 规范依据\u003c/h2>\n\u003cp>核心概念依据 AUTOSAR Classic Platform \u003cb>Specification of CAN Transport Layer\u003c/b> 与 \u003cb>Specification of PDU Router\u003c/b>；EB 字段中的具体数值与命名来自当前项目截图。Vendor 私有/实现型参数若无标准依据，不在核心笔记中强行解释。\u003c/p>\n\u003cp class=\"small\">AUTOSAR CP R24-11：Specification of CAN Transport Layer；Specification of PDU Router。\u003c/p>\u003c/section>\n\u003c/main>\u003c/body>\u003c/html>","notes/07/7.4.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#121b2c\">\n\u003ctitle>7.4 PduR Buffer API、工程配置与 CanTp Debug｜BSW Learning 笔记\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\n:root{--ink:#131722;--muted:#647084;--line:#d7dde8;--panel:#f6f8fb;--accent:#315fa4;--warn:#a76412}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#edf1f6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif;line-height:1.5}\n.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));background:rgba(18,27,44,.96);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}\n.topbar a,.topbar button{border:1px solid rgba(255,255,255,.18);background:#1d2c48;color:#e9f1ff;border-radius:10px;padding:8px 11px;text-decoration:none;font:inherit;font-weight:750;cursor:pointer}\n.topbar .spacer{flex:1}.topbar .name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.page{width:min(100%,920px);margin:0 auto;background:#fff;min-height:100vh;padding:26px 34px 54px}\n.note-head{border-bottom:2px solid #263b60;padding-bottom:12px;margin-bottom:14px}\n.note-head .course{font:800 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#315fa4}\n.note-head h1{font-size:26px;line-height:1.25;margin:4px 0 7px}\n.note-head p{margin:0;color:var(--muted);font-size:13px}\nh2{font-size:18px;margin:22px 0 8px;border-bottom:2px solid #222;padding-bottom:4px}\nh3{font-size:15px;margin:13px 0 5px}\np{margin:5px 0}.small{font-size:11px;color:#596273}.lead{font-size:13px;font-weight:700}.code,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}\npre,.codebox{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f5f7f9;border:1px solid #d7dce1;border-radius:7px;padding:8px 10px;margin:6px 0;font-size:12px}\n.note{border-left:4px solid #333;background:#f5f7f9;padding:7px 9px;margin:7px 0}\n.warn{border:1px solid #d8b77f;border-left:4px solid var(--warn);background:#fffaf1;padding:7px 9px;margin:7px 0;font-weight:700}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}.card{border:1px solid #cbd2dc;padding:7px 9px;border-radius:7px;break-inside:avoid}\ntable{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:12px}th,td{border:1px solid #cbd2dc;padding:5px 7px;vertical-align:top;overflow-wrap:anywhere}th{background:#eef2f6;text-align:left}\n.tight th,.tight td{padding:4px 6px}.action-col,.edit-controls,.row-del,.table-del,.section-del{display:none!important}\nol,ul{padding-left:22px}\n.split-note{margin:12px 0;padding:8px 10px;border-radius:8px;background:#eef5ff;border:1px solid #c9dafa;color:#294a7a;font-size:12px}\n@media(max-width:700px){.page{padding:18px 14px 42px}.grid2{grid-template-columns:1fr}.note-head h1{font-size:22px}table{font-size:11px}pre{font-size:11px}.topbar .name{display:none}}\n@page{size:A4;margin:10mm}\n@media print{body{background:#fff}.topbar{display:none!important}.page{width:auto;max-width:none;min-height:0;padding:0}h2,h3{break-after:avoid-page}tr,.card,.note,.warn{break-inside:avoid}thead{display:table-header-group}.note-head{margin-bottom:8mm}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"topbar\">\u003ca href=\"../../index.html#course=7.4\">‹ 返回课程\u003c/a>\u003cdiv class=\"name\">7.4 · PduR Buffer API、工程配置与 CanTp Debug\u003c/div>\u003cdiv class=\"spacer\">\u003c/div>\u003cbutton type=\"button\" onclick=\"window.print()\">打印 / PDF\u003c/button>\u003c/div>\n\u003cmain class=\"page\">\n\u003cheader class=\"note-head\">\u003cdiv class=\"course\">COURSE 7.4\u003c/div>\u003ch1>PduR Buffer API、工程配置与 CanTp Debug\u003c/h1>\u003cp>由原《CanTp 核心打印笔记》按课程 7.4 拆分。原笔记明确未单列完整“故障分析专题”，因此这里保留已有 API、Buffer、EB 配置、检查顺序与 CANoe 速查内容，不额外虚构故障案例。\u003c/p>\u003c/header>\n\u003cdiv class=\"split-note\">这份文件是独立课程笔记资产，不参与课程完成状态，也不会改变 ChatGPT 学习 Prompt。\u003c/div>\n\u003csection class=\"section\">\u003ch2>3. RxNSdu / TxNSdu / N-PDU Linking\u003c/h2>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>RxNSdu\u003c/b>\u003cbr/>完整接收连接：\u003cstrong>收 DATA + 发 FC\u003c/strong>。典型关联：\u003cspan class=\"code\">RxNPdu + TxFcNPdu\u003c/span>。\u003c/div>\n\u003cdiv class=\"card\">\u003cb>TxNSdu\u003c/b>\u003cbr/>完整发送连接：\u003cstrong>发 DATA + 收 FC\u003c/strong>。典型关联：\u003cspan class=\"code\">TxNPdu + RxFcNPdu\u003c/span>。\u003c/div>\u003c/div>\n\u003ch3>当前项目实际映射\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>完整 N-SDU\u003c/th>\u003cth>角色\u003c/th>\u003cth>DATA N-PDU\u003c/th>\u003cth>FC N-PDU\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>DIAG_REQ\u003c/b>\u003c/td>\u003ctd>RxNSdu\u003c/td>\u003ctd>\u003cb>收：\u003c/b>\u003cspan class=\"code\">DIAG_REQ_2001R\u003c/span>\u003c/td>\u003ctd>\u003cb>发：\u003c/b>\u003cspan class=\"code\">DIAG_RES_2009T\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>DIAG_RES\u003c/b>\u003c/td>\u003ctd>TxNSdu\u003c/td>\u003ctd>\u003cb>发：\u003c/b>\u003cspan class=\"code\">DIAG_RES_D_2009T\u003c/span>\u003c/td>\u003ctd>\u003cb>收：\u003c/b>\u003cspan class=\"code\">DIAG_REQ_2001R\u003c/span>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>Tester                                      ECU\nDIAG_REQ_2001R  ── Request DATA ───────→  RxNSdu\nDIAG_RES_2009T  ←────── FC ─────────────  RxNSdu\n\nDIAG_RES_D_2009T←── Response DATA ──────  TxNSdu\nDIAG_REQ_2001R  ─────── FC ────────────→  TxNSdu\u003c/pre>\n\u003ch3>几个 ID 千万别混\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>编号的是什么\u003c/th>\u003cth>特别注意\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>CanTpRxNSduId / CanTpTxNSduId\u003c/b>\u003c/td>\u003ctd>完整 Rx/Tx N-SDU 配置的 Handle / 编号。\u003c/td>\u003ctd>\u003cstrong>不是 CAN ID。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxNPduId / RxFcNPduId\u003c/b>\u003c/td>\u003ctd>CanTp 收到底层某条 N-PDU 时识别它的 Handle。\u003c/td>\u003ctd>数字就算与 NSduId 都是 0，也不是同一个概念。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxNPduConfirmationPduId\u003c/b>\u003c/td>\u003ctd>CanIf 回调 \u003cspan class=\"code\">CanTp_TxConfirmation(PduId)\u003c/span> 时，CanTp 用它识别哪条 Tx N-PDU 发完。\u003c/td>\u003ctd>同样不是 CAN Identifier。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>4. AUTOSAR API 命名 + 调用栈\u003c/h2>\n\u003cdiv class=\"note\">\u003cstrong>下划线前第一个模块名 = 这个 API 属于哪个模块。\u003c/strong>\u003cbr/>\n\u003cspan class=\"code\">CanTp_Transmit()\u003c/span> 属于 CanTp；\u003cspan class=\"code\">PduR_CanTpCopyTxData()\u003c/span> 属于 PduR。\u003cbr/>\n\u003cstrong>但仅凭函数名不能保证知道是谁调用它\u003c/strong>；调用者要看 AUTOSAR 接口关系 / 实际调用链。\u003c/div>\n\u003ch3>发送方向\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>顺序\u003c/th>\u003cth>调用关系\u003c/th>\u003cth>API\u003c/th>\u003cth>人话\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003cb>PduR 调用 CanTp 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_Transmit()\u003c/span>\u003c/td>\u003ctd>开始发送\u003cstrong>整个 N-SDU\u003c/strong>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003cb>CanTp 调用 PduR 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">PduR_CanTpCopyTxData()\u003c/span>\u003c/td>\u003ctd>CanTp：给我下一块发送数据。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003cb>CanTp 调用 CanIf 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">CanIf_Transmit()\u003c/span>\u003c/td>\u003ctd>把一个 SF / FF / CF / FC N-PDU 交给 CanIf。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>\u003cb>CanIf 调用 CanTp 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_TxConfirmation()\u003c/span>\u003c/td>\u003ctd>\u003cstrong>刚才一个 N-PDU 发完了。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>多帧\u003c/td>\u003ctd>\u003cb>CanIf 调用 CanTp 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_RxIndication()\u003c/span>\u003c/td>\u003ctd>对方 FC 作为 Rx N-PDU 进入 CanTp。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>最后\u003c/td>\u003ctd>\u003cb>CanTp 调用 PduR 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">PduR_CanTpTxConfirmation()\u003c/span>\u003c/td>\u003ctd>\u003cstrong>整个 N-SDU 全部发送结束。\u003c/strong>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"warn\">\u003cspan class=\"code\">CanTp_TxConfirmation\u003c/span> = 一个 N-PDU 完成；\u003cspan class=\"code\">PduR_CanTpTxConfirmation\u003c/span> = 整个 N-SDU 完成。\u003c/div>\n\u003ch3>接收方向\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>顺序\u003c/th>\u003cth>调用关系\u003c/th>\u003cth>API\u003c/th>\u003cth>人话\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003cb>CanIf 调用 CanTp 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_RxIndication()\u003c/span>\u003c/td>\u003ctd>一个 SF / FF / CF / FC 进入 CanTp。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003cb>CanTp 调用 PduR 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">PduR_CanTpStartOfReception()\u003c/span>\u003c/td>\u003ctd>开始收完整 N-SDU，先确认 / 准备 Rx Buffer。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003cb>CanTp 调用 PduR 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">PduR_CanTpCopyRxData()\u003c/span>\u003c/td>\u003ctd>把刚收到的一块有效数据交给上层 Buffer。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>需要FC\u003c/td>\u003ctd>\u003cb>CanTp 调用 CanIf 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">CanIf_Transmit()\u003c/span>\u003c/td>\u003ctd>Receiver 收到 FF 后发 FC。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>最后\u003c/td>\u003ctd>\u003cb>CanTp 调用 PduR 的 API\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"code\">PduR_CanTpRxIndication()\u003c/span>\u003c/td>\u003ctd>\u003cstrong>整个 N-SDU 接收结束。\u003c/strong>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>重要 API：以后查断点时看这张\u003c/h3>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>API\u003c/th>\u003cth>它管什么\u003c/th>\u003cth>什么现象时最值得看\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">CanTp_Transmit()\u003c/span>\u003c/td>\u003ctd>开始发送整个 N-SDU。\u003c/td>\u003ctd>上层已经准备 Response，但 CanTp 根本没开始。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">PduR_CanTpCopyTxData()\u003c/span>\u003c/td>\u003ctd>向上层拿下一块 Tx 数据。\u003c/td>\u003ctd>CanTp 已开始，但后续数据拿不到 / CF 准备不出来。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">CanIf_Transmit()\u003c/span>\u003c/td>\u003ctd>把一个 N-PDU 交给 CanIf。\u003c/td>\u003ctd>CanTp 已决定要发，但总线没看到对应帧。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">CanTp_TxConfirmation()\u003c/span>\u003c/td>\u003ctd>一个 Tx N-PDU 发送完成。\u003c/td>\u003ctd>总线已经发了，但 CanTp 状态不继续。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">CanTp_RxIndication()\u003c/span>\u003c/td>\u003ctd>一个 Rx N-PDU 进入 CanTp。\u003c/td>\u003ctd>CANoe 看见帧，但 CanTp 没收到。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">PduR_CanTpStartOfReception()\u003c/span>\u003c/td>\u003ctd>开始接收并确认 Rx Buffer。\u003c/td>\u003ctd>FF 已进入 CanTp，但完整接收流程没建立。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">PduR_CanTpCopyRxData()\u003c/span>\u003c/td>\u003ctd>把每一块 Rx 数据交给上层。\u003c/td>\u003ctd>CF 在进，但上层数据没有持续累积。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">PduR_CanTpRxIndication()\u003c/span>\u003c/td>\u003ctd>通知上层整个 N-SDU 接收结束。\u003c/td>\u003ctd>全部收齐，但上层不知道完成。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>5. Buffer 机制\u003c/h2>\n\u003cp>\u003cstrong>CanTp 主要做流式搬运：\u003c/strong>发送时向 PduR 一块一块取；接收时一块一块交给 PduR，不要把它理解成自己先囤完整几 KB 数据。\u003c/p>\n\u003cdiv class=\"grid2\">\u003cdiv class=\"card\">\u003cb>Rx\u003c/b>\u003cpre>收到 FF\n→ StartOfReception()\n  “我要收这么大的 N-SDU，有没有地方放？”\n→ CopyRxData()\n  FF/CF 数据一块一块交上去\n→ RxIndication()\n  整个 N-SDU 收完\u003c/pre>\u003c/div>\n\u003cdiv class=\"card\">\u003cb>Tx\u003c/b>\u003cpre>上层要发大 N-SDU\n→ CanTp_Transmit()\n→ CopyTxData()\n  先拿 FF 数据\n→ CopyTxData()\n  再拿下一个 CF 数据\n→ ...\n→ TxConfirmation()\n  整个 N-SDU 完成\u003c/pre>\u003c/div>\u003c/div>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>BufReq 返回\u003c/th>\u003cth>人话\u003c/th>\u003cth>联想\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>BUFREQ_OK\u003c/b>\u003c/td>\u003ctd>可以，Buffer / 数据准备好了。\u003c/td>\u003ctd>继续。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>BUFREQ_E_BUSY\u003c/b>\u003c/td>\u003ctd>现在暂时没准备好，稍后再试。\u003c/td>\u003ctd>Tx 时尤其联想到 \u003cb>N_Cs\u003c/b>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>BUFREQ_E_OVFL\u003c/b>\u003c/td>\u003ctd>数据太大，接收 Buffer 放不下。\u003c/td>\u003ctd>Receiver 无法继续正常接收。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>BUFREQ_E_NOT_OK\u003c/b>\u003c/td>\u003ctd>这次 Buffer / 数据操作无法完成。\u003c/td>\u003ctd>当前传输不能正常继续。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>7. EB：CanTpRxNSdu 核心配置（当前项目）\u003c/h2>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>配置项\u003c/th>\u003cth>当前值\u003c/th>\u003cth>人话解释\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>CanTpBs\u003c/b>\u003c/td>\u003ctd>0\u003c/td>\u003ctd>本 ECU 作为 Receiver 时告诉 Sender：\u003cstrong>剩余 CF 可连续发完，不因 BS 再停下来等 FC。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpNar\u003c/b>\u003c/td>\u003ctd>0.025 s\u003c/td>\u003ctd>\u003cb>N_Ar = 25 ms\u003c/b>：Receiver 发 FC 这一帧的发送完成时间约束。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpNbr\u003c/b>\u003c/td>\u003ctd>0.1 s\u003c/td>\u003ctd>\u003cb>N_Br = 100 ms\u003c/b>：Receiver 到了要发 FC 的阶段，准备 Buffer / FC 的时间约束。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpNcr\u003c/b>\u003c/td>\u003ctd>0.15 s\u003c/td>\u003ctd>\u003cb>N_Cr = 150 ms\u003c/b>：Receiver 等下一 CF 的时间约束。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxNSduId\u003c/b>\u003c/td>\u003ctd>0\u003c/td>\u003ctd>完整 Rx N-SDU 的 CanTp Handle / 编号；\u003cstrong>不是 CAN ID。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxPaddingActivation\u003c/b>\u003c/td>\u003ctd>CANTP_ON\u003c/td>\u003ctd>这条 Rx N-SDU 开启 Padding 处理；Padding 填充值看 General 的 \u003cspan class=\"code\">CanTpPaddingByte\u003c/span>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxTaType\u003c/b>\u003c/td>\u003ctd>CANTP_PHYSICAL\u003c/td>\u003ctd>这条 RxNSdu 是\u003cstrong>物理寻址\u003c/strong>，即针对本 ECU 的 1:1 请求。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxWftMax\u003c/b>\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Receiver 最多允许多少次 \u003cb>FC WAIT(31)\u003c/b>；不能无限 WAIT。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpSTmin\u003c/b>\u003c/td>\u003ctd>0.01 s\u003c/td>\u003ctd>Receiver 要求对方：\u003cstrong>CF 之间至少 10 ms\u003c/strong>；与 BS=0 合起来，典型 FC 是 \u003cspan class=\"code\">30 00 0A\u003c/span>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxNSduRef\u003c/b>\u003c/td>\u003ctd>DIAG_REQ\u003c/td>\u003ctd>上层眼中的\u003cstrong>完整诊断 Request N-SDU\u003c/strong>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxAddressingFormat\u003c/b>\u003c/td>\u003ctd>CANTP_STANDARD\u003c/td>\u003ctd>地址由 CAN ID 区分；Payload \u003cstrong>Byte0 直接是 PCI\u003c/strong>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxNPduRef\u003c/b>\u003c/td>\u003ctd>DIAG_REQ_2001R\u003c/td>\u003ctd>SF / FF / CF 这些\u003cstrong>Request DATA 从这里收\u003c/strong>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxFcNPduRef\u003c/b>\u003c/td>\u003ctd>DIAG_RES_2009T\u003c/td>\u003ctd>收到多帧 Request 的 FF 后，\u003cstrong>FC 从这里发\u003c/strong>。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>8. EB：CanTpTxNSdu 核心配置（当前项目）\u003c/h2>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>配置项\u003c/th>\u003cth>当前值\u003c/th>\u003cth>人话解释\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>CanTpNas\u003c/b>\u003c/td>\u003ctd>0.025 s\u003c/td>\u003ctd>\u003cb>N_As = 25 ms\u003c/b>：Sender 发一个 DATA N-PDU 时，这一帧的发送完成时间约束。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpNbs\u003c/b>\u003c/td>\u003ctd>0.075 s\u003c/td>\u003ctd>\u003cb>N_Bs = 75 ms\u003c/b>：Sender 发 FF / 一个 Block 后，\u003cstrong>等待对方 FC\u003c/strong>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpNcs\u003c/b>\u003c/td>\u003ctd>0.9 s\u003c/td>\u003ctd>\u003cb>N_Cs = 900 ms\u003c/b>：到了继续发 CF 的阶段，准备下一块数据 / 下一 CF 的时间约束。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTc\u003c/b>\u003c/td>\u003ctd>ON\u003c/td>\u003ctd>这条 Tx N-SDU 允许 transmission cancellation；实际对外 Cancel API 是否生成还要同时看 General / Vendor 配置。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxDl\u003c/b>\u003c/td>\u003ctd>1\u003c/td>\u003ctd>旧/遗留参数；\u003cstrong>不要把 1 理解成 CAN 帧只有 1 Byte\u003c/strong>，也不要靠它判断实际 CAN 帧长度。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxNSduId\u003c/b>\u003c/td>\u003ctd>0\u003c/td>\u003ctd>完整 Tx N-SDU 的 CanTp Handle / 编号；\u003cstrong>不是 CAN ID。\u003c/strong>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxPaddingActivation\u003c/b>\u003c/td>\u003ctd>CANTP_ON\u003c/td>\u003ctd>这条 Tx N-SDU 开启 Padding；未使用 Byte 用 General 的 PaddingByte 补齐。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxTaType\u003c/b>\u003c/td>\u003ctd>CANTP_PHYSICAL\u003c/td>\u003ctd>这条 TxNSdu 是\u003cstrong>物理响应\u003c/strong>；CanTp 标准 Tx 侧使用 Physical 通信。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxNSduRef\u003c/b>\u003c/td>\u003ctd>DIAG_RES\u003c/td>\u003ctd>上层眼中的\u003cstrong>完整诊断 Response N-SDU\u003c/strong>；CanTp 再把它拆成 SF / FF / CF。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxAddressingFormat\u003c/b>\u003c/td>\u003ctd>CANTP_STANDARD\u003c/td>\u003ctd>地址由 CAN ID 区分；Payload Byte0 直接是 PCI。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpRxFcNPduRef\u003c/b>\u003c/td>\u003ctd>DIAG_REQ_2001R\u003c/td>\u003ctd>ECU 发多帧 Response 时，\u003cstrong>Tester 的 FC 从这里收\u003c/strong>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxNPduRef\u003c/b>\u003c/td>\u003ctd>DIAG_RES_D_2009T\u003c/td>\u003ctd>Response 的 SF / FF / CF \u003cstrong>从这条 Tx N-PDU 发\u003c/strong>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpTxNPduConfirmationPduId\u003c/b>\u003c/td>\u003ctd>0\u003c/td>\u003ctd>CanIf 回调 \u003cspan class=\"code\">CanTp_TxConfirmation()\u003c/span> 时，CanTp 用它知道哪条 Tx N-PDU 已完成。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>9. EB General：真正值得以后查的配置\u003c/h2>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>配置\u003c/th>\u003cth>开启时\u003c/th>\u003cth>关闭时\u003c/th>\u003cth>对应 API / 影响\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>CanTpChangeParameterApi\u003c/b>\u003cbr/>\u003cspan class=\"small\">当前 OFF\u003c/span>\u003c/td>\u003ctd>允许运行时修改 Rx N-SDU 的 BS / STmin。\u003c/td>\u003ctd>BS/STmin 按 EB 配置使用，不能通过该标准 API 动态修改。\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_ChangeParameter(...)\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpReadParameterApi\u003c/b>\u003cbr/>\u003cspan class=\"small\">当前 OFF\u003c/span>\u003c/td>\u003ctd>允许读取当前 Rx N-SDU 的 BS / STmin。\u003c/td>\u003ctd>不提供该读取能力。\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_ReadParameter(...)\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpCancelReceiveApi\u003c/b>\u003cbr/>\u003cspan class=\"small\">当前 OFF\u003c/span>\u003c/td>\u003ctd>上层可主动终止正在进行的整个 N-SDU 接收。\u003c/td>\u003ctd>不提供该标准 Cancel Receive API。\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_CancelReceive(...)\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpCancelTransmitApi\u003c/b>\u003cbr/>\u003cspan class=\"small\">当前 OFF\u003c/span>\u003c/td>\u003ctd>上层可主动终止正在进行的整个 N-SDU 发送。\u003c/td>\u003ctd>不提供该标准 Cancel Transmit API。\u003c/td>\u003ctd>\u003cspan class=\"code\">CanTp_CancelTransmit(...)\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpChangeTxParameterApi\u003c/b>\u003cbr/>\u003cspan class=\"small\">当前 OFF\u003c/span>\u003c/td>\u003ctd>启用发送侧参数动态修改相关能力（EB/Vendor 扩展项）。\u003c/td>\u003ctd>不启用该发送侧动态修改能力。\u003c/td>\u003ctd>\u003cb>精确 API 名称和可修改参数以当前 Vendor 的 CanTp.h / EB Help 为准；不要凭字段名猜 API。\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpPaddingByte\u003c/b>\u003c/td>\u003ctd colspan=\"2\">开启 Tx Padding 时，未使用的 CAN Payload Byte 用该值补齐。\u003c/td>\u003ctd>当前项目：\u003cb>0x00\u003c/b>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpFlexibleDataRateSupport\u003c/b>\u003c/td>\u003ctd>CanTp 支持 CAN FD。\u003c/td>\u003ctd>不使用该 CAN FD 支持能力。\u003c/td>\u003ctd>当前项目：\u003cb>ON\u003c/b>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CanTpDynIdSupport / GenericConnectionSupport\u003c/b>\u003c/td>\u003ctd>支持 MetaData / 动态寻址或通用连接类高级场景。\u003c/td>\u003ctd>普通固定诊断连接按静态关联工作。\u003c/td>\u003ctd>当前项目 OFF；固定 DIAG_REQ / DIAG_RES 一般不用。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"note\">\u003cb>Cancel ≠ Timeout：\u003c/b>Cancel 是上层主动终止；\u003cspan class=\"code\">N_Bs / N_Cr\u003c/span> 等 timeout 是协议传输过程超时导致失败。\u003c/div>\n\u003cp class=\"small\">DevErrorDetect、VersionInfo、MultiCore、Relocatable PB、MaxChannel、GPT、Stall、Dedicated Processing 等实现/资源类开关不放进核心区；普通 CanTp 报文与诊断学习中优先级低。\u003c/p>\u003c/section>\u003csection class=\"section\">\u003ch2>10. CanTpConfig / Channel\u003c/h2>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"card\">\u003cb>CanTpConfig\u003c/b>\u003cbr/>一整套 CanTp 配置集合。\u003cstrong>不要把“两个 CanTpConfig”机械理解成一个 Physical、一个 Functional。\u003c/strong>判断 Physical/Functional 看 TaType。\u003c/div>\n\u003cdiv class=\"card\">\u003cb>CanTpChannel\u003c/b>\u003cbr/>CanTp 跑 TP 会话用的\u003cstrong>状态机 / 运行资源\u003c/strong>：记录状态、SN、剩余长度、BS Counter、Timer、当前 N-SDU 等。\u003c/div>\u003c/div>\n\u003cdiv class=\"note\">\u003cstrong>NSdu = 配置好的通信连接；Channel = 真正运行连接时用的状态机工作台。\u003c/strong>一个 Channel 可以关联多个 N-SDU，从而复用内部资源。\u003c/div>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>Channel Mode\u003c/th>\u003cth>人话\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>FULL_DUPLEX\u003c/b>\u003c/td>\u003ctd>同一 Channel 的 Tx / Rx 方向可按全双工方式并行处理。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>HALF_DUPLEX\u003c/b>\u003c/td>\u003ctd>同一 Channel 的 Tx / Rx 不按全双工方式同时独立运行，会受到互斥/资源限制。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>12. EB 配置一条 CanTp 连接：最短检查顺序\u003c/h2>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>顺序\u003c/th>\u003cth>确认什么\u003c/th>\u003cth>核心问题\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>诊断通信定义\u003c/td>\u003ctd>Request / Response CAN ID、11/29 bit、Classic/FD、Physical/Functional、Addressing、Padding。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>CanIf Rx/Tx PDU\u003c/td>\u003ctd>Request Rx PDU、Response Tx PDU 是否已经存在且方向正确。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>CanTp RxNSdu\u003c/td>\u003ctd>\u003cstrong>DATA 从哪个 RxNPdu 收？FC 从哪个 TxFcNPdu 发？\u003c/strong>再配 BS、STmin、WFTmax、N_Ar/N_Br/N_Cr、TaType、Addressing。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4\u003c/td>\u003ctd>CanTp TxNSdu\u003c/td>\u003ctd>\u003cstrong>DATA 从哪个 TxNPdu 发？FC 从哪个 RxFcNPdu 收？\u003c/strong>再配 N_As/N_Bs/N_Cs、TaType、Addressing、Padding。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>PduR\u003c/td>\u003ctd>接收：\u003cspan class=\"code\">CanTp → PduR → DCM\u003c/span>；发送：\u003cspan class=\"code\">DCM → PduR → CanTp\u003c/span> 的 N-SDU 路由是否对应。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6\u003c/td>\u003ctd>整链对应\u003c/td>\u003ctd>完整 N-SDU、底层 N-PDU、CanIf PDU、CAN ID 的方向是否全部一致。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>13. CANoe 看诊断报文：最短读法\u003c/h2>\n\u003ctable class=\"tight\">\u003cthead>\u003ctr>\u003cth>看到什么\u003c/th>\u003cth>立刻想到什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">03 22 F1 90 ...\u003c/span>\u003c/td>\u003ctd>SF；UDS 长度 3；真正 UDS 是 \u003cspan class=\"code\">22 F1 90\u003c/span>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">10 24 ...\u003c/span>\u003c/td>\u003ctd>FF；完整 N-SDU 长度 \u003cspan class=\"code\">0x024 = 36\u003c/span> Byte。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">30 08 0A\u003c/span>\u003c/td>\u003ctd>CTS；最多连续 8 个 CF；CF 最小间隔 10 ms。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cspan class=\"code\">21 22 23 ... 2F 20 21\u003c/span>\u003c/td>\u003ctd>CF 的 SN 连续递增，F 后回 0。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Functional Request\u003c/td>\u003ctd>只能 SF；若 ECU 回很多数据，Response 用 Physical 多帧。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CAN FD \u003cspan class=\"code\">00 LL ...\u003c/span>\u003c/td>\u003ctd>可能是扩展 SF_DL；不要机械套 Classic CAN 的低 4 bit 长度规则。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/section>\u003csection class=\"section\">\u003ch2>14. 最容易混淆的 12 句话\u003c/h2>\n\u003col style=\"margin:4px 0 6px 20px;padding:0\">\n\u003cli>\u003cb>N-SDU 是整个数据；N-PDU 是一帧一帧的数据。\u003c/b>\u003c/li>\n\u003cli>\u003cb>FF 中长度是整个 N-SDU 总长度，不是 FF 本帧长度。\u003c/b>\u003c/li>\n\u003cli>\u003cb>30=继续，31=等待，32=接收不了/失败。\u003c/b>\u003c/li>\n\u003cli>\u003cb>BS=0 不是不许发，而是剩余 CF 不再因 Block Size 等新 FC。\u003c/b>\u003c/li>\n\u003cli>\u003cb>STmin 管别太快；N_Cr 管也别让我等太久。\u003c/b>\u003c/li>\n\u003cli>\u003cb>Receiver 决定 BS/STmin，Sender 遵守。\u003c/b>\u003c/li>\n\u003cli>\u003cb>RxNSdu = 收 DATA + 发 FC；TxNSdu = 发 DATA + 收 FC。\u003c/b>\u003c/li>\n\u003cli>\u003cb>TaType 决定 Physical/Functional；AddressingFormat 决定地址放在哪里。\u003c/b>\u003c/li>\n\u003cli>\u003cb>Functional Request 只用 SF；需要多帧的 Response 走 Physical Tx。\u003c/b>\u003c/li>\n\u003cli>\u003cb>NSduId / NPduId / ConfirmationPduId 都不是 CAN ID。\u003c/b>\u003c/li>\n\u003cli>\u003cb>CanTp_TxConfirmation 是一个 N-PDU 完成；PduR_CanTpTxConfirmation 是整个 N-SDU 完成。\u003c/b>\u003c/li>\n\u003cli>\u003cb>P2/P2* 属于 UDS 响应时间；N_As~N_Cr 属于 CanTp 传输时间。\u003c/b>\u003c/li>\n\u003c/ol>\u003c/section>\u003csection class=\"section\">\u003ch2>15. 规范依据\u003c/h2>\n\u003cp>核心概念依据 AUTOSAR Classic Platform \u003cb>Specification of CAN Transport Layer\u003c/b> 与 \u003cb>Specification of PDU Router\u003c/b>；EB 字段中的具体数值与命名来自当前项目截图。Vendor 私有/实现型参数若无标准依据，不在核心笔记中强行解释。\u003c/p>\n\u003cp class=\"small\">AUTOSAR CP R24-11：Specification of CAN Transport Layer；Specification of PDU Router。\u003c/p>\u003c/section>\n\u003c/main>\u003c/body>\u003c/html>","notes/06/6.2.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>6.2 · Can Driver 与 CanIf：Controller/PDU 模式和映射\u003c/title>\u003cstyle>\n\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--navy:#1b2340;--accent:#4f88d8}\nbody{color:#1a1c2e;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n#wrap{margin:auto}#main{background:white;box-shadow:0 1px 6px #0000001a}\n#main h1{border-bottom:2px solid #1b2340;padding-bottom:10px;margin-bottom:14px;color:#0d1530}\n#main h2{color:#152060;border-bottom:1.5px solid #3a6ab8;padding-bottom:5px}\n#main h3{color:#1a346a;padding-left:9px;border-left:3px solid var(--accent)}\n#main h4{color:#253872}#main ul,#main ol{padding-left:22px}\n#main hr{border:0;border-top:1px solid #dde2ee;margin:10px 0}\n#main pre{background:#f2f4f8;border-left:3px solid #9aadd0;border-radius:0 4px 4px 0;margin:8px 0;overflow-wrap:anywhere}\n#main pre,#main code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}\n#main code{background:#e6ecf7;padding:0 3px;border-radius:2px;overflow-wrap:anywhere}\n#main pre code{background:none;padding:0;font-size:inherit}\n#main blockquote{border-left:3px solid #aab8d8;padding:8px 12px;background:#f5f7fc;color:#555}\n#main table{width:100%;border-collapse:c : 3pt 0; }\n\n#main .nm-state-table th, #main .nm-state-table td { padding: 2.2px 4px; }\n\n#main .nm-state-note { margin: 2pt 0; padding: 4px 7px; background: #f7f9fe; border-left: 3px solid #4f88d8; line-height: 1.28; }\n\n  #main .nm-state-svg { margin: 2pt 0; }\n\n  #main .nm-state-table { font-size: 7.15pt; line-height: 1.12; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: 1.8px 3px; }\n\n  #main .nm-state-svg { margin: 1pt 0; }\n\n  #main .nm-state-table { font-size: 6.45pt; line-height: 1.04; margin: .8pt 0; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: .8px 1.5px; }\n\n:root{--bar-h:0px}\nbody{font-size:15px;line-height:1.6;background:#edf1f6}\n#wrap{max-width:960px;padding:18px 14px 32px}\n#main{padding:20px 18px;border-radius:12px;overflow-wrap:anywhere}\n#main h1{font-size:23px;line-height:1.35;text-align:left}\n#main h2{font-size:20px;line-height:1.4;margin:24px 0 12px}\n#main h3{font-size:17px;line-height:1.4;margin:18px 0 8px}\n#main h4{font-size:15px}\n#main p,#main li{font-size:15px;line-height:1.65;margin:7px 0}\n#main code{font-size:13px}\n#main pre,#main pre.dense-pre{font-size:13px;line-height:1.55;padding:10px;white-space:pre-wrap}\n#main .param-card pre,#main .flow-card pre,#main .compact-card pre{font-size:13px;line-height:1.55}\n#main table{font-size:13px;line-height:1.55;margin:12px 0}\n#main th,#main td{padding:8px 7px}\n#main .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}\n#main .table-scroll>table{min-width:620px}\n#main .param-title,#main .flow-title,#main .card-title{font-size:15px;line-height:1.5;padding:8px}\n#main .chapter-dense-grid .param-card table,#main .chapter-quickref table{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card pre,#main .chapter-quickref pre{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card h4{font-size:15px}\n#main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{gap:12px}\n#main .nm-state-svg{min-width:800px}\n#main .figure-scroll{overflow-x:auto}\n#main .lesson-toc{padding:12px 16px;background:#f3f6fc;border-radius:8px}\n#main .lesson-toc a{display:block;padding:6px 0;color:#27558a}\n#main .source-note{font-size:13px;color:#52627c;background:#f3f6fc;padding:12px;border-left:3px solid #4f88d8}\n@media(max-width:600px){\n #main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{grid-template-columns:1fr}\n #main{padding:18px 14px}#wrap{padding:12px 8px 24px}\n #main .table-scroll:before{content:'左右滑动查看表格';display:block;font-size:12px;color:#65708a;margin-top:8px}\n #main .figure-scroll:before{content:'左右滑动查看完整状态图';display:block;font-size:12px;color:#65708a;margin-top:8px}\n}\n@media print{\n body{font-size:10pt;background:white}#wrap,#main{padding:0}\n #main .lesson-toc{display:none}#main .table-scroll,#main .figure-scroll{overflow:visible}\n #main .table-scroll>table,#main .nm-state-svg{min-width:0}\n #main h2.major-break{break-before:auto!important;page-break-before:auto!important}\n #main table,#main p,#main li{font-size:9pt}#main pre,#main code{font-size:8pt}\n}\n\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"wrap\">\u003cmain id=\"main\">\n\u003ch1>6.2 · Can Driver 与 CanIf：Controller/PDU 模式和映射\u003c/h1>\n\u003cp class=\"source-note\">整理自 NM 配置打印版笔记。DF_XY、ESC_M / ESC_S、参数数值及开关状态均为原笔记中的项目示例，请结合实际项目核对。本笔记覆盖本课相关内容，不代表完整课程教案。\u003c/p>\n\u003cnav class=\"lesson-toc\" aria-label=\"本课目录\">\u003ca href=\"#11-CanIf-配置项\">11. CanIf 配置项\u003c/a>\u003c/nav>\n\u003ch2 id=\"11-CanIf-配置项\">11. CanIf 配置项\u003c/h2>\n\u003cp>CanIf 是 CAN Interface。它在 CanNm/CanTp/Com 等上层模块和 CAN Driver 之间，负责 PDU 到 CAN 硬件对象的映射。\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>CanNm / CanTp / Com\u003c/strong>\n    -&gt; CanIf PDU\n        -&gt; HTH / HRH\n            -&gt; CAN Driver / Controller\u003cbr>\u003c/code>\u003cstrong style=\"background-color: initial; font-size: inherit;\">CanNm 决定何时发 NM。\u003cbr>\u003c/strong>\u003cstrong style=\"background-color: initial; font-size: inherit;\">CanIf 决定这帧 NM 用哪个 CAN ID、走哪个 HTH、从哪个 HRH 收、回调给谁\u003c/strong>\u003c/pre>\n\u003cp>如果收不到 NM：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>1. CAN ID 是否落在 CanIfRxPduCanIdRangeLowerCanId / CanIfRxPduCanIdRangeUpperCanId 区间内。\u003c/strong>\n\u003cstrong>2. CanIfRxPduTargetPduID 是否对到目标 Rx PDU。\u003c/strong>\n\u003cstrong>3. CanIfRxPduUpperLayerRef 是否指向 CanNm。\u003c/strong>\n\u003cstrong>4. DLC 是否符合预期。\u003c/strong>\n\u003cstrong>5. CanNmRxPduRef 是否引用这个 Rx PDU。\u003c/strong>\n\u003cstrong>6. 是否调用到 CanNm_RxIndication。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>如果发不出 NM：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>1. ComM 是否 FullCom。\u003c/strong>\n\u003cstrong>2. CanSM Controller 是否 STARTED。\u003c/strong>\n\u003cstrong>3. CanNm 是否到了发送状态。\u003c/strong>\n\u003cstrong>4. TxPduId / CanNmTxPduRef(EB) 是否引用正确 Tx PDU。\u003c/strong>\n\u003cstrong>5. CanIf Tx PDU 是否 ONLINE。\u003c/strong>\n\u003cstrong>6. HTH 是否绑定正确 Controller。\u003c/strong>\n\u003cstrong>7. Tx buffer 是否满。\u003c/strong>\n\u003cstrong>8. 是否有 TxConfirmation。\u003c/strong>\u003c/code>\u003c/pre>\n\u003ch3 id=\"11-3-CanIfPublicRangeReceptionSupport-Range-Reception-Support-EB\">11.3 CANIF_RANGE_RECEPTION / CanIfPublicRangeReceptionSupport(EB)\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>EB 区间接收对象：\u003c/strong>CanIfRxPduCanIdRange\n\u003cstrong>EB 实际字段：\u003c/strong>CanIfRxPduCanIdRangeLowerCanId / CanIfRxPduCanIdRangeUpperCanId / CanIfRxPduTargetPduID / CanIfRxPduUpperLayerRef\u003c/code>\u003c/pre>\n\u003cp>当前：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">true\u003c/strong>\u003c/p>\n\u003cp>含义：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">CanIf 支持范围接收。\u003c/strong>\u003c/p>\n\u003cp>影响：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">可以用一个范围匹配一组 CAN ID。\u003c/strong>\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">但范围、HRH、上层 PDU 引用必须准确。\u003c/strong>\u003c/p>\n\u003cp>风险：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">范围太宽:\u003c/strong>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">可能误收不该给 CanNm 的报文。\u003c/span>\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">范围太窄:\u003c/strong>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">对端 NM ID 可能收不到。\u003c/span>\u003c/p>\n\u003ch3 id=\"11-4-CanIfPublicTxBuffering-Tx-Buffering-EB\">11.4 CANIF_PUBLIC_TX_BUFFERING / CanIfPublicTxBuffering(EB)\u003c/h3>\n\u003cp>当前：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">true\u003c/strong>\u003c/p>\n\u003cp>含义：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">CanIf 支持 Tx buffering。\u003c/strong>\u003c/p>\n\u003cp>影响：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">短时间发送拥塞时，CanIf 可以缓存待发 PDU。\u003c/strong>\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">但 buffer 不足时仍可能发送失败或延迟。\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">偶发 NM 发不出或 TxConfirmation 超时：\u003c/strong>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">查 Tx buffer 配置。\u003c/span>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">查 HTH 是否拥塞。\u003c/span>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">查总线负载。\u003c/span>\u003c/p>\n\u003ch3 id=\"11-5-CanIfPrivateDlcCheck-DLC-Check-EB\">11.5 CANIF_DLC_CHECK_ENABLED / CanIfPrivateDlcCheck(EB)\u003c/h3>\n\u003cp>当前：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">false\u003c/strong>\u003c/p>\n\u003cp>含义：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">CanIf 不做严格 DLC 检查。\u003c/strong>\u003c/p>\n\u003cp>影响：\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">DLC 不匹配的问题可能不会在 CanIf 层被挡住。\u003c/strong>\u003cstrong style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">错误可能到 CanNm/CanTp/上层才表现出来。\u003c/strong>\u003c/p>\n\u003ch3 id=\"11-6-CanIf-PN-Wakeup-开关\">11.6 CanIf PN / Wakeup 开关\u003c/h3>\n\u003cp>当前：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>CANIF_PUBLIC_PN_SUPPORT / CanIfPublicPnSupport(EB) = false\u003c/strong>\n\u003cstrong>PublicCtrlWakeupSupport / CanIfPublicCtrlWakeupSupport(EB) = false\u003c/strong>\n\u003cstrong>CANIF_CANTRCV_WAKEUP_SUPPORT / CanIfPublicTrcvWakeupSupport(EB) = false\u003c/strong>\n\u003cstrong>CANIF_WAKEUP_CHECK_VALID_BY_NM / CanIfPublicWakeupCheckValidByNM(EB) = true\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>含义：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前 CanIf 不启用 PN 过滤支持。\u003c/strong> \u003cstrong>当前也不通过 CanIf 控制器/收发器唤醒路径。\u003c/strong>\n\u003cstrong>虽然 WakeupCheckValidByNM = true，但相关硬件唤醒和 CarWakeUp 链路没有完整打开。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>诊断帧物理唤醒：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>不要只看 CANIF_WAKEUP_CHECK_VALID_BY_NM / CanIfPublicWakeupCheckValidByNM(EB)。\u003c/strong>\n\u003cstrong>如果 Controller/Trcv wakeup support 关闭，且硬件按任意 CAN 活动唤醒，\u003c/strong>\n\u003cstrong>软件层未必能阻止第一次唤醒。\u003c/strong>\u003c/code>\u003c/pre>\n\u003ch3 id=\"11-7-CanIf-常见故障定位\">11.7 CanIf 常见故障定位\u003c/h3>\n\u003cp>收不到 NM：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>1. 对端 CAN ID 是否落在 CanIfRxPduCanIdRangeLowerCanId / CanIfRxPduCanIdRangeUpperCanId 区间内。\u003c/strong>\n\u003cstrong>2. CanIfRxPduTargetPduID 是否对到目标 Rx PDU。\u003c/strong>\n\u003cstrong>3. CanIfRxPduUpperLayerRef 是否指向 CanNm。\u003c/strong>\n\u003cstrong>4. Driver filter / Controller 接收路径是否放行。\u003c/strong>\n\u003cstrong>5. CanNmRxPduRef 是否对上。\u003c/strong>\n\u003cstrong>6. 是否进入 CanNm_RxIndication。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>发不出 NM：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>1. TxPduId / CanNmTxPduRef(EB) 是否对上 CanIf Tx PDU。\u003c/strong>\n\u003cstrong>2. HTH 是否对应正确 Controller。\u003c/strong>\n\u003cstrong>3. CanSM 是否 STARTED。\u003c/strong>\n\u003cstrong>4. PDU mode 是否 ONLINE。\u003c/strong>\n\u003cstrong>5. Tx buffer 是否足够。\u003c/strong>\n\u003cstrong>6. CanNm_TxConfirmation 是否回来。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>诊断不通：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>1. 诊断 Rx/Tx PDU 是否配置在 CanIf。\u003c/strong>\n\u003cstrong>2. Upper Layer 是否 CanTp。\u003c/strong>\n\u003cstrong>3. CanTp/PduR/DCM 路由是否正确。\u003c/strong>\n\u003cstrong>4. Controller 是否 STARTED。\u003c/strong>\n\u003cstrong>5. PDU mode 是否 ONLINE。\u003c/strong>\u003c/code>\u003c/pre>\n\u003ch3 id=\"11-8-CanIf-章节口诀\">11.8 CanIf 章节口诀\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>CanIf 是 PDU 到 CAN 硬件对象的桥。\u003c/strong>\n\u003cstrong>CAN ID、DLC、HRH、HTH、Upper Layer 都在这里决定。\u003c/strong>\n\u003cstrong>RxPduId / CanNmRxPduRef(EB) / TxPduId / CanNmTxPduRef(EB) 必须和 CanIf PDU 对齐。\u003c/strong>\n\u003cstrong>收不到先查 Rx ID/HRH/UL/RxIndication。\u003c/strong>\n\u003cstrong>发不出先查 Tx PDU/HTH/PDU mode/TxConfirmation。\u003c/strong>\u003c/code>\u003c/pre>\n\u003c/main>\u003c/div>\u003c/body>\u003c/html>\n","notes/08/8.1.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cm 7f35; }\n\n#main .nm-wide-svg .wide-box-note { fill: #fff; stroke: #d8e1f2; stroke-width: 1; }\n\n#main .nm-wide-svg .box-title { font-size: 13px; font-weight: 800; fill: #17213a; }\n\n#main .nm-wide-svg .box-note { font-size: 10.8px; fill: #38445c; }\n\n#main .nm-wide-svg .flow-line { stroke: #1f4e87; stroke-width: 1.75; fill: none; marker-end: url(#nmWideArrow); }\n\n#main .nm-wide-svg .flow-line-warn { stroke: #b06a00; stroke-width: 1.75; fill: none; marker-end: url(#nmWideArrowWarn); }\n\n#main .nm-wide-svg .flow-line-soft { stroke: #60708c; stroke-width: 1.45; stroke-dasharray: 4 3; fill: none; marker-end: url(#nmWideArrowSoft); }\n\n#main .nm-wide-svg .line-label rect { fill: #fff; stroke: #b9cbe5; stroke-width: .9; opacity: .98; }\n\n#main .nm-wide-svg .line-label.warn rect { stroke: #d6a25a; }\n\n#main .nm-wide-svg .line-label text { font-size: 10.8px; font-weight: 800; fill: #17213a; }\n\n  #main .nm-wide-svg .wide-title { font-size: 15px; }\n\n  #main .nm-wide-svg .box-title { font-size: 12.4px; }\n\n  #main .nm-wide-svg .box-note, #main .nm-wide-svg .line-label text { font-size: 10px; }\n #main .nm-clean-svg .box-title { font-size: 12.4px; }\n #main .nm-clean-svg .box-note { font-size: 10px; }\n\n#main .nm-state-table { font-size: 7.85pt; line-height: 1.18; margin: 3pt 0; }\n\n#main .nm-state-table th, #main .nm-state-table td { padding: 2.2px 4px; }\n\n#main .nm-state-note { margin: 2pt 0; padding: 4px 7px; background: #f7f9fe; border-left: 3px solid #4f88d8; line-height: 1.28; }\n\n  #main .nm-state-svg { margin: 2pt 0; }\n\n  #main .nm-state-table { font-size: 7.15pt; line-height: 1.12; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: 1.8px 3px; }\n\n  #main .nm-state-svg { margin: 1pt 0; }\n\n  #main .nm-state-table { font-size: 6.45pt; line-height: 1.04; margin: .8pt 0; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: .8px 1.5px; }\n\n:root{--bar-h:0px}\nbody{font-size:15px;line-height:1.6;background:#edf1f6}\n
