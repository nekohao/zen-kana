t:'左右滑动查看完整状态图';display:block;font-size:12px;color:#65708a;margin-top:8px}\n}\n@media print{\n body{font-size:10pt;background:white}#wrap,#main{padding:0}\n #main .lesson-toc{display:none}#main .table-scroll,#main .figure-scroll{overflow:visible}\n #main .table-scroll>table,#main .nm-state-svg{min-width:0}\n #main h2.major-break{break-before:auto!important;page-break-before:auto!important}\n #main table,#main p,#main li{font-size:9pt}#main pre,#main code{font-size:8pt}\n}\n\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"wrap\">\u003cmain id=\"main\">\n\u003ch1>8.1 · ComM：通信模式、User/Channel 与上下游关系\u003c/h1>\n\u003cp class=\"source-note\">整理自 NM 配置打印版笔记。DF_XY、ESC_M / ESC_S、参数数值及开关状态均为原笔记中的项目示例，请结合实际项目核对。本笔记覆盖本课相关内容，不代表完整课程教案。\u003c/p>\n\u003cnav class=\"lesson-toc\" aria-label=\"本课目录\">\u003ca href=\"#1-总体心智模型\">1. 总体心智模型\u003c/a>\u003ca href=\"#5-DCM-通过-ComM-保持-释放通信\">5. DCM 通过 ComM 保持/释放通信\u003c/a>\u003ca href=\"#6-ComM-FullCom-阻塞速查\">6. ComM FullCom 阻塞速查\u003c/a>\u003ca href=\"#9-ComM-配置项\">9. ComM 配置项\u003c/a>\u003c/nav>\n\u003ch2 class=\"major-break\" id=\"1-总体心智模型\">1. 总体心智模型\u003c/h2>\n\u003cp>这几层不要混：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>DCM: \u003c/strong>管诊断协议本身，例如 UDS 会话、服务、S3 超时、诊断请求/响应。\n\u003cstrong>ComM: \u003c/strong>管通信模式。决定某个通信通道是 NoCom、SilentCom 还是 FullCom。\n\u003cstrong>CanSM :\u003c/strong>管 CAN 控制器状态。把 ComM 的模式请求变成 CanIf/CanDrv/CanTrcv 的 Start、Stop、Sleep。\n\u003cstrong>Nm: \u003c/strong>NM 抽象层。ComM 通常通过 Nm API 管网络，不直接绑死 CanNm。\n\u003cstrong>CanNm: \u003c/strong>CAN NM 协议层。负责 NM 报文收发、Repeat、Normal、ReadySleep、PrepareBusSleep、BusSleep。\n\u003cstrong>CanIf: \u003c/strong>CAN 接口层。负责 CAN ID、PDU、HRH/HTH、上层回调，把 NM 报文送到 CanNm。\u003c/code>\u003c/pre>\n\u003cp>一句话：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>DCM 管诊断，ComM 管通信授权，CanSM 管控制器，Nm 做抽象，CanNm 跑 NM 协议，CanIf 接 CAN 报文。\u003c/strong>\u003c/code>\u003c/pre>\n\u003ch2 id=\"5-DCM-通过-ComM-保持-释放通信\">5. DCM 通过 ComM 保持/释放通信\u003c/h2>\n\u003cdiv class=\"keybox\">\u003cspan class=\"tag\">核心结论\u003c/span>DCM 不解析/发送 NM，也不直接控制 CAN Controller；诊断保通靠 \u003cb>ComMDcmUsage\u003c/b>、\u003cb>DCM Channel Ref\u003c/b>、\u003cb>ComM_DCM_ActiveDiagnostic / InactiveDiagnostic\u003c/b> 三件套，最终由 ComM 保持 FullCom，CanSM 维持 Controller STARTED。\u003c/div>\n\u003ch3 id=\"5-1-DCM-保持通信用什么接口\">5.1 DCM 保持通信用什么接口\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 15.026%;\">\u003ccol style=\"width: 31.995%;\">\u003ccol style=\"width: 25.518%;\">\u003ccol style=\"width: 27.461%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>场景\u003c/th>\u003cth>接口/路径\u003c/th>\u003cth>含义\u003c/th>\u003cth>排查抓手\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>诊断开始/诊断活跃\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComM_DCM_ActiveDiagnostic(Channel)\u003c/code>\u003c/td>\u003ctd class=\"key-cell\">DCM 通知 ComM：该通道有诊断活动，需要保持通信。\u003c/td>\u003ctd>诊断中掉线，先确认这个接口是否被 DCM 调用、Channel 是否正确。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>诊断结束/不再活跃\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComM_DCM_InactiveDiagnostic(Channel)\u003c/code>\u003c/td>\u003ctd class=\"key-cell\">DCM 释放诊断保持；如果没有 App/BswM/PNC 等其他请求，ComM 才能往释放方向走。\u003c/td>\u003ctd>诊断结束后不睡，确认 Inactive 是否调用，或是否还有其他 FullCom 请求源。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">ComM 保持 FullCom\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComM\u003c/code> 内部请求聚合\u003c/td>\u003ctd class=\"key-cell\">DCM 活跃只是 FullCom 请求源之一；最终还要看 inhibition、CommunicationAllowed、User/Channel 映射。\u003c/td>\u003ctd>查 \u003ccode>ComM_GetCurrentComMode\u003c/code>、\u003ccode>ComM_GetRequestedComMode\u003c/code>、\u003ccode>ComM_GetMaxComMode\u003c/code>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Controller 保持可通信\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComM -&gt; CanSM -&gt; CanIf/CanDrv\u003c/code>\u003c/td>\u003ctd class=\"key-cell\">CanSM 把 ComM 模式请求落到 CAN Controller STARTED/STOPPED/SLEEP。\u003c/td>\u003ctd>FullCom 有但诊断发不出，继续查 CanSM mode indication、CanIf PDU mode、CanTp/PduR/DCM 路由。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"5-2-EB-里必须打开什么-DCM-才有保持通信能力\">5.2 EB 里必须打开什么，DCM 才有保持通信能力\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 20%;\">\u003ccol style=\"width: 20%;\">\u003ccol style=\"width: 20%;\">\u003ccol style=\"width: 20%;\">\u003ccol style=\"width: 20.001%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>位置\u003c/th>\u003cth>EB 界面名\u003c/th>\u003cth>AUTOSAR/配置参数名\u003c/th>\u003cth>当前建议\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"key-cell\">ComM -&gt; ComMChannel -&gt; 目标通道\u003c/td>\u003ctd class=\"key-cell\">\u003cb>DCM Usage\u003c/b>\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMDcmUsage\u003c/code>\u003c/td>\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\u003ctd>允许 DCM 通过 \u003ccode>ComM_DCM_ActiveDiagnostic\u003c/code> / \u003ccode>ComM_DCM_InactiveDiagnostic\u003c/code> 影响该 ComM Channel。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">DCM -&gt; DSL/Protocol/Connection 相关配置\u003c/td>\u003ctd class=\"key-cell\">ComM Channel Reference / ComM Channel\u003c/td>\u003ctd>常见为 \u003ccode>DcmDslProtocolRxComMChannelRef\u003c/code> 或供应商等价引用\u003c/td>\u003ctd>引用到诊断所在 ComM Channel\u003c/td>\u003ctd>让 DCM 知道诊断请求属于哪一路通信通道，避免 DCM 调错 Channel。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">ComM -&gt; Channel/User Mapping\u003c/td>\u003ctd>User / Channel Mapping\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMUser\u003c/code> 到 \u003ccode>ComMChannel\u003c/code> 的映射\u003c/td>\u003ctd class=\"key-cell\">DCM/诊断通道映射正确\u003c/td>\u003ctd>如果映射错，DCM 调用看似存在，但保持的是错误通道。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">ComM -&gt; General/Channel\u003c/td>\u003ctd>Mode Limitation / Wakeup Inhibition / No Communication / No Wakeup\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMModeLimitationEnabled\u003c/code>、\u003ccode>ComMWakeupInhibitionEnabled\u003c/code>、\u003ccode>ComMNoCom\u003c/code>、\u003ccode>ComMNoWakeup\u003c/code>\u003c/td>\u003ctd>按项目策略确认\u003c/td>\u003ctd>这些开关/运行时状态可能压住 DCM 的 FullCom 保持请求。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"5-3-FullCom-SilentCom-NoCom-对诊断的影响\">5.3 FullCom / SilentCom / NoCom 对诊断的影响\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 7.944%;\">\u003ccol style=\"width: 44.344%;\">\u003ccol style=\"width: 47.712%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>通信模式\u003c/th>\u003cth>诊断表现\u003c/th>\u003cth>注意点\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>FullCom\u003c/td>\u003ctd>通常可收可发，DCM 可以正常收请求、发响应。\u003c/td>\u003ctd>如果仍不通，查 CanTp/PduR/DCM 路由、ID、寻址方式、会话/安全/S3。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SilentCom\u003c/td>\u003ctd>不主动发送通信，接收路径通常仍可用；诊断可能收到请求但响应/FlowControl 发不出去。\u003c/td>\u003ctd>具体行为还要结合 CanIf PDU mode、BswM 策略和供应商实现确认。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>NoCom\u003c/td>\u003ctd>Controller/Transceiver 可能 Stop 或 Sleep，诊断通道不可通信。\u003c/td>\u003ctd>先查 ComM 是否被限制到 NoCom，CanSM 是否把 Controller 拉起。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"6-ComM-FullCom-阻塞速查\">6. ComM FullCom 阻塞速查\u003c/h2>\n\u003cdiv class=\"keybox\">\u003cspan class=\"tag\">排查原则\u003c/span>FullCom 起不来，不要一上来就怀疑 CanSM。先确认“请求源有没有到 ComM”，再看“ComM 有没有被限制”，最后看“ComM 请求有没有传到 CanSM / Nm / CanNm / CanIf”。\u003c/div>\n\u003ch3 id=\"6-0-ComM-三值和映射速查\">6.0 ComM 三值和映射速查\u003c/h3>\n\u003cdiv class=\"chapter-dense-grid chapter-quickref chapter-6-quickref\">\n\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\">User -&gt; Channel 映射口径\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM_RequestComMode(User, FULL)：传入的是 User，不是 Channel；用户请求的 Mode 只接受 COMM_FULL_COMMUNICATION 或 COMM_NO_COMMUNICATION，不能请求 COMM_SILENT_COMMUNICATION。\u003c/strong>\nComM 根据配置里的 User -&gt; Channel 映射，把请求落到一个/多个 ComMChannel。\n\u003cstrong>位置/关键词：\u003c/strong>ComM -&gt; ComMConfigSet -&gt; ComMUser / ComMChannel / UserPerChannel；ComMUserChannelRef、ComMChannelRef、User / Channel Mapping。\n\u003cstrong>生成代码搜索：\u003c/strong>ComM.xdm、ComM_Cfg.h/.c、ComM_Lcfg.c、ComM_PBcfg.c；搜 ESC_M、ComMUser、UserToChannel、ChannelToUser、UserPerChannel。\n\u003cstrong>典型现象：\u003c/strong>User Handle 或映射错：接口调用正常，但目标 Channel / Controller 不动。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">Requested / Max / Current 三值\u003c/div>\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 33.333%;\">\u003ccol style=\"width: 16.797%;\">\u003ccol style=\"width: 49.869%;\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>接口/值\u003c/th>\u003cth>判断\u003c/th>\u003cth>异常指向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>ComM_GetRequestedComMode(User,&amp;mode)\u003c/code>\u003c/td>\u003ctd>\u003cb>想不想\u003c/b>\u003c/td>\u003ctd>请求源、User Handle、释放过早。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ComM_GetMaxComMode(User,&amp;mode)\u003c/code>\u003c/td>\u003ctd>\u003cb>允不允许\u003c/b>\u003c/td>\u003ctd>NoCom、NoWakeup、Limit、CommunicationAllowed、PreventWakeUp。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>ComM_GetCurrentComMode(User,&amp;mode)\u003c/code>\u003c/td>\u003ctd>\u003cb>实际到没到\u003c/b>\u003c/td>\u003ctd>CanSM 执行、Nm/CanNm、CanIf PDU mode。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">组合判断 / Limit 解除\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>Req=FULL，Max=NO，Cur=NO：\u003cbr>\u003c/strong>请求到了，但被限制压住，先查 limitation / inhibition。\n\u003cstrong>Req=FULL，Max=FULL，Cur≠FULL：\u003cbr>\u003c/strong>ComM 允许了，继续查 CanSM、Nm、CanIf。\n\u003cstrong>Req=NO，Max=FULL，Cur=FULL：\u003cbr>\u003c/strong>可能其他 User / DCM / BswM 保持，或 ComMTMinFullComModeDuration 未到。\n\u003cstrong>解除 NoCom limitation：\u003c/strong>\nComM_LimitChannelToNoComMode(Channel, FALSE)//Channel分闸\nComM_LimitECUToNoComMode(FALSE)            // ECU 总闸\nMax=NO 时可以调用 FALSE；若仍 NO，继续查 CommunicationAllowed、PreventWakeUp、NoWakeup、BswM/EcuM 是否又置位、User/Channel 是否查错。\u003c/code>\u003c/pre>\u003c/div>\n\u003c/div>\n\u003ch3 id=\"6-1-FullCom-阻塞总表\">6.1 FullCom 阻塞总表\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 10.544%;\">\u003ccol style=\"width: 23.109%;\">\u003ccol style=\"width: 14.948%;\">\u003ccol style=\"width: 31.399%;\">\u003ccol style=\"width: 20.001%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>层级\u003c/th>\u003cth>阻塞点\u003c/th>\u003cth>典型现象\u003c/th>\u003cth>重点检查\u003c/th>\u003cth>怎么恢复/验证\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>请求源\u003c/td>\u003ctd>User 没请求到目标 Channel\u003c/td>\u003ctd>App/DCM/BswM 以为请求了，目标 CAN 通道不动。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComM_RequestComMode(User, COMM_FULL_COMMUNICATION)\u003c/code>；User 是否映射到 \u003ccode>ESC_M\u003c/code>；User Handle 是否用错。\u003c/td>\u003ctd>用 \u003ccode>ComM_GetRequestedComMode\u003c/code> 看 User 请求；确认 User -&gt; Channel Mapping。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>运行时门控\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComM_CommunicationAllowed(Channel, FALSE)\u003c/code>\u003c/td>\u003ctd>User 请求 FullCom，但 ComM 不允许真正拉起通道。\u003c/td>\u003ctd class=\"key-cell\">BswM/EcuM/系统模式管理是否在初始化、睡眠、运输模式、低功耗策略里置 FALSE。\u003c/td>\u003ctd>确认合适时机调用 \u003ccode>ComM_CommunicationAllowed(Channel, TRUE)\u003c/code>；看 ComM 当前模式是否开始推进。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>静态/运行时限制\u003c/td>\u003ctd>NoCom 限制\u003c/td>\u003ctd>\u003ccode>GetMaxComMode\u003c/code> 可能被压到 NoCom；FullCom 请求被压住。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMNoCom\u003c/code>；\u003ccode>ComM_LimitChannelToNoComMode\u003c/code>；\u003ccode>ComM_LimitECUToNoComMode\u003c/code>。\u003c/td>\u003ctd>配置项不需要强制 NoCom 时保持 false；运行时限制要调用 FALSE 解除。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>唤醒抑制\u003c/td>\u003ctd>NoWakeup / PreventWakeUp\u003c/td>\u003ctd>睡眠态或低功耗态有请求，但通道不被拉起。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMNoWakeup\u003c/code>；\u003ccode>ComM_PreventWakeUp\u003c/code>；\u003ccode>ComMWakeupInhibitionEnabled\u003c/code>；\u003ccode>ComM_GetInhibitionStatus\u003c/code>。\u003c/td>\u003ctd>确认 PreventWakeUp 是否被 BswM/EcuM/应用置位；按策略解除。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">DCM 保持\u003c/td>\u003ctd>诊断没有成为 FullCom 请求源\u003c/td>\u003ctd>诊断中掉通信，或者诊断结束后行为不符合预期。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>COMM_DCM_ENABLED / ComMDcmUsage(EB)\u003c/code> 是否 true；DCM 是否调用 \u003ccode>ComM_DCM_ActiveDiagnostic\u003c/code> / \u003ccode>InactiveDiagnostic\u003c/code>；DCM Channel Ref 是否正确。\u003c/td>\u003ctd>诊断中抓接口调用/ComM 请求源；诊断结束后确认 Inactive 是否释放。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PNC/同步唤醒\u003c/td>\u003ctd>PNC 或同步唤醒策略影响 FullCom\u003c/td>\u003ctd>某些功能请求能保持网络，另一些不能；或一个通道被另一路带起。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMPncSupport\u003c/code>、PNC mapping、EIRA/ERA、\u003ccode>ComMSynchronousWakeUp\u003c/code>、BswM rules。\u003c/td>\u003ctd>当前 DF_XY PNC 关闭时，不应把 FullCom 异常优先归因于 PNC。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">ComM 到 CanSM\u003c/td>\u003ctd class=\"key-cell\">CanSM 网络引用错/Controller 起不来\u003c/td>\u003ctd class=\"key-cell\">ComM 状态有变化，但 Controller 没 STARTED。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanSMComMNetworkHandleRef\u003c/code>；\u003ccode>CanSMController\u003c/code> 列表；\u003ccode>CanIf_SetControllerMode\u003c/code>；Controller mode indication。\u003c/td>\u003ctd>确认 CanSM Network 绑定 ESC_M；确认 ESC_M/ESC_S Controller 是否按需求一起 Start。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">ComM 到 Nm/CanNm\u003c/td>\u003ctd class=\"key-cell\">Nm/CanNm 引用不在同一逻辑通道\u003c/td>\u003ctd>FullCom 看似起来，但 NM 不请求/不发。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>NmComMChannelRef\u003c/code>；\u003ccode>CanNmComMNetworkHandleRef\u003c/code>；\u003ccode>ComMNmVariant = FULL\u003c/code>。\u003c/td>\u003ctd>确认 ComM ESC_M、Nm Channel、CanNm Channel 绑定一致。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">CanNm 到 CanIf\u003c/td>\u003ctd>NM PDU 路由或 HTH/HRH 错\u003c/td>\u003ctd>Controller STARTED，CanNm 状态也对，但总线上没有 NM，或收不到 NM。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmTxPduRef\u003c/code> / \u003ccode>RxPduId / CanNmRxPduRef(EB)\u003c/code>；CanIf Tx/Rx PDU；HTH/HRH；CAN ID / Range / DLC。\u003c/td>\u003ctd>Trace 看总线；再查 CanIf TxConfirmation / RxIndication 是否进 CanNm。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"6-2-现场排查顺序\">6.2 现场排查顺序\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>1. 先看 ComM User 请求：RequestedMode / CurrentMode / MaxMode。\u003c/strong>\n\u003cstrong>2. 再看 inhibition：NoCom、NoWakeup、CommunicationAllowed、PreventWakeUp。\u003c/strong>\n\u003cstrong>3. 再看 CanSM：ComM 请求是否传到 CanSM，Controller 是否 STARTED。\u003c/strong>\n\u003cstrong>4. 再看 Nm/CanNm：FULL NM 是否触发 Nm_NetworkRequest / CanNm_NetworkRequest。\u003c/strong>\n\u003cstrong>5. 最后看 CanIf：TxPduRef/RxPduRef、HTH/HRH、CAN ID、DLC、TxConfirmation、RxIndication。\u003c/strong>\u003c/code>\u003c/pre>\n\u003ch3 id=\"6-3-这章要记住的判断\">6.3 这章要记住的判断\u003c/h3>\n\u003cdiv class=\"warnbox\">ComM 是“请求聚合 + 模式裁决”。CanSM 是“Controller 模式执行”。CanNm 是“NM 协议状态机和 NM 报文”。FullCom 不起来时，只有确认 ComM 没被限制、CanSM 没执行失败之后，才进入 CanNm/CanIf 方向排查。\u003c/div>\n\u003ch2 class=\"major-break\" id=\"9-ComM-配置项\">9. ComM 配置项\u003c/h2>\n\u003cdiv class=\"chapter-dense-intro\">\u003cdiv class=\"compact-card wide\">\u003cdiv class=\"card-title\">第 9 章核心定位\u003c/div>\u003cp>ComM 是通信模式经理。它不解析 NM 报文，也不解析诊断报文，但它决定一个通信通道当前允许什么通信模式。\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM User 请求 / DCM 诊断活跃 / BswM 和 EcuM 通信允许 / 模式限制 和 唤醒抑制 / PNC 请求\n    -&gt; ComM 统一决策   -&gt; 指挥CanSM 切 Controller 模式  -&gt; 指挥Nm/CanNm 请求或释放网络\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\n\u003cdiv class=\"chapter-scan-note\">速查方式：ComM 问题优先按“请求源 → 限制/抑制 → CanSM 执行 → Nm/CanNm 网络管理”顺序排查，不要直接跳到底层 CAN。\u003c/div>\n\u003cdiv class=\"chapter-dense-grid chapter-9-grid\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-1-ComM-的两个核心对象-User-和-Channel\">9.1 ComM 的两个核心对象：User 和 Channel\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM Channel：\u003c/strong>逻辑通信通道，例如 ESC_M；\u003cbr>后续绑定 CanSM Network、Nm Channel、CanNm Channel。\n\u003cstrong>ComM User：\u003c/strong>通信请求源，例如 App / DCM / BswM 相关用户；\u003cbr>User 通过配置映射到 Channel。\n\u003cstrong>映射规则：\u003c/strong>一个 User 可映射一个或多个 Channel；\u003cbr>请求只影响其映射到的 Channel。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>配置/生成代码查点：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>EB 位置：\u003cbr>\u003c/strong>ComM -&gt; ComMConfigSet -&gt; ComMUser / ComMChannel / UserPerChannel。\n\u003cstrong>常见字段：\u003cbr>\u003c/strong>ComMUserChannelRef、ComMChannelRef、User / Channel Mapping。\n\u003cstrong>搜索关键词：\u003cbr>\u003c/strong>ESC_M、ComMUser、UserToChannel、ChannelToUser、UserPerChannel、ComMChannelRef。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-2-ComMNmVariant-Nm-Variant-EB\">9.2 COMM_NM_VARIANT_OF_CHANNEL / ComMNmVariant(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>FULL\n\u003cstrong>含义: \u003c/strong>ComM 使用真实 Nm/CanNm 网络管理。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>FULL 时的动作：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>请求通信:\u003c/strong>\n    ComM -&gt; CanSM_RequestComMode(FULL)\n    ComM -&gt; Nm_NetworkRequest()\n    Nm -&gt; CanNm_NetworkRequest()\n    CanNm 发 NM\n\u003cstrong>释放通信:\u003c/strong>\n    ComM -&gt; Nm_NetworkRelease()\n    CanNm 走 ReadySleep / PrepareBusSleep / BusSleep\n    ComM -&gt; CanSM_RequestComMode(NO_COMM)\u003c/code>\u003c/pre>\u003cp>\u003cstrong>和其他模式对比：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>NONE:     \u003c/strong>没有 NM。\n\u003cstrong>LIGHT:    \u003c/strong>轻量管理，不跑完整 NM 协议。\n\u003cstrong>PASSIVE:  \u003c/strong>有 NM，但节点通常不主动请求网络。\n\u003cstrong>FULL:     \u003c/strong>完整 NM，可主动请求和释放网络。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-5-ComMTMinFullComModeDuration-Minimum-FullCom-mode-duration-EB\">9.5 COMM_T_MIN_FULL_COM_MODE_DURATION / ComMTMinFullComModeDuration(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>5.0 s\n\u003cstrong>含义:  \u003c/strong>ComM 进入 FullCom 后至少保持 5s。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>作用：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>防止刚进入 FullCom 又立刻释放，导致网络抖动。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>注意：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>这个时间属于 ComM 层。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-6-ComMSynchronousWakeUp-Synchronous-Wake-Up-EB\">9.6 COMM_SYNCHRONOUS_WAKE_UP / ComMSynchronousWakeUp(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>true\n\u003cstrong>含义: \u003c/strong>同步唤醒相关通道。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>多COMM通道项目中，一个通道唤醒可能带动相关通道一起进入通信准备\u003c/code>\u003c/pre>\u003cp>\u003cstrong>注意：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>客户说“为什么这个通道被一起带起来”，要查 SynchronousWakeUp、PNC、BswM rules、Channel mapping。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-7-ComMDcmUsage-DCM-Usage-EB\">9.7 COMM_DCM_ENABLED / ComMDcmUsage(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>true\n\u003cstrong>含义: \u003c/strong>DCM 可以通过 ComM 保持通信。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>典型接口：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM_DCM_ActiveDiagnostic(Channel)\nComM_DCM_InactiveDiagnostic(Channel)\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ActiveDiagnostic:  \u003c/strong>诊断活跃，ComM 保持 FullCom。\n\u003cstrong>InactiveDiagnostic:\u003c/strong>诊断结束，ComM 在没有其他请求时释放通信。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>注意：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>诊断保持通信不等于 CanNm timer。\n这是 DCM 通过 ComM 持有 FullCom。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-8-ComMNoCom-No-Communication-EB\">9.8 NoCom / ComMNoCom(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>false\n\u003cstrong>含义:  \u003c/strong>如果 true，该通道被限制在 NoCom。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM User 请求 FullCom 可能被压住。\nDCM 也无法通过该通道正常诊断。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>相关接口：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM_LimitChannelToNoComMode(Channel, TRUE/FALSE)\u003cbr>\nComM_LimitECUToNoComMode(TRUE/FALSE)\u003cbr>\nComM_GetMaxComMode(User, &amp;mode)\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-9-ComMNoWakeup-No-Wakeup-EB\">9.9 NoWakeup / ComMNoWakeup(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>false\n\u003cstrong>含义:  \u003c/strong>如果 true，禁止通过该通道唤醒通信。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>请求 FullCom 不一定能把通道从低功耗拉起来。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>相关接口：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM_PreventWakeUp(Channel, TRUE/FALSE)\u003cbr>\u003cbr>\nComM_GetInhibitionStatus(Channel, &amp;status)\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-10-Mode-Limitation-和-Wakeup-Inhibition\">9.10 Mode Limitation 和 Wakeup Inhibition\u003c/div>\u003cpre class=\"dense-pre\">\u003cspan style=\"color: rgb(21, 32, 96); font-family: DengXian, 等线, &quot;Microsoft YaHei UI&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, system-ui, sans-serif; font-size: 11.9333px; white-space: normal; background-color: rgb(237, 243, 252);\">\u003cb>Mode Limitation：\u003c/b>\u003c/span>\u003cstrong style=\"background-color: initial;\">\u003cfont color=\"#1a1c2e\" face=\"DengXian, 等线, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, Source Han Sans SC, system-ui, sans-serif\">\u003cspan style=\"font-size: 13.3333px;\">\u003cbr>\u003c/span>\u003c/font>作用:  \u003c/strong>\u003cspan style=\"background-color: initial; font-size: inherit;\">允许运行时限制某通道或整个 ECU 到 NoCom。\u003c/span>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>接口:\u003c/strong>\n    ComM_LimitChannelToNoComMode(Channel, TRUE/FALSE)\n    ComM_LimitECUToNoComMode(TRUE/FALSE)\u003cbr>\u003cspan style=\"font-weight: 800; text-wrap-mode: wrap;\">\u003cfont color=\"#152060\" face=\"DengXian, 等线, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, Source Han Sans SC, system-ui, sans-serif\">\u003cspan style=\"font-size: 11.9333px; white-space-collapse: collapse; background-color: rgb(237, 243, 252);\">Wakeup Inhibition：\u003cbr>\u003c/span>\u003c/font>\u003c/span>\u003c/code>\u003cstrong style=\"background-color: initial; font-size: inherit;\">作用:  \u003c/strong>\u003cspan style=\"background-color: initial; font-size: inherit;\">允许运行时阻止某通道唤醒。\u003cbr>\u003c/span>\u003cspan style=\"background-color: initial; font-size: inherit;\">\u003cb>接口:\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>\u003c/span>\u003cfont color=\"#10235a\">\u003cb>     \u003c/b>\u003c/font>ComM_PreventWakeUp(Channel, TRUE/FALSE)\u003cbr>\u003cb>FullCom 请求失败时，不要只看 CanSM。 \u003c/b>\u003cspan style=\"background-color: initial; font-size: inherit;\">\u003cb>查：\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>\u003c/span>    User 请求是否存在\u003cbr>    User 是否映射到 Channel\u003cbr>    ComM_CommunicationAllowed和CommunicationAllowed     gate(API) 是否为 TRUE\u003cbr>    NoCom / NoWakeup 是否置位\u003cbr>    PreventWakeUp 是否置位\u003cbr>    LimitChannelToNoCom / LimitECUToNoCom 是否置位\u003cbr>    DCM 是否 ActiveDiagnostic\u003cbr>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"9-11-ComMPncSupport-Support-for-Partial-Network-Cluster-PNC-EB-ComMPncEnabled-partial-networking-enabled-in-this-configu\">9.11 ComMPncSupport / ComMPncEnabled\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>false / false\n\u003cstrong>含义:  \u003c/strong>当前 ComM 不处理 PNC。\u003cbr>\u003c/code>\u003cb style=\"background-color: initial; font-size: inherit;\">打开后：\u003c/b>\u003cspan style=\"background-color: initial; font-size: inherit;\">ComM 要处理 PNC ID、PNC 与 Channel/User 映射、EIRA/ERA 信号。\u003cbr>\u003c/span>\u003cb>联动模块：\u003c/b>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM:\u003c/strong>\n    COMM_PNC_SUPPORT / ComMPncSupport(EB) \u003cbr>    PncEnabled / ComMPncEnabled(EB)\n    Pnc / ComMPnc(EB)\n    PncId / ComMPncId(EB)\n    PNC-channel-user mapping\n    EIRA / ERA ComSignal\n\u003cstrong>CanNm:\u003c/strong>\n    CANNM_PN_SUPPORTED / CanNmPnSupported(EB)\n    PnEnabled / CanNmPnEnabled(EB)\n    PnInfoOffset / PnInfoLength\n    PnFilterMask\n\u003cstrong>CanIf:\u003c/strong>\n    CANIF_PUBLIC_PN_SUPPORT / CanIfPublicPnSupport(EB)\n\u003cstrong>CanSM:\u003c/strong>\n    CANSM_PNSUPPORT / CanSMPNSupport(EB)\n    CANSM_PARTIALNETWORKING / CanSMActivatePN(EB)\n\u003cstrong>Com / PduR / BswM:\u003c/strong>\n    EIRA / ERA / routing / rules\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003cfont color=\"#10235a\">\u003cb>结论：\u003cbr>\u003c/b>\u003c/font>PNC 不是只开 ComM 一个勾。 任何一层没配全，都可能导致 PN 唤醒、PN 保持、PN 释放不符合预期。\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-12-ComM-三种通信模式\">9.12 ComM 三种通信模式\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cb>COMM_NO_COMMUNICATION\u003c/b>\u003cbr>\u003cb>含义：\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>\u003c/code>通道不通信。\u003cbr>CanSM 可能把 Controller Stop/Sleep。\u003cbr>DCM、CanTp、普通 CAN 报文都无法通过这个 CAN 通道正常通信。\u003cbr>\u003cb>典型场景：\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>没有任何用户请求通信。\u003cbr>DCM 不活跃。\u003cbr>ComM 允许释放。\u003cbr>Nm/CanNm 进入睡眠相关状态。\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>\u003cb>COMM_SILENT_COMMUNICATION\u003c/b>\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cfont color=\"#10235a\">\u003cb>含义：\u003cbr>\u003c/b>\u003c/font>\u003c/code>通常可收不可发。\u003cbr>适合某些只监听、不发送的中间状态或限制状态。\u003cbr>\u003cb>对DCM影响：\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>可能收到诊断请求，但响应发不出去。\u003cbr>UDS 多帧尤其有问题，因为 FlowControl / Response 都需要发送。\u003cb>COMM_FULL_COMMUNICATION\u003c/b>\u003cbr>\u003cb>含义：\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>可收可发。CanSM Controller 应处于 STARTED。\u003cbr>DCM、CanTp、普通通信、NM 都具备通信基础。\u003cbr>\u003cb>注意：\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>FullCom 只是底层通道具备通信条件。\u003cbr>诊断是否响应还要看CanTp/PduR/DCM 路由、会话、安全、服务支持\u003c/pre>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"9-13-ComM-FULL-NM-状态粗流程\">9.13 ComM FULL NM 状态粗流程\u003c/div>\u003cp>\u003cstrong>请求通信：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>NoCom\n    -&gt; User 请求 FullCom / DCM Active / PNC 请求\n        -&gt; ComM 判断允许通信\n            -&gt; CanSM_RequestComMode(FULL)\n                -&gt; Controller STARTED\n            -&gt; Nm_NetworkRequest\n                -&gt; CanNm 发 NM\n            -&gt; FullCom Network Requested\u003c/code>\u003c/pre>\u003cp>\u003cstrong>保持通信：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>只要仍有任一条件成立，ComM 通常继续保持 FullCom：\u003c/strong>\n    App/User 请求 FullCom\n    DCM ActiveDiagnostic\n    PNC 仍请求\n    BswM/系统策略保持通信\u003c/code>\u003c/pre>\u003cp>\u003cstrong>释放通信：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>所有 User 释放\nDCM InactiveDiagnostic\nPNC 无请求\n系统允许释放\n    -&gt; ComM 进入 Ready Sleep 相关处理\n        -&gt; Nm_NetworkRelease\n            -&gt; CanNm ReadySleep / PrepareBusSleep / BusSleep\n        -&gt; CanSM_RequestComMode(NO_COMM)\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"9-14-ComM-请求聚合规则\">9.14 ComM 请求聚合规则\u003c/div>\u003cp>\u003cstrong>ComM 不是只看一个用户，而是聚合多个来源：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>App User\nDCM ActiveDiagnostic\nBswM / EcuM 通信允许\nPNC 请求\n模式限制 / 唤醒抑制\nChannel/User mapping\u003c/code>\u003c/pre>\u003cp>\u003cstrong>基本规则：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>任一有效用户请求 FullCom:  \u003c/strong>通道可能被保持 FullCom。\n\u003cstrong>所有用户都释放:  \u003c/strong>通道才有机会释放。\n存在\u003cb>NoCom/NoWakeup/ComM_CommunicationAllowed/CommunicationAllowed gate(API)=false/LimitToNoCom\u003c/b>: FullCom 请求可能被压住。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>重要查询接口：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cb>ComM_GetRequestedComMode(User, &amp;mode)\u003c/b>  看用户当前请求了什么。\n\u003cb>ComM_GetCurrentComMode(User, &amp;mode)\u003c/b>  看用户当前实际处于什么通信模式。\n\u003cb>ComM_GetMaxComMode(User, &amp;mode)\u003c/b>  看该用户当前最大允许通信模式。 如果最大只到 NoCom/SilentCom，FullCom 请求上不去。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"9-15-ComM-CommunicationAllowed-CommunicationAllowed-gate-API\">9.15 ComM_CommunicationAllowed / CommunicationAllowed gate(API)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>ComM_CommunicationAllowed / CommunicationAllowed gate(API)(Channel, TRUE/FALSE)\u003c/code>\u003c/pre>\u003cp>\u003cstrong>含义：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>这是 ComM 是否允许某通道通信的运行时门控。 常由 BswM / EcuM / 系统模式管理逻辑调用。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM_CommunicationAllowed / CommunicationAllowed gate(API) = FALSE:\n    即使 User 请求 FullCom，ComM 也可能不真正拉起 CanSM/Nm。\nComM_CommunicationAllowed / CommunicationAllowed gate(API) = TRUE:\n    通道具备被 ComM 拉起的前提之一。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>排查：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>FullCom 请求失败时，必须查这个状态。 很多项目初始化阶段或睡眠准备阶段，会先禁止通信，等条件满足后再允许。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"9-16-ComM-阻塞项全表\">9.16 ComM 阻塞项全表\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>NoCom / ComMNoCom(EB) = true\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>通道静态/配置层面被限制在 NoCom。\n\u003cstrong>表现: \u003c/strong>用户请求 FullCom，但最大允许模式可能不是 FullCom。\n\u003cstrong>检查: \u003c/strong>ComM Channel 配置。 ComM_GetMaxComMode。\u003c/code>\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>NoWakeup / ComMNoWakeup(EB) = true\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>禁止该通道被通信请求唤醒。\n\u003cstrong>表现: \u003c/strong>睡眠或低功耗状态下，请求不把通道拉起来。\n\u003cstrong>检查: \u003c/strong>ComM Channel 配置。 ComM_GetInhibitionStatus。\u003c/code>\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>COMM_MODE_LIMITATION_ENABLED / ComMModeLimitationEnabled(EB) = true\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>允许运行时限制 Channel 或 ECU 到 NoCom。\n\u003cstrong>接口: \u003c/strong>\u003cb>ComM_LimitChannelToNoComMode(Channel, TRUE/FALSE)\u003c/b>\n      \u003cb>ComM_LimitECUToNoComMode(TRUE/FALSE)\u003c/b>\n\u003cstrong>表现: \u003c/strong>某个策略把通道压到 NoCom，FullCom 请求上不去。\u003c/code>\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>COMM_WAKEUP_INHIBITION_ENABLED / ComMWakeupInhibitionEnabled(EB) = true\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>允许运行时阻止通道唤醒。\n\u003cstrong>接口: \u003c/strong>ComM_PreventWakeUp(Channel, TRUE/FALSE)\n\u003cstrong>表现: \u003c/strong>通道不响应唤醒请求，或者请求后不进入 FullCom。\u003c/code>\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>ComM_CommunicationAllowed / CommunicationAllowed gate(API) = FALSE\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>通道运行时不允许通信。\n\u003cstrong>接口: \u003c/strong>ComM_CommunicationAllowed / CommunicationAllowed gate(API)(Channel, TRUE/FALSE)\n\u003cstrong>表现: \u003c/strong>用户请求存在，但 ComM 不往 CanSM/Nm 推进。\u003c/code>\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>User Mapping 错误\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>User 请求发给了错误 Channel。\n\u003cstrong>表现: \u003c/strong>ComM_RequestComMode 返回正常，但目标 CAN 通道没变化。\n\u003cstrong>检查: \u003c/strong>ComM User -&gt; Channel mapping。 DCM/App/BswM 使用的 User Handle。\u003c/code>\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>DCM 未 ActiveDiagnostic\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>诊断不会保持 FullCom。\n\u003cstrong>表现: \u003c/strong>诊断过程中或诊断后通道被释放。\n\u003cstrong>检查: \u003c/strong>COMM_DCM_ENABLED / ComMDcmUsage(EB)。\n      ComM_DCM_ActiveDiagnostic / InactiveDiagnostic 调用。\n      DCM S3 超时和会话状态。\u003c/code>\u003c/pre>\u003chr>\u003cpre class=\"dense-pre\">\u003ccode>PNC 请求不存在或映射错误\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>影响: \u003c/strong>打开 PNC 后，ComM 可能只按 PNC 请求保持相关网络。\n\u003cstrong>表现: \u003c/strong>某些 PN bit 不能保持网络，或者无关 PN 误保持网络。\n\u003cstrong>检查: \u003c/strong>ComMPnc / PNC ID。\n      PNC 与 Channel/User 映射。\n      EIRA / ERA ComSignal。\n      CanNm PN mask / offset / length。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"9-20-ComM-常见故障定位\">9.20 ComM 常见故障定位\u003c/div>\u003cp>\u003cstrong>请求 FullCom 但 Controller 不起来：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. ComM_RequestComMode 是否调用。\n2. User Handle 是否正确。\n3. User 是否映射到 ESC_M。\n4. ComM_CommunicationAllowed / CommunicationAllowed gate(API) 是否 TRUE。\n5. NoCom / NoWakeup / Limitation / Inhibition 是否压住。\n6. ComMChId / CanSMComMNetworkHandleRef(EB) 是否绑定 ESC_M。\n7. CanSM 是否切 Controller STARTED 失败。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>FullCom 起来了但不发 NM：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. COMM_NM_VARIANT_OF_CHANNEL / ComMNmVariant(EB) 是否 FULL。\n2. COMM_NM_ACCESS_NEEDED 是否打开。\n3. ComMChannelRef / NmComMChannelRef(EB) 是否 ESC_M。\n4. StandardBusType / NmStandardBusType(EB) 是否 CANNM。\n5. CanNm channel 是否绑定同一通道。\n6. CanNmTxPduRef / CanIf Tx PDU / HTH 是否正确。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>诊断能收不能发：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. 是否处于 SilentCom。\n2. CanSM Controller 是否只允许接收。\n3. CanTp FlowControl / Response 是否发不出去。\n4. ComM 当前模式是否 FullCom。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>诊断后不睡：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. DCM 是否仍 ActiveDiagnostic。\n2. S3 是否未超时。\n3. App User 是否仍请求 FullCom。\n4. BswM 是否保持通信。\n5. PNC 是否仍有请求。\n6. COMM_T_MIN_FULL_COM_MODE_DURATION / ComMTMinFullComModeDuration(EB) 是否还没到。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>通道莫名被唤醒：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. 是否有 User 请求 FullCom。\n2. 是否 DCM Active。\n3. 是否 SynchronousWakeUp 带起。\n4. 是否 PNC/EIRA/ERA 请求。\n5. 是否物理 CAN wake source 导致 ECU 先醒。\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\n\u003c/main>\u003c/div>\u003c/body>\u003c/html>\n","notes/08/8.2.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>8.2 · CanSM：网络状态机与 Bus-Off Recovery\u003c/title>\u003cstyle>\n\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--navy:#1b2340;--accent:#4f88d8}\nbody{color:#1a1c2e;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n#wrap{m 5; }\n\n#main .nm-clean-svg .state-box-sleep { fill: #fff8ed; stroke: #b87222; }\n\n#main .nm-clean-svg .state-box-proto { fill: #f8fbf4; stroke: #4f7f35; }\n\n#main .nm-clean-svg .band-title { font-size: 16px; font-weight: 800; fill: #12245a; }\n\n#main .nm-clean-svg .box-title { font-size: 13px; font-weight: 800; fill: #17213a; }\n\n#main .nm-clean-svg .box-note { font-size: 10.6px; fill: #38445c; }\n\n#main .nm-clean-svg .lane-title { font-size: 11.5px; font-weight: 800; fill: #40506f; }\n\n#main .nm-clean-svg .arrow { stroke: #1f4e87; stroke-width: 1.7; fill: none; marker-end: url(#nmCleanArrow); }\n\n#main .nm-clean-svg .arrow-warn { stroke: #b06a00; stroke-width: 1.7; fill: none; marker-end: url(#nmCleanArrowWarn); }\n\n#main .nm-clean-svg .num { fill: #12245a; font-size: 10.2px; font-weight: 800; }\n\n#main .nm-clean-svg .num-dot { fill: #fff; stroke: #4f88d8; stroke-width: 1.2; }\n\n#main .nm-clean-svg .num-dot-warn { fill: #fff; stroke: #b06a00; stroke-width: 1.2; }\n\n#main .nm-clean-svg .observe-card { fill: #fff; stroke: #d8e1f2; stroke-width: 1; }\n\n#main .nm-wide-svg .wide-band { fill: #f7f9fe; stroke: #d8e1f2; stroke-width: 1; }\n\n#main .nm-wide-svg .wide-title { font-size: 16px; font-weight: 800; fill: #12245a; }\n\n#main .nm-wide-svg .lane-title { font-size: 12px; font-weight: 800; fill: #40506f; }\n\n#main .nm-wide-svg .wide-box { fill: #fff; stroke: #426da9; stroke-width: 1.35; }\n\n#main .nm-wide-svg .wide-box-wake { fill: #f5fbff; stroke: #2369a5; }\n\n#main .nm-wide-svg .wide-box-sleep { fill: #fff8ed; stroke: #b87222; }\n\n#main .nm-wide-svg .wide-box-proto { fill: #f8fbf4; stroke: #4f7f35; }\n\n#main .nm-wide-svg .wide-box-note { fill: #fff; stroke: #d8e1f2; stroke-width: 1; }\n\n#main .nm-wide-svg .box-title { font-size: 13px; font-weight: 800; fill: #17213a; }\n\n#main .nm-wide-svg .box-note { font-size: 10.8px; fill: #38445c; }\n\n#main .nm-wide-svg .flow-line { stroke: #1f4e87; stroke-width: 1.75; fill: none; marker-end: url(#nmWideArrow); }\n\n#main .nm-wide-svg .flow-line-warn { stroke: #b06a00; stroke-width: 1.75; fill: none; marker-end: url(#nmWideArrowWarn); }\n\n#main .nm-wide-svg .flow-line-soft { stroke: #60708c; stroke-width: 1.45; stroke-dasharray: 4 3; fill: none; marker-end: url(#nmWideArrowSoft); }\n\n#main .nm-wide-svg .line-label rect { fill: #fff; stroke: #b9cbe5; stroke-width: .9; opacity: .98; }\n\n#main .nm-wide-svg .line-label.warn rect { stroke: #d6a25a; }\n\n#main .nm-wide-svg .line-label text { font-size: 10.8px; font-weight: 800; fill: #17213a; }\n\n  #main .nm-wide-svg .wide-title { font-size: 15px; }\n\n  #main .nm-wide-svg .box-title { font-size: 12.4px; }\n\n  #main .nm-wide-svg .box-note, #main .nm-wide-svg .line-label text { font-size: 10px; }\n #main .nm-clean-svg .box-title { font-size: 12.4px; }\n #main .nm-clean-svg .box-note { font-size: 10px; }\n\n#main .nm-state-table { font-size: 7.85pt; line-height: 1.18; margin: 3pt 0; }\n\n#main .nm-state-table th, #main .nm-state-table td { padding: 2.2px 4px; }\n\n#main .nm-state-note { margin: 2pt 0; padding: 4px 7px; background: #f7f9fe; border-left: 3px solid #4f88d8; line-height: 1.28; }\n\n  #main .nm-state-svg { margin: 2pt 0; }\n\n  #main .nm-state-table { font-size: 7.15pt; line-height: 1.12; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: 1.8px 3px; }\n\n  #main .nm-state-svg { margin: 1pt 0; }\n\n  #main .nm-state-table { font-size: 6.45pt; line-height: 1.04; margin: .8pt 0; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: .8px 1.5px; }\n\n:root{--bar-h:0px}\nbody{font-size:15px;line-height:1.6;background:#edf1f6}\n#wrap{max-width:960px;padding:18px 14px 32px}\n#main{padding:20px 18px;border-radius:12px;overflow-wrap:anywhere}\n#main h1{font-size:23px;line-height:1.35;text-align:left}\n#main h2{font-size:20px;line-height:1.4;margin:24px 0 12px}\n#main h3{font-size:17px;line-height:1.4;margin:18px 0 8px}\n#main h4{font-size:15px}\n#main p,#main li{font-size:15px;line-height:1.65;margin:7px 0}\n#main code{font-size:13px}\n#main pre,#main pre.dense-pre{font-size:13px;line-height:1.55;padding:10px;white-space:pre-wrap}\n#main .param-card pre,#main .flow-card pre,#main .compact-card pre{font-size:13px;line-height:1.55}\n#main table{font-size:13px;line-height:1.55;margin:12px 0}\n#main th,#main td{padding:8px 7px}\n#main .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}\n#main .table-scroll>table{min-width:620px}\n#main .param-title,#main .flow-title,#main .card-title{font-size:15px;line-height:1.5;padding:8px}\n#main .chapter-dense-grid .param-card table,#main .chapter-quickref table{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card pre,#main .chapter-quickref pre{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card h4{font-size:15px}\n#main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{gap:12px}\n#main .nm-state-svg{min-width:800px}\n#main .figure-scroll{overflow-x:auto}\n#main .lesson-toc{padding:12px 16px;background:#f3f6fc;border-radius:8px}\n#main .lesson-toc a{display:block;padding:6px 0;color:#27558a}\n#main .source-note{font-size:13px;color:#52627c;background:#f3f6fc;padding:12px;border-left:3px solid #4f88d8}\n@media(max-width:600px){\n #main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{grid-template-columns:1fr}\n #main{padding:18px 14px}#wrap{padding:12px 8px 24px}\n #main .table-scroll:before{content:'左右滑动查看表格';display:block;font-size:12px;color:#65708a;margin-top:8px}\n #main .figure-scroll:before{content:'左右滑动查看完整状态图';display:block;font-size:12px;color:#65708a;margin-top:8px}\n}\n@media print{\n body{font-size:10pt;background:white}#wrap,#main{padding:0}\n #main .lesson-toc{display:none}#main .table-scroll,#main .figure-scroll{overflow:visible}\n #main .table-scroll>table,#main .nm-state-svg{min-width:0}\n #main h2.major-break{break-before:auto!important;page-break-before:auto!important}\n #main table,#main p,#main li{font-size:9pt}#main pre,#main code{font-size:8pt}\n}\n\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"wrap\">\u003cmain id=\"main\">\n\u003ch1>8.2 · CanSM：网络状态机与 Bus-Off Recovery\u003c/h1>\n\u003cp class=\"source-note\">整理自 NM 配置打印版笔记。DF_XY、ESC_M / ESC_S、参数数值及开关状态均为原笔记中的项目示例，请结合实际项目核对。本笔记覆盖本课相关内容，不代表完整课程教案。\u003c/p>\n\u003cnav class=\"lesson-toc\" aria-label=\"本课目录\">\u003ca href=\"#2-通路总图\">2. 通路总图\u003c/a>\u003ca href=\"#3-一个-CanSM-Network-管两个-Controller\">3. 一个 CanSM Network 管两个 Controller\u003c/a>\u003ca href=\"#10-CanSM-配置项\">10. CanSM 配置项\u003c/a>\u003c/nav>\n\u003ch2 id=\"2-通路总图\">2. 通路总图\u003c/h2>\n\u003ch3 id=\"2-1-模式控制分支\">2.1 模式控制分支\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM Channel ESC_M\u003c/strong>\n    -&gt; CanSM Network ESC_M\n        -&gt; CAN Controller ESC_M\n        -&gt; CAN Controller ESC_S\u003c/code>\u003c/pre>\n\u003cp>含义：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM 对 ESC_M 请求 FullCom/NoCom。\u003c/strong>\n\u003cstrong>CanSM 的 ESC_M Network 收到请求后，可以一起控制下面挂的两个 Controller。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>注意：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>CanSM 控制两个 Controller = 可以 Start/Stop/Sleep 两个 Controller。\u003c/strong>\n\u003cstrong>不等于 CanNm 的一帧 NM 报文自动发到两个 Controller。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>NM 报文到底走哪个 Controller，要看：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>TxPduId / CanNmTxPduRef(EB)\u003c/strong>\n    -&gt; CanIf Tx PDU\n        -&gt; HTH -&gt; 对应哪个 CAN Controller\n\u003cstrong>RxPduId / CanNmRxPduRef(EB)\u003c/strong>\n    -&gt; CanIf Rx PDU / HRH / CAN ID Range\n        -&gt; 对应哪个 CAN Controller\u003c/code>\u003c/pre>\n\u003ch3 id=\"2-2-NM-协议分支\">2.2 NM 协议分支\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM Channel ESC_M\u003c/strong>\n    -&gt; Nm Channel ChassisCan1NmCluster\n        -&gt; CanNm Channel CanNm_ChanConfig / CanNmChannelConfig_0(EB)\n            -&gt; CanIf NM Tx/Rx PDU\u003c/code>\u003c/pre>\n\u003cp>含义：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM 创建/配置一个逻辑通信通道 ESC_M。\u003c/strong> \u003cstrong>Nm、CanNm、CanSM 都引用这个 ComM Channel。\u003c/strong> \u003cstrong>这样它们就串成同一条通信管理链路。\u003c/strong>\u003c/code>\u003c/pre>\n\u003ch2 id=\"3-一个-CanSM-Network-管两个-Controller\">3. 一个 CanSM Network 管两个 Controller\u003c/h2>\n\u003cp>当前项目配置：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>CanSM Network Name = ESC_M\u003c/strong>\n\u003cstrong>ComM Channel = /ComM/ComM/ComMConfigSet/ESC_M\u003c/strong>\n\u003cstrong>List of CAN Controllers = ESC_M / ESC_S\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>结论：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>一路 ComM Channel ESC_M -&gt; 控制一个 CanSM Network ESC_M -&gt; 这个 CanSM Network 管两个 Controller\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>什么时候一路 ComM 就够：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>两个 Controller 总是一起醒、一起睡。\u003c/strong>\n\u003cstrong>两个 Controller 属于同一个逻辑通信通道。\u003c/strong>\n\u003cstrong>应用不需要分别控制它们。\u003c/strong>\u003cstrong>客户需求也不要求一个开、一个关。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>什么时候必须拆两路 ComM：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>两个 Controller 要独立睡眠/唤醒。\u003c/strong>\n\u003cstrong>一个 Controller 通信时，另一个不应该被带起来。\u003c/strong>\n\u003cstrong>两个 CAN bus 有不同 NM 报文。\u003c/strong>\n\u003cstrong>两个网络有不同 ComM 用户、不同诊断、不同 BusOff 策略。\u003c/strong>\u003cstrong>客户要求分开控制。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cp>判断口诀：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>不是“两个 Controller 就必须两个 ComM”。\u003c/strong>\n\u003cstrong>而是“独立通信控制需求 = 独立 ComM Channel / CanSM Network / Nm / CanNm”。\u003c/strong>\u003c/code>\u003c/pre>\n\u003ch2 class=\"major-break\" id=\"10-CanSM-配置项\">10. CanSM 配置项\u003c/h2>\n\u003cdiv class=\"chapter-dense-intro\">\u003cdiv class=\"compact-card wide\">\u003cdiv class=\"card-title\">第 10 章核心定位\u003c/div>\u003cp>CanSM 是 CAN State Manager。\u003cspan style=\"background-color: rgba(79, 136, 216, 0.06); font-size: 10pt;\">它不负责 NM 报文内容，它负责把 ComM 的通信模式请求落到 CAN Controller 状态。\u003c/span>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM\n    -&gt; CanSM_RequestComMode(Network, mode)\n        -&gt; CanSM\n            -&gt; CanIf / CanDrv / CanTrcv\n                -&gt; Controller STARTED / STOPPED / SLEEP\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>ComM 决定要不要通信。\nCanSM 执行 CAN Controller 怎么切。\nCanNm 决定 NM 报文怎么发。\nCanIf 决定 PDU 走哪个 Controller/HRH/HTH。\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\n\u003cdiv class=\"chapter-dense-grid chapter-10-grid\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-1-CanSM-在链路里的位置\">10.1 CanSM 在链路里的位置\u003c/div>\u003cp>\u003cstrong>当前项目：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM Channel:\u003c/strong>\n    ESC_M\n\u003cstrong>CanSM Network:\u003c/strong>\n    ESC_M\nComMChId / CanSMComMNetworkHandleRef(EB):\n    ESC_M\n\u003cstrong>CanSM Controllers:\u003c/strong>\n    ESC_M\n    ESC_S\u003c/code>\u003c/pre>\u003cp>\u003cstrong>含义：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM 的 ESC_M 通道请求 FullCom / SilentCom / NoCom。\nCanSM 的 ESC_M Network 收到请求。\n这个 CanSM Network 负责控制 ESC_M 和 ESC_S 两个 CAN Controller。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>注意：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>一个 CanSM Network 管两个 Controller，只代表模式控制一起管。\n不代表 NM 报文自动复制到两个 Controller。\nNM 报文走哪个 Controller，要看 CanIf Tx PDU 的 HTH 和 Rx PDU 的 HRH。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-2-CanSMComMNetworkHandleRef-ComM-Network-Handle-Reference-EB\">10.2 ComMChId / CanSMComMNetworkHandleRef(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:\u003c/strong>\n    ESC_M\n\u003cstrong>含义:\u003c/strong>\n    CanSM Network 绑定 ComM Channel。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM 请求 ESC_M FullCom\n    -&gt; CanSM 找到 ESC_M Network\n        -&gt; 控制该 Network 下的 Controller\u003c/code>\u003c/pre>\u003cp>\u003cstrong>如果配错：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM 请求模式时找不到正确 CAN Network。\n表现可能是 ComM 状态在变，但 Controller 不按预期 STARTED/STOPPED。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>排查：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>FullCom 请求存在，但 Controller 不起来：\u003c/strong>\n    先查 ComMChId / CanSMComMNetworkHandleRef(EB) 是否指向 ESC_M。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-3-CanSMController-List-of-CAN-Controllers-EB-List\">10.3 CtrlRef / CanSMController(EB) List\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>ESC_M 和 ESC_S\u003c/code>\u003c/pre>\u003cp>\u003cstrong>含义：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>CanSM Network ESC_M 下挂两个 CanIf Controller。\nComM 对 ESC_M 的模式请求，会由 CanSM 应用到这两个 Controller。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>什么时候这样配合理：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>两个 Controller 总是一起醒、一起睡。\n两个 Controller 属于同一个逻辑通信域。\n客户不要求独立控制。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>什么时候不合理：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>一个 Controller 要能单独睡，另一个保持通信。\n两个 Controller 有不同 NM。\n两个 Controller 有不同诊断通道。\n两个 Controller 有不同 BusOff 策略或安全策略。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>判断口诀：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>控制需求一起走，就放一个 CanSM Network。\n控制需求要拆开，就拆 ComM Channel / CanSM Network / Nm / CanNm。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-4-CanSM-三个通信模式怎么落地\">10.4 CanSM 三个通信模式怎么落地\u003c/div>\u003cp>\u003cstrong>FullCom：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM -&gt; CanSM_RequestComMode(FULL)\nCanSM -&gt; CanIf_SetControllerMode(STARTED)\nCanSM -&gt; CanIf_SetPduMode(ONLINE) 或供应商等效处理\u003c/code>\u003c/pre>\u003cp>\u003cstrong>效果：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>可收可发。CanNm 能发 NM。CanTp/DCM 可以诊断。普通报文也有通信\u003c/code>\u003c/pre>\u003cp>\u003cstrong>SilentCom：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM -&gt; CanSM_RequestComMode(SILENT)\nCanSM -&gt; Controller 通常保持可接收，Tx 方向受限\u003c/code>\u003c/pre>\u003cp>\u003cstrong>效果：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>通常可收不可发。 DCM 可能收得到请求，但响应发不出去。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>NoCom：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM -&gt; CanSM_RequestComMode(NO_COMM)\nCanSM -&gt; CanIf_SetControllerMode(STOPPED / SLEEP)\nCanSM -&gt; PDU mode OFFLINE\u003c/code>\u003c/pre>\u003cp>\u003cstrong>效果：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>该 CAN 通道无法正常收发。DCM、CanTp、CanNm、普通报文都受影响。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"fit-row ch10-fit-row\">\u003cdiv class=\"fit-col\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-5-CanSMModeRequestRepetitionMax-Time\">10.5 CanSMModeRequestRepetitionMax / Time\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>ModeReqRepMax / CanSMModeRequestRepetitionMax(EB) = 10\nModeReqRepTime / CanSMModeRequestRepetitionTime(EB) = 0.005 s\u003c/code>\u003c/pre>\u003cp>\u003cstrong>含义：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>CanSM 请求 CanIf/CanDrv 切 Controller 模式时，如果一次没成功，会重试。 最多重试 10 次。 每 5ms 重试一次。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>重试太少:     \u003c/strong>瞬态失败时容易直接进入错误处理。\n\u003cstrong>重试太多:     \u003c/strong>控制器确实异常时，状态切换会拖更久。\n\u003cstrong>重试周期太短: \u003c/strong>压力更大，但响应更快。\n\u003cstrong>重试周期太长: \u003c/strong>模式切换变慢。\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM 请求 FullCom 后 Controller 起不来：\u003c/strong>\n    查 CanSM 是否在重复请求。\n    查 CanIf_SetControllerMode 返回值。\n    查 CanIf_ControllerModeIndication 是否回来。\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003cdiv class=\"fit-col fit-stack\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-7-CanSM-PN-配置\">10.7 CanSM PN 配置\u003c/div>\u003cp>\u003cstrong>当前：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>CANSM_PNSUPPORT / CanSMPNSupport(EB) = false\nCANSM_PARTIALNETWORKING / CanSMActivatePN(EB) = false\u003c/code>\u003c/pre>\u003cp>\u003cstrong>含义：\u003c/strong>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">CanSM 当前不参与 PN 唤醒链路。\u003c/span>\u003c/p>\u003cp>\u003cstrong>如果客户要求 PNC / Selective Wake：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>不能只打开 CANSM_PARTIALNETWORKING / CanSMActivatePN(EB)\n\u003cstrong>还要同步检查：\u003c/strong>\n    COMM_PNC_SUPPORT / ComMPncSupport(EB) / PncEnabled / ComMPncEnabled(EB)\n    CANNM_PN_SUPPORTED / CanNmPnSupported(EB)；PnEnabled / CanNmPnEnabled(EB)\n    CANIF_PUBLIC_PN_SUPPORT / CanIfPublicPnSupport(EB)\n    Com/PduR EIRA/ERA\n    BswM rules\n    CanTrcv selective wake 能力\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-10-CanSM-章节口诀\">10.10 CanSM 章节口诀\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>CanSM 管 Controller，不管 NM 报文字节。\nCanSM 响应 ComM 模式请求，不自己决定业务要不要通信。\nCanSM 可一个 Network 管多个 Controller，但 PDU 走哪个 Controller 由 CanIf 决定。\nBusOff 恢复参数在 CanSM，不在 CanNm。\nPN 要端到端打开，不能只开 CanSM。\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"10-6-CanSM-BusOff-Recovery-参数-逻辑和排查\">10.6 CanSM BusOff Recovery：参数、逻辑和排查\u003c/div>\u003cp>BusOff 恢复参数配置在 CanSM，不在 CanNm。BusOff 是 Controller / CanSM / CanIf / CanDrv 层的问题。\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>CanSM -&gt; CAN Network -&gt; ESC_M -&gt; General\u003c/code>\u003c/pre>\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 24.736%;\">\u003ccol style=\"width: 5.881%;\">\u003ccol style=\"width: 22.231%;\">\u003ccol style=\"width: 47.152%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>参数\u003c/th>\u003cth>当前值\u003c/th>\u003cth>作用\u003c/th>\u003cth>调参影响\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"key-cell\">\u003ccode>BorCounterL1ToL2 / CanSMBorCounterL1ToL2(EB)\u003c/code>\u003c/td>\u003ctd>5\u003c/td>\u003ctd>BusOff 恢复先走 L1；连续 BusOff/恢复失败达到阈值后进入 L2。\u003c/td>\u003ctd>值越小，越快进入慢恢复；值越大，越久停留在快恢复。总线严重异常时太大可能反复冲击总线。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">\u003ccode>BorTimeL1 / CanSMBorTimeL1(EB)\u003c/code>\u003c/td>\u003ctd>0.5 s\u003c/td>\u003ctd>L1 阶段 BusOff 后等待 0.5s 再尝试恢复 Controller。\u003c/td>\u003ctd>短则恢复快，但异常未消失时容易反复 BusOff；长则更保守但恢复慢。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">\u003ccode>BorTimeL2 / CanSMBorTimeL2(EB)\u003c/code>\u003c/td>\u003ctd>2.0 s\u003c/td>\u003ctd>连续 BusOff 进入 L2 后，每次恢复等待 2s。\u003c/td>\u003ctd>L2 比 L1 慢，用来处理连续 BusOff 或严重总线异常。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">\u003ccode>BorTimeTxEnsured / CanSMBorTimeTxEnsured(EB)\u003c/code>\u003c/td>\u003ctd>1.0 s\u003c/td>\u003ctd>Controller 恢复后观察 1s，稳定后 CanSM 才认为恢复可靠。\u003c/td>\u003ctd>太短可能误判恢复稳定；太长会延迟回到正常通信状态。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>BOR Tx Confirmation Polling\u003c/td>\u003ctd>未勾选\u003c/td>\u003ctd>当前没有打开 Tx Confirmation 轮询确认方式。\u003c/td>\u003ctd>是否依赖 Tx confirmation 判断恢复，要看供应商 CanSM 实现和其他配置。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">\u003ccode>CANSM_PROD_ERR_HANDLING_BUS_OFF / CanSMBusOffReportToDem(EB)\u003c/code> / \u003ccode>CANSM_E_BUS_OFF\u003c/code>\u003c/td>\u003ctd>DEM\u003c/td>\u003ctd>BusOff 事件会上报 DEM。\u003c/td>\u003ctd>如果 DEM event/mapping 没配好，可能 CanSM 检测到 BusOff，但诊断事件看不到。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>恢复逻辑\u003c/h4>\u003cpre class=\"dense-pre\">\u003ccode>BusOff 发生\n    -&gt; CanSM 收到 ControllerBusOff\n        -&gt; 进入 BOR\n            -&gt; L1 快恢复，等待 CanSMBorTimeL1\n                -&gt; 如果连续失败达到 CanSMBorCounterL1ToL2\n                    -&gt; 进入 L2 慢恢复，等待 CanSMBorTimeL2\n                        -&gt; Controller 恢复后观察 CanSMBorTimeTxEnsured\n                            -&gt; 稳定后回正常通信\u003c/code>\u003c/pre>\u003ch4>客户话术怎么翻译\u003c/h4>\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 13.026%;\">\u003ccol style=\"width: 39.925%;\">\u003ccol style=\"width: 47.049%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>客户说法\u003c/th>\u003cth>主查配置\u003c/th>\u003cth>不能忽略的非配置原因\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>BusOff 恢复太慢\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanSMBorTimeL1\u003c/code>、\u003ccode>CanSMBorTimeL2\u003c/code>、\u003ccode>CanSMBorCounterL1ToL2\u003c/code>、\u003ccode>CanSMBorTimeTxEnsured\u003c/code>\u003c/td>\u003ctd>先确认是不是连续 BusOff 已进入 L2，而不是单纯 L1 慢。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>BusOff 一直反复\u003c/td>\u003ctd>不要只把恢复时间调短\u003c/td>\u003ctd>优先查物理层、波特率、采样点、终端电阻、CAN ID 冲突、发送周期、BusLoad、ACK。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>BusOff 没有 DTC\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanSMBusOffReportToDem\u003c/code> / \u003ccode>CANSM_E_BUS_OFF\u003c/code>\u003c/td>\u003ctd>查 DEM event、event mapping、CanSM BusOff 回调是否进来。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"10-9-CanSM-常见故障定位\">10.9 CanSM 常见故障定位\u003c/div>\u003cp>ComM FullCom 请求后 Controller 不 STARTED：\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. ComM 是否真的请求 FullCom。\n2. ComMChId / CanSMComMNetworkHandleRef(EB) 是否绑定正确。\n3. CanSM Controller list 是否包含目标 Controller。\n4. CanIf_SetControllerMode 是否返回成功。\n5. ControllerModeIndication 是否回来。\n6. ModeRequestRepetition 是否已耗尽。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>Controller STARTED 但 NM 不发：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. COMM_NM_VARIANT_OF_CHANNEL / ComMNmVariant(EB) 是否 FULL。\n2. Nm_NetworkRequest 是否调用。\n3. CanNm 是否 Network Requested。\n4. CanNmTxPduRef / CanIf Tx PDU / HTH 是否正确。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>Controller STARTED 但诊断不通：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. ComM 当前是否 FullCom 而不是 SilentCom。\n2. CanIf PDU mode 是否 ONLINE。\n3. CanTp / PduR / DCM 路由是否正确。\n4. DCM 会话、安全、寻址是否正确。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>BusOff 恢复异常：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. CanSM 是否收到 BusOff indication。\n2. L1/L2 参数是否符合客户要求。\n3. 是否上报 DEM。\n4. 是否反复 BusOff。\n5. 物理层和总线负载是否异常。\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\n\u003c/main>\u003c/div>\u003c/body>\u003c/html>\n","notes/08/8.3.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>8.3 · Nm / CanNm：抽象层、状态机、NM PDU 与休眠过程\u003c/title>\u003cstyle>\n\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--navy:#1b2340;--accent:#4f88d8}\nbody{color:#1a1c2e;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n#wrap{margin:auto}#main{background:white;box-shadow:0 1px 6px #0000001a}\n#main h1{border-bottom:2px solid #1b2340;padding-bottom:10px;margin-bottom:14px;color:#0d1530}\n#main h2{color:#152060;border-bottom:1.5px solid #3a6ab8;padding-bottom:5px}\n#main h3{color:#1a346a;padding-left:9px;border-left:3px solid var(--accent)}\n#main h4{color:#253872}#main ul,#main ol{padding-left:22px}\n#main hr{border:0;border-top:1px solid #dde2ee;margin:10px 0}\n#main pre{background:#f2f4f8;border-left:3px solid #9aadd0;border-radius:0 4px 4px 0;margin:8px 0;overflow-wrap:anywhere}\n#main pre,#main code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}\n#main code{background:#e6ecf7;padding:0 3px;border-radius:2px;overflow-wrap:anywhere}\n#main pre code{background:none;padding:0;font-size:inherit}\n#main blockquote{border-left:3px solid #aab8d8;padding:8px 12px;background:#f5f7fc;color:#555}\n#main table{width:100%;border-collapse:collapse;table-layout:fixed}\n#main th,#main td{border:1px solid #d9e1f2;vertical-align:top;overflow-wrap:anywhere}\n#main th{background:#eaf0fb;color:#1a346a}#main tr:nth-child(even) td{background:#fbfcff}\n#main .key-cell{font-weight:700;color:#10235a}\n#main .keybox,#main .dense-note,#main .chapter-scan-note{border-left:3px solid #4f88d8;background:#f5f8ff;padding:10px 12px;margin:12px 0}\n#main .warnbox{border-left:3px solid #c7832f;background:#fff8ed;padding:10px 12px;margin:12px 0}\n#main .tag{display:inline-block;font-size:12px;font-weight:700;background:#405d95;color:white;border-radius:999px;padding:2px 6px;margin-right:5px}\n#main .muted{color:#65708a}\n#main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:12px 0}\n#main .compact-card,#main .param-card,#main .flow-card{border:1px solid #d8e1f2;background:#fbfcff;border-radius:6px;padding:12px;min-width:0;break-inside:avoid}\n#main .param-title,#main .flow-title,#main .card-title{font-weight:800;color:#152060;background:#edf3fc;margin:-12px -12px 10px;border-bottom:1px solid #d8e1f2;overflow-wrap:anywhere}\n#main .wide{grid-column:1/-1}#main .param-card pre,#main .compact-card pre{border:0}\n\n\n/* inserted-dfxy-nm-state-machine: DF_XY 项目应用层 NM 状态机矢量图 */\n#main .nm-state-section { margin: 4pt 0 5pt; }\n\n#main .nm-state-section .keybox { margin: 3pt 0; }\n\n#main .nm-state-svg {\n  width: 100%; height: auto; display: block; margin: 3pt 0;\n  border: 1px solid #d8e1f2; border-radius: 4px; background: #fbfdff;\n}\n\n#main .nm-state-svg text { font-family: inherit; fill: #17213a; }\n\n#main .nm-state-svg .lane { fill: #f3f6fb; stroke: #d9e1f0; stroke-width: 1; }\n\n#main .nm-state-svg .node { fill: #fff; stroke: #2f5f9f; stroke-width: 1.4; }\n\n#main .nm-state-svg .node-app { fill: #f6fbff; stroke: #2369a5; }\n\n#main .nm-state-svg .node-sleep { fill: #fff8ed; stroke: #bf7a24; }\n\n#main .nm-state-svg .node-proto { fill: #f8fbf4; stroke: #4f7f35; }\n\n#main .nm-state-svg .title { font-size: 17px; font-weight: 800; fill: #12245a; }\n\n#main .nm-state-svg .label { font-size: 13px; font-weight: 800; }\n\n#main .nm-state-svg .small { font-size: 11.5px; }\n\n#main .nm-state-svg .edge { stroke: #1f4e87; stroke-width: 1.7; fill: none; marker-end: url(#nmArrow); }\n\n#main .nm-state-svg .edge-warn { stroke: #b06a00; stroke-width: 1.6; fill: none; marker-end: url(#nmArrowWarn); }\n\n#main .nm-state-svg .edge-soft { stroke: #60708c; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; marker-end: url(#nmArrowSoft); }\n\n#main .nm-state-svg .edge-label rect { fill: #fff; stroke: #bfd0e8; stroke-width: .8; opacity: .96; }\n\n#main .nm-state-svg .edge-label text { font-size: 10.8px; font-weight: 800; fill: #18233a; }\n\n#main .nm-clean-svg .band { fill: #f7f9fe; stroke: #d8e1f2; stroke-width: 1; }\n\n#main .nm-clean-svg .state-box { fill: #fff; stroke: #426da9; stroke-width: 1.35; }\n\n#main .nm-clean-svg .state-box-wake { fill: #f5fbff; stroke: #2369a5; }\n\n#main .nm-clean-svg .state-box-sleep { fill: #fff8ed; stroke: #b87222; }\n\n#main .nm-clean-svg .state-box-proto { fill: #f8fbf4; stroke: #4f7f35; }\n\n#main .nm-clean-svg .band-title { font-size: 16px; font-weight: 800; fill: #12245a; }\n\n#main .nm-clean-svg .box-title { font-size: 13px; font-weight: 800; fill: #17213a; }\n\n#main .nm-clean-svg .box-note { font-size: 10.6px; fill: #38445c; }\n\n#main .nm-clean-svg .lane-title { font-size: 11.5px; font-weight: 800; fill: #40506f; }\n\n#main .nm-clean-svg .arrow { stroke: #1f4e87; stroke-width: 1.7; fill: none; marker-end: url(#nmCleanArrow); }\n\n#main .nm-clean-svg .arrow-
