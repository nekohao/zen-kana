ont-size: 12.4px; }\n\n  #main .nm-wide-svg .box-note, #main .nm-wide-svg .line-label text { font-size: 10px; }\n #main .nm-clean-svg .box-title { font-size: 12.4px; }\n #main .nm-clean-svg .box-note { font-size: 10px; }\n\n#main .nm-state-table { font-size: 7.85pt; line-height: 1.18; margin: 3pt 0; }\n\n#main .nm-state-table th, #main .nm-state-table td { padding: 2.2px 4px; }\n\n#main .nm-state-note { margin: 2pt 0; padding: 4px 7px; background: #f7f9fe; border-left: 3px solid #4f88d8; line-height: 1.28; }\n\n  #main .nm-state-svg { margin: 2pt 0; }\n\n  #main .nm-state-table { font-size: 7.15pt; line-height: 1.12; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: 1.8px 3px; }\n\n  #main .nm-state-svg { margin: 1pt 0; }\n\n  #main .nm-state-table { font-size: 6.45pt; line-height: 1.04; margin: .8pt 0; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: .8px 1.5px; }\n\n:root{--bar-h:0px}\nbody{font-size:15px;line-height:1.6;background:#edf1f6}\n#wrap{max-width:960px;padding:18px 14px 32px}\n#main{padding:20px 18px;border-radius:12px;overflow-wrap:anywhere}\n#main h1{font-size:23px;line-height:1.35;text-align:left}\n#main h2{font-size:20px;line-height:1.4;margin:24px 0 12px}\n#main h3{font-size:17px;line-height:1.4;margin:18px 0 8px}\n#main h4{font-size:15px}\n#main p,#main li{font-size:15px;line-height:1.65;margin:7px 0}\n#main code{font-size:13px}\n#main pre,#main pre.dense-pre{font-size:13px;line-height:1.55;padding:10px;white-space:pre-wrap}\n#main .param-card pre,#main .flow-card pre,#main .compact-card pre{font-size:13px;line-height:1.55}\n#main table{font-size:13px;line-height:1.55;margin:12px 0}\n#main th,#main td{padding:8px 7px}\n#main .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}\n#main .table-scroll>table{min-width:620px}\n#main .param-title,#main .flow-title,#main .card-title{font-size:15px;line-height:1.5;padding:8px}\n#main .chapter-dense-grid .param-card table,#main .chapter-quickref table{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card pre,#main .chapter-quickref pre{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card h4{font-size:15px}\n#main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{gap:12px}\n#main .nm-state-svg{min-width:800px}\n#main .figure-scroll{overflow-x:auto}\n#main .lesson-toc{padding:12px 16px;background:#f3f6fc;border-radius:8px}\n#main .lesson-toc a{display:block;padding:6px 0;color:#27558a}\n#main .source-note{font-size:13px;color:#52627c;background:#f3f6fc;padding:12px;border-left:3px solid #4f88d8}\n@media(max-width:600px){\n #main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{grid-template-columns:1fr}\n #main{padding:18px 14px}#wrap{padding:12px 8px 24px}\n #main .table-scroll:before{content:'左右滑动查看表格';display:block;font-size:12px;color:#65708a;margin-top:8px}\n #main .figure-scroll:before{content:'左右滑动查看完整状态图';display:block;font-size:12px;color:#65708a;margin-top:8px}\n}\n@media print{\n body{font-size:10pt;background:white}#wrap,#main{padding:0}\n #main .lesson-toc{display:none}#main .table-scroll,#main .figure-scroll{overflow:visible}\n #main .table-scroll>table,#main .nm-state-svg{min-width:0}\n #main h2.major-break{break-before:auto!important;page-break-before:auto!important}\n #main table,#main p,#main li{font-size:9pt}#main pre,#main code{font-size:8pt}\n}\n\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"wrap\">\u003cmain id=\"main\">\n\u003ch1>8.3 · Nm / CanNm：抽象层、状态机、NM PDU 与休眠过程\u003c/h1>\n\u003cp class=\"source-note\">整理自 NM 配置打印版笔记。DF_XY、ESC_M / ESC_S、参数数值及开关状态均为原笔记中的项目示例，请结合实际项目核对。本笔记覆盖本课相关内容，不代表完整课程教案。\u003c/p>\n\u003cnav class=\"lesson-toc\" aria-label=\"本课目录\">\u003ca href=\"#7-CanNm-配置项\">7. CanNm 配置项\u003c/a>\u003ca href=\"#8-Nm-配置项\">8. Nm 配置项\u003c/a>\u003c/nav>\n\u003ch2 class=\"major-break\" id=\"7-CanNm-配置项\">7. CanNm 配置项\u003c/h2>\n\u003cdiv class=\"compact-grid chapter-7-intro\">\n\u003cdiv class=\"compact-card\">\u003cdiv class=\"card-title\">CanNm 负责什么\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>1. NM 状态机时间：\u003c/strong>Repeat / Normal / ReadySleep / PrepareBusSleep / BusSleep。\n\u003cstrong>2. NM 报文行为：\u003c/strong>周期、首发 offset、TxConfirmation timeout。\n\u003cstrong>3. NM PDU 内容：\u003c/strong>NID、CBV、UserData、PN 信息、CarWakeUp 位。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"compact-card\">\u003cdiv class=\"card-title\">什么时候重点看 CanNm\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>周期不对：\u003c/strong>CanNmMsgCycleTime、Immediate NM、BusLoadReduction。\n\u003cstrong>释放后不睡：\u003c/strong>CanNmTimeoutTime、CanNmWaitBusSleepTime，先确认本地请求已释放。\n\u003cstrong>内容不对：\u003c/strong>NodeId、NID/CBV Position、UserDataLength、PN offset。\n\u003cstrong>发送确认异常：\u003c/strong>CanNmMsgTimeoutTime、CanIf TxConfirmation。\u003c/code>\u003c/pre>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"chapter-scan-note\">\u003cstrong>CanNm 排查边界：\u003c/strong>先确认 ComM 已允许 FullCom、CanSM Controller 已 STARTED、Nm 已触发 NetworkRequest、CanIf TxPduRef/HTH 正确；这些不成立时，改 \u003ccode>CanNmMsgCycleTime\u003c/code>、\u003ccode>RepeatMessageTime\u003c/code>、\u003ccode>TimeoutTime\u003c/code> 通常没用。\u003c/div>\n\u003ch3 id=\"7-2-EB-界面名和-xdm-参数名速查表\">7.2 EB 界面名和 xdm 参数名速查表\u003c/h3>\n\u003cp>这张表用来把 EB 界面、xdm 参数、当前值和生效条件放在一起看。比一段一段背字段名更适合现场查配置。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 21.891%;\">\u003ccol style=\"width: 23.058%;\">\u003ccol style=\"width: 7.253%;\">\u003ccol style=\"width: 47.798%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>EB 界面名\u003c/th>\u003cth>xdm / AUTOSAR 参数名\u003c/th>\u003cth>当前值\u003c/th>\u003cth>生效条件 / 约束 / 注意点\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>Immediate NM PDU cycle time\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmImmediateNmCycleTime\u003c/code>\u003c/td>\u003ctd>0.001 s\u003c/td>\u003ctd>只有 \u003ccode>CanNmImmediateNmTransmissions &gt; 1\u003c/code> 时，“快发间隔”才真正有间隔意义；当前帧数为 0，所以不生效。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Number of immediate NM PDUs\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmImmediateNmTransmissions\u003c/code>\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0 表示不发送 immediate NM；因此 \u003ccode>CANNM_IMMEDIATE_TRANSMISSION = STD_OFF\u003c/code>，生成代码也不会生成 immediate count/cycle 字段。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Message Cycle Offset [s]\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmMsgCycleOffset\u003c/code>\u003c/td>\u003ctd>0.005 s\u003c/td>\u003ctd>小于 \u003ccode>CanNmMsgCycleTime\u003c/code>；最好是 \u003ccode>CanNmMainFunctionPeriod\u003c/code> 的整数倍。当前 5ms = 1 tick。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Message Cycle Time [s]\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmMsgCycleTime\u003c/code>\u003c/td>\u003ctd>0.1 s\u003c/td>\u003ctd>正常 NM 周期；Passive Mode 打开时该参数对发送周期无意义。当前 100ms = 20 tick。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Message Reduced Time [s]\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmMsgReducedTime\u003c/code>\u003c/td>\u003ctd>0.05 s\u003c/td>\u003ctd>只有 \u003ccode>CanNmBusLoadReductionEnabled = true\u003c/code> 且通道 \u003ccode>CanNmBusLoadReductionActive = true\u003c/code> 时生效；当前总开关关闭，所以不生效。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Message Timeout Time [s]\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmMsgTimeoutTime\u003c/code>\u003c/td>\u003ctd>0.04 s\u003c/td>\u003ctd>本节点 NM PDU 发送后等待 TxConfirmation 的超时；不是网络管理 Timeout。当前 40ms = 8 tick，应小于 Message Cycle Time。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Repeat Message Time [s]\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmRepeatMessageTime\u003c/code>\u003c/td>\u003ctd>0.515 s\u003c/td>\u003ctd>Repeat Message State 持续时间，不是发送周期。当前 515ms = 103 tick；如果启用 immediate NM，应大于 immediate 帧数 × immediate 周期。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Timeout Time [s]\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmTimeoutTime\u003c/code>\u003c/td>\u003ctd>1.0 s\u003c/td>\u003ctd>NM 网络活动超时；应大于 Message Cycle Time。当前 1s = 200 tick；不是 TxConfirmation timeout，也不是最终下电时间。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Wait Bus Sleep Time [s]\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmWaitBusSleepTime\u003c/code>\u003c/td>\u003ctd>5.0 s\u003c/td>\u003ctd>Prepare Bus-Sleep Mode 等待时间。当前 5s = 1000 tick；不是 EcuM 最终下电时间。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Node Identifier\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmNodeId\u003c/code>\u003c/td>\u003ctd>8\u003c/td>\u003ctd>只有 \u003ccode>CanNmNodeIdEnabled = true\u003c/code> 时有效；当前本节点 NM PDU 的 NID = 8。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PDU Node Identifier Position\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmPduNidPosition\u003c/code>\u003c/td>\u003ctd>\u003ccode>BYTE_0\u003c/code>\u003c/td>\u003ctd>NID 放 Byte0；对端 NM Matrix 必须一致。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PDU Control Bit Vector Position\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmPduCbvPosition\u003c/code>\u003c/td>\u003ctd>\u003ccode>BYTE_1\u003c/code>\u003c/td>\u003ctd>CBV 放 Byte1；Repeat Message Request、Active Wakeup、PNI 等控制位由这里解析。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>User Data Length\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmUserDataLength\u003c/code>\u003c/td>\u003ctd>6\u003c/td>\u003ctd>DLC 8 扣掉 NID 和 CBV 后剩 6 字节 UserData。当前 Byte2~Byte7 是 UserData 区域。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"7-3-CanNm-状态机粗链路\">7.3 CanNm 状态机粗链路\u003c/h3>\n\u003cdiv class=\"flow-grid\">\u003cdiv class=\"flow-card\">\u003cdiv class=\"flow-title\">请求网络时：\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM FullCom\u003c/strong>\n    -&gt; Nm_NetworkRequest\n        -&gt; CanNm_NetworkRequest\n            -&gt; Repeat Message\n                -&gt; Normal Operation\n                    -&gt; 周期发送 NM\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"flow-card\">\u003cdiv class=\"flow-title\">释放网络时：\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM 释放 FullCom\u003c/strong>\n    -&gt; Nm_NetworkRelease\n        -&gt; CanNm_NetworkRelease\n            -&gt; Ready Sleep\n                -&gt; Prepare Bus Sleep\n                    -&gt; Bus Sleep\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"flow-card\" style=\"grid-column: 1 / -1;\">\u003cdiv class=\"flow-title\">几个时间参数大概落点：\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>Repeat Message: \u003c/strong>看 RMSTime / CanNmRepeatMessageTime(EB)。\n\u003cstrong>Normal Operation 周期发 NM: \u003c/strong>看 MsgCycleTime / CanNmMsgCycleTime(EB)。\n\u003cstrong>本节点等待 Tx confirmation: \u003c/strong>看 MsgTimeoutTime / CanNmMsgTimeoutTime(EB)。\n\u003cstrong>网络管理超时: \u003c/strong>看 CanNmTime / CanNmTimeoutTime(EB)。\n\u003cstrong>Prepare Bus Sleep 等待: \u003c/strong>看 WBSTime / CanNmWaitBusSleepTime(EB)。\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\n\u003ch3 id=\"7-3-1-DF-XY-应用层-NM状态机\">7.3.1 DF_XY 应用层 NM 状态机（CanM_Nm.c）\u003c/h3>\n\u003cdiv class=\"nm-state-section\">\u003cdiv class=\"keybox\">\u003cspan class=\"tag\">项目结论\u003c/span>应用层只操控&nbsp;\u003ccode>NETWORK_REQUESTED\u003c/code> / \u003ccode>NETWORK_RELEASED\u003c/code> 两个本地意图；CanNm HSM 才是真正协议状态机。\u003c/div>\u003cdiv class=\"figure-scroll\">\u003csvg aria-label=\"DF_XY NM 状态机放大直标版\" class=\"nm-state-svg nm-wide-svg\" role=\"img\" viewBox=\"0 0 960 560\">\u003cdefs>\u003cmarker id=\"nmWideArrow\" markerHeight=\"8\" markerWidth=\"8\" orient=\"auto\" refX=\"7\" refY=\"4\">\u003cpath d=\"M0,0 L8,4 L0,8 Z\" fill=\"#1f4e87\">\u003c/path>\u003c/marker>\u003cmarker id=\"nmWideArrowWarn\" markerHeight=\"8\" markerWidth=\"8\" orient=\"auto\" refX=\"7\" refY=\"4\">\u003cpath d=\"M0,0 L8,4 L0,8 Z\" fill=\"#b06a00\">\u003c/path>\u003c/marker>\u003cmarker id=\"nmWideArrowSoft\" markerHeight=\"8\" markerWidth=\"8\" orient=\"auto\" refX=\"7\" refY=\"4\">\u003cpath d=\"M0,0 L8,4 L0,8 Z\" fill=\"#60708c\">\u003c/path>\u003c/marker>\u003c/defs>\u003crect class=\"wide-band\" height=\"222\" rx=\"7\" width=\"932\" x=\"14\" y=\"14\">\u003c/rect>\u003ctext class=\"wide-title\" x=\"28\" y=\"38\">A. 应用层意图态：CanM_Nm_NetworkState 控制本节点是否主动保持网络\u003c/text>\u003ctext class=\"lane-title\" x=\"30\" y=\"70\">请求 / 保持网络\u003c/text>\u003crect class=\"wide-box wide-box-wake\" height=\"48\" rx=\"6\" width=\"125\" x=\"74\" y=\"86\">\u003c/rect>\u003ctext class=\"box-title\" x=\"106\" y=\"106\">IGN ON\u003c/text>\u003ctext class=\"box-note\" x=\"92\" y=\"123\">或 IGN_HW 唤醒\u003c/text>\u003crect class=\"wide-box wide-box-wake\" height=\"48\" rx=\"6\" width=\"160\" x=\"282\" y=\"86\">\u003c/rect>\u003ctext class=\"box-title\" x=\"300\" y=\"106\">NETWORK_REQUESTED\u003c/text>\u003ctext class=\"box-note\" x=\"316\" y=\"123\">本地保持网络\u003c/text>\u003crect class=\"wide-box wide-box-wake\" height=\"48\" rx=\"6\" width=\"130\" x=\"530\" y=\"86\">\u003c/rect>\u003ctext class=\"box-title\" x=\"563\" y=\"106\">ComM FULL\u003c/text>\u003ctext class=\"box-note\" x=\"552\" y=\"123\">handle 0/1 请求\u003c/text>\u003crect class=\"wide-box wide-box-wake\" height=\"48\" rx=\"6\" width=\"136\" x=\"742\" y=\"86\">\u003c/rect>\u003ctext class=\"box-title\" x=\"779\" y=\"106\">ReqFlag=1\u003c/text>\u003ctext class=\"box-note\" x=\"765\" y=\"123\">CanNm 请求网络\u003c/text>\u003cpath class=\"flow-line\" d=\"M199 110 H282\">\u003c/path>\u003cg class=\"line-label\" transform=\"translate(204 64)\">\u003crect height=\"30\" rx=\"4\" width=\"102\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">IgnOnOffSts=1\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">刷新 20s 保持\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line\" d=\"M442 110 H530\">\u003c/path>\u003cg class=\"line-label\" transform=\"translate(448 64)\">\u003crect height=\"30\" rx=\"4\" width=\"132\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">PreNetworkState 变化\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">RequestComMode(FULL)\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line\" d=\"M660 110 H742\">\u003c/path>\u003cg class=\"line-label\" transform=\"translate(666 64)\">\u003crect height=\"30\" rx=\"4\" width=\"118\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">Nm_NetworkRequest\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">置 CanNm 请求标志\u003c/tspan>\u003c/text>\u003c/g>\u003ctext class=\"lane-title\" x=\"30\" y=\"168\">释放 / 睡眠请求\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"48\" rx=\"6\" width=\"125\" x=\"74\" y=\"182\">\u003c/rect>\u003ctext class=\"box-title\" x=\"105\" y=\"202\">IGN OFF\u003c/text>\u003ctext class=\"box-note\" x=\"93\" y=\"219\">OffMode 每 5ms\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"48\" rx=\"6\" width=\"160\" x=\"282\" y=\"182\">\u003c/rect>\u003ctext class=\"box-title\" x=\"324\" y=\"202\">20s 保持\u003c/text>\u003ctext class=\"box-note\" x=\"308\" y=\"219\">仍是 REQUESTED\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"48\" rx=\"6\" width=\"160\" x=\"530\" y=\"182\">\u003c/rect>\u003ctext class=\"box-title\" x=\"548\" y=\"202\">NETWORK_RELEASED\u003c/text>\u003ctext class=\"box-note\" x=\"566\" y=\"219\">本地不再请求\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"48\" rx=\"6\" width=\"120\" x=\"772\" y=\"182\">\u003c/rect>\u003ctext class=\"box-title\" x=\"803\" y=\"202\">ComM NO\u003c/text>\u003ctext class=\"box-note\" x=\"798\" y=\"219\">ReqFlag=0\u003c/text>\u003cpath class=\"flow-line-warn\" d=\"M199 206 H282\">\u003c/path>\u003cg class=\"line-label warn\" transform=\"translate(204 140)\">\u003crect height=\"30\" rx=\"4\" width=\"126\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">NetworkReleased 每5ms\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">计时未到仍保持\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line-warn\" d=\"M442 206 H530\">\u003c/path>\u003cg class=\"line-label warn\" transform=\"translate(458 140)\">\u003crect height=\"30\" rx=\"4\" width=\"112\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">AwakeCntEnd==0\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">才切 RELEASED\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line-warn\" d=\"M690 206 H772\">\u003c/path>\u003cg class=\"line-label warn\" transform=\"translate(692 140)\">\u003crect height=\"30\" rx=\"4\" width=\"124\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">RequestComMode(NO)\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">CanNm_NetworkRelease\u003c/tspan>\u003c/text>\u003c/g>\u003crect class=\"wide-band\" height=\"292\" rx=\"7\" width=\"932\" x=\"14\" y=\"256\">\u003c/rect>\u003ctext class=\"wide-title\" x=\"28\" y=\"280\">B. CanNm HSM 协议状态：这里才是 AUTOSAR NM 真正的状态机\u003c/text>\u003ctext class=\"lane-title\" x=\"30\" y=\"314\">本地请求或总线活动拉起网络\u003c/text>\u003crect class=\"wide-box wide-box-proto\" height=\"52\" rx=\"6\" width=\"128\" x=\"54\" y=\"330\">\u003c/rect>\u003ctext class=\"box-title\" x=\"83\" y=\"351\">BusSleep\u003c/text>\u003ctext class=\"box-note\" x=\"76\" y=\"368\">或 Prepare\u003c/text>\u003crect class=\"wide-box wide-box-proto\" height=\"52\" rx=\"6\" width=\"142\" x=\"266\" y=\"330\">\u003c/rect>\u003ctext class=\"box-title\" x=\"296\" y=\"351\">NetworkMode\u003c/text>\u003ctext class=\"box-note\" x=\"293\" y=\"368\">启动 NmTimer\u003c/text>\u003crect class=\"wide-box wide-box-proto\" height=\"52\" rx=\"6\" width=\"142\" x=\"492\" y=\"330\">\u003c/rect>\u003ctext class=\"box-title\" x=\"526\" y=\"351\">Repeat Msg\u003c/text>\u003ctext class=\"box-note\" x=\"518\" y=\"368\">RMS timer 运行\u003c/text>\u003crect class=\"wide-box wide-box-proto\" height=\"52\" rx=\"6\" width=\"142\" x=\"718\" y=\"330\">\u003c/rect>\u003ctext class=\"box-title\" x=\"750\" y=\"351\">Normal Op\u003c/text>\u003ctext class=\"box-note\" x=\"740\" y=\"368\">周期发送 NM\u003c/text>\u003cpath class=\"flow-line\" d=\"M182 356 H266\">\u003c/path>\u003cg class=\"line-label\" transform=\"translate(184 286)\">\u003crect height=\"30\" rx=\"4\" width=\"142\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">ReqFlag=1 / Rx / Start\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">从睡眠拉回网络\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line\" d=\"M408 356 H492\">\u003c/path>\u003cg class=\"line-label\" transform=\"translate(420 286)\">\u003crect height=\"30\" rx=\"4\" width=\"118\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">进入发送子状态\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">准备发 NM\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line\" d=\"M634 356 H718\">\u003c/path>\u003cg class=\"line-label\" transform=\"translate(644 286)\">\u003crect height=\"30\" rx=\"4\" width=\"126\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">RMS timer 到 0\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">ReqFlag=1 进 Normal\u003c/tspan>\u003c/text>\u003c/g>\u003ctext class=\"lane-title\" x=\"30\" y=\"450\">本地释放后按 CanNm 定时器走向睡眠\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"52\" rx=\"6\" width=\"142\" x=\"54\" y=\"466\">\u003c/rect>\u003ctext class=\"box-title\" x=\"88\" y=\"487\">Normal Op\u003c/text>\u003ctext class=\"box-note\" x=\"82\" y=\"504\">本地请求清除\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"52\" rx=\"6\" width=\"142\" x=\"278\" y=\"466\">\u003c/rect>\u003ctext class=\"box-title\" x=\"314\" y=\"487\">ReadySleep\u003c/text>\u003ctext class=\"box-note\" x=\"303\" y=\"504\">仍可接收网络活动\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"52\" rx=\"6\" width=\"154\" x=\"502\" y=\"466\">\u003c/rect>\u003ctext class=\"box-title\" x=\"520\" y=\"487\">PrepareBusSleep\u003c/text>\u003ctext class=\"box-note\" x=\"545\" y=\"504\">WBSTime 等待\u003c/text>\u003crect class=\"wide-box wide-box-sleep\" height=\"52\" rx=\"6\" width=\"132\" x=\"738\" y=\"466\">\u003c/rect>\u003ctext class=\"box-title\" x=\"773\" y=\"487\">BusSleep\u003c/text>\u003ctext class=\"box-note\" x=\"773\" y=\"504\">停止 NM 收发\u003c/text>\u003cpath class=\"flow-line-warn\" d=\"M196 492 H278\">\u003c/path>\u003cg class=\"line-label warn\" transform=\"translate(196 402)\">\u003crect height=\"30\" rx=\"4\" width=\"108\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">ReqFlag=0\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">Normal 转 Ready\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line-warn\" d=\"M420 492 H502\">\u003c/path>\u003cg class=\"line-label warn\" transform=\"translate(426 402)\">\u003crect height=\"30\" rx=\"4\" width=\"108\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">NmTimer=0\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">进入 Prepare\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line-warn\" d=\"M656 492 H738\">\u003c/path>\u003cg class=\"line-label warn\" transform=\"translate(660 402)\">\u003crect height=\"30\" rx=\"4\" width=\"108\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">WBSTime=0\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">进入 BusSleep\u003c/tspan>\u003c/text>\u003c/g>\u003cpath class=\"flow-line-soft\" d=\"M579 466 C548 426 382 408 337 382\">\u003c/path>\u003cg class=\"line-label\" transform=\"translate(356 426)\">\u003crect height=\"30\" rx=\"4\" width=\"154\">\u003c/rect>\u003ctext x=\"7\" y=\"12\">\u003ctspan dy=\"0\" x=\"7\">Prepare 中收到 Req/Rx\u003c/tspan>\u003ctspan dy=\"13\" x=\"7\">直接回 NetworkMode\u003c/tspan>\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cdiv class=\"table-scroll\">\u003ctable class=\"nm-state-table resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 6.908%;\">\u003ccol style=\"width: 54.965%;\">\u003ccol style=\"width: 38.127%;\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>图上区域\u003c/th>\u003cth>读图重点\u003c/th>\u003cth>现场判断\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd class=\"key-cell\">A 上半\u003c/td>\u003ctd>IGN ON 或 IGN_HW 唤醒后，应用层进入 \u003ccode>NETWORK_REQUESTED\u003c/code>，ComM 请求 FULL，CanNm 请求标志置 1。\u003c/td>\u003ctd>这是本节点主动保持网络。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"key-cell\">A 下半\u003c/td>\u003ctd>IGN OFF 后不是马上释放；\u003ccode>AwakeCntEnd\u003c/code> 没到 0 时仍保持 REQUESTED。\u003c/td>\u003ctd>关 IGN 后继续发一段 NM，优先查 20s 保持计时。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"key-cell\">B 上半\u003c/td>\u003ctd>CanNm 从 BusSleep/Prepare 被 Req/Rx/NetworkStart 拉到 NetworkMode，再经 RepeatMsg 到 NormalOp。\u003c/td>\u003ctd>Repeat 时间看 \u003ccode>CanNmRepeatMessageTime\u003c/code>，Normal 周期看 \u003ccode>CanNmMsgCycleTime\u003c/code>。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"key-cell\">B 下半\u003c/td>\u003ctd>本地释放只清 ReqFlag；协议还要按 ReadySleep、PrepareBusSleep、BusSleep 定时器逐步睡眠。\u003c/td>\u003ctd>不要把应用 \u003ccode>RELEASED\u003c/code> 误判成 CanNm 已 BusSleep。\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"key-cell\">C\u003c/td>\u003ctd>UserData、状态镜像、CanIf 诊断挡帧是项目层可见表现。\u003c/td>\u003ctd>诊断帧被挡时看 \u003ccode>CanM_Nm_u8NmCurrentState\u003c/code>，不要只看 ComM。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"nm-state-note\">\u003cb>读法：\u003c/b>先从 A 判断“本节点有没有主动请求”；再从 B 判断“CanNm 协议真实睡到哪一步”；最后用 C 的 UserData / 状态镜像 / CanIf 表现去对 Trace 和调试变量。\u003c/div>\u003c/div>\n\u003ch3 id=\"7-4-时间参数\">7.4 时间参数\u003c/h3>\n\u003cdiv class=\"param-grid canNm-time-grid\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">MsgCycleTime / CanNmMsgCycleTime(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>含义: \u003c/strong>正常 NM 报文周期。\n\u003cstrong>当前: \u003c/strong>100 ms。\n\u003cstrong>影响:\u003c/strong>变小，负载增加，网络保持更积极。\u003cbr>变大，负载降低，但可能影响对端 Timeout 判断。\n\u003cstrong>在哪里配:\u003c/strong>\n    CanNm -&gt; CanNm_ChanConfig / CanNmChannelConfig_0(EB) -&gt; MsgCycleTime / CanNmMsgCycleTime(EB)\n\u003cstrong>何时生效: \u003c/strong>CanNm 已经处于需要周期发送 NM 的状态时生效Controller 没 STARTED、ComM 没 FullCom 时，改这个也不会让 NM 发出来。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CanNmMsgCycleOffset / CanNmMsgCycleOffset(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>含义: \u003c/strong>本节点 NM 发送相位/首发偏移。\n\u003cstrong>当前: \u003c/strong>5 ms。\n\u003cstrong>影响:\u003c/strong>避免所有节点同时发送 NM。 必须小于 MsgCycleTime。\n\u003cstrong>在哪里配:\u003c/strong>\n    CanNm -&gt; CanNm_ChanConfig / CanNmChannelConfig_0(EB) -&gt; CanNmMsgCycleOffset / CanNmMsgCycleOffset(EB)\n\u003cstrong>何时生效:\u003c/strong>影响本节点 NM 首发相位。多节点同一网络时用于错开发送时间。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\" style=\"grid-column: 1 / -1;\">\u003cdiv class=\"param-title\">ImmediateNmTransmissions / CanNmImmediateNmTransmissions(EB)；ImmediateNmCycleTime / CanNmImmediateNmCycleTime(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>含义: \u003c/strong>唤醒或请求网络初期快速发送若干帧 NM。\n    ImmediateNmTransmissions / CanNmImmediateNmTransmissions(EB) \u003cb>决定快发几帧\u003c/b>。\n    ImmediateNmCycleTime / CanNmImmediateNmCycleTime(EB) \u003cb>决定这些快发帧之间的间隔\u003c/b>。\n\u003cstrong>影响: \u003c/strong>打开后可加快唤醒扩散。 但会增加短时间总线负载。\n\u003cstrong>在哪里配: \u003c/strong>CanNm -&gt; CanNm_ChanConfig / CanNmChannelConfig_0(EB) -&gt; ImmediateNmTransmissions / CanNmImmediateNmTransmissions(EB) / ImmediateNmCycleTime / CanNmImmediateNmCycleTime(EB)\n\u003cstrong>何时生效: \u003c/strong>网络请求初期、唤醒初期快速发 NM。\n\u003cstrong>注意: \u003c/strong>ImmediateNmTransmissions = 0 时，不发 immediate NM。  = 1 时，只快发 1 帧，快发周期没有间隔意义。\n    EB 里 ImmediateNmCycleTime / CanNmImmediateNmCycleTime(EB) 的 ENABLE 条件是 \u003cbr>ImmediateNmTransmissions / CanNmImmediateNmTransmissions(EB) &gt; 1。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">RMSTime / CanNmRepeatMessageTime(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>含义: \u003c/strong>Repeat 状态持续时间。它是“状态持续窗口”，不是慢发周期。\n\u003cstrong>当前: \u003c/strong>515 ms。\n\u003cstrong>影响: \u003c/strong>影响唤醒扩散、节点发现、Repeat Message Request 行为。\n\u003cstrong>在哪里配: \u003c/strong>CanNm -&gt; CanNmChannelConfig_0 -&gt; RMSTime / CanNmRepeatMessageTime(EB)\n\u003cstrong>何时生效: \u003c/strong>CanNm 进入 Repeat Message 状态后生效。\n\u003cstrong>注意: \u003c/strong>只改 RepeatMessageTime 不等于打开节点发现。\n    NodeDetection、RepeatMsgInd 等开关要另看。\n    如果配置了NM 快发，RepeatMessageTime 必须\u003cb>大于\u003c/b>：Number of immediate NM PDUs * Immediate NM PDU cycle time\n    这是为了保证 immediate 快发序列能落在 Repeat Message 状态窗口内。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CanNmTime / CanNmTimeoutTime(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>含义: \u003c/strong>NM 网络管理超时。持续收不到有效 NM 活动后，状态机会往睡眠方向走。 \u003cstrong>当前: \u003c/strong>1 s。\n\u003cstrong>影响: \u003c/strong>太短容易误判网络释放。 太长会延迟睡眠相关状态。\n\u003cstrong>在哪里配: \u003c/strong>CanNm -&gt; CanNmChannelConfig_0 -&gt; CanNmTime / CanNmTimeoutTime(EB)\n\u003cstrong>何时生效: \u003c/strong>需要区分当前 CanNm 所在状态：\u003cpre>\u003ccode>1. 当前在 Normal Operation：到期后，通常是重启 Timer，并可能报 CANNM_E_NETWORK_TIMEOUT。不会直接进入 ReadySleep\n   从 NOS 进入 RMS 的关键条件是本节点已经释放网络请求\n2. 当前在 ReadySleep：1s 内没有有效 NM 活动继续刷新 / 保持 NM Timeout Timer，会从 ReadySleep 进入 PrepareBusSleep。\n   Network Release 使状态机从 Normal Operation 走向 ReadySleep；CanNmTimeoutTime 超时使 ReadySleep 继续走向 PrepareBusSleep。\n当前结论：\n   客户问“对端不发后多久认为网络释放”，不能只 CanNmTimeoutTime\n   CanNmTimeoutTime = 1s 更准确表示：本节点已释放网络并处于 ReadySleep 后，如果 1s 内没有有效 NM 活动，则进入 PrepareBusSleep。\n   它不等于最终睡眠时间，最终进入 BusSleep 还要继续叠加 CanNmWaitBusSleepTime，并受 ComM / CanSM / 本地 Network Request / 其它节点 NM 活动影响。\u003c/code>\u003c/pre>\u003cstrong>注意: \u003c/strong>这个看的是 NM 超时，不是\u003c/code>Tx confirmation timeout(下方)\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">WBSTime / CanNmWaitBusSleepTime(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>含义: \u003c/strong>Prepare Bus Sleep 等待时间。\n\u003cstrong>当前: \u003c/strong>5 s。\n\u003cstrong>影响:\u003c/strong>太短可能对端还没同步睡眠。 太长会延迟总线进入睡眠。\n\u003cstrong>在哪里配: \u003c/strong>CanNm -&gt; CanNmChannelConfig_0 -&gt; WBSTime / CanNmWaitBusSleepTime(EB)\n\u003cstrong>何时生效: \u003c/strong>CanNm 进入 Prepare Bus Sleep 后开始计时。\n\u003cstrong>注意:\u003c/strong>这是 NM 进入 BusSleep 前的等待。不是 EcuM 最终下电时间。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">MsgTimeoutTime / CanNmMsgTimeoutTime(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>含义: \u003c/strong>等待本节点 NM Tx Confirmation 的超时时间。\n\u003cstrong>当前: \u003c/strong>40 ms。\n\u003cstrong>影响:\u003c/strong>太短可能误判发送失败。 太长会拖慢异常恢复。\n\u003cstrong>在哪里配: \u003c/strong>CanNm -&gt; CanNmChannelConfig_0 -&gt; MsgTimeoutTime / CanNmMsgTimeoutTime(EB)\n\u003cstrong>何时生效:\u003c/strong>\n    本节点发出 NM PDU 后，等待 CanIf/CanDrv TxConfirmation。\n\u003cstrong>注意: \u003c/strong>它盯的是“我这帧 NM 发出去有没有确认”。 CanNmTime / CanNmTimeoutTime(EB) 盯的是“网络管理活动是否超时”。\u003c/code>(上方单元格)\u003c/pre>\u003c/div>\u003c/div>\n\u003ch3 id=\"7-5-NM-PDU-8-字节布局与-PDU-引用\">7.5 NM PDU 8 字节布局与 PDU 引用\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 6.995%;\">\u003ccol style=\"width: 11.269%;\">\u003ccol style=\"width: 33.809%;\">\u003ccol style=\"width: 47.927%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>字节\u003c/th>\u003cth>当前含义\u003c/th>\u003cth>配置来源\u003c/th>\u003cth>注意点\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"key-cell\">Byte0\u003c/td>\u003ctd>Node ID，\u003cbr>本节点为&nbsp;\u003ccode>8\u003c/code>\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmNodeIdEnabled = true\u003c/code>\u003cbr>\u003ccode>CanNmNodeId = 8\u003c/code>\u003cbr>\u003ccode>CanNmPduNidPosition = CANNM_PDU_BYTE_0\u003c/code>\u003c/td>\u003ctd>用于标识 NM 报文来自哪个节点。当前 Byte0 已规划为 NID，应避免再把 UserData / PN Info / CarWakeUp 语义规划到 Byte0；实际允许范围以 CanNm 配置约束和客户 NM Matrix 为准。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Byte1\u003c/td>\u003ctd>CBV\u003cbr>Control Bit Vector\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmPduCbvPosition = CANNM_PDU_BYTE_1\u003c/code>\u003c/td>\u003ctd>CBV 位置变了，对端解析也必须同步变。PNI、Active Wakeup、Repeat Message Request 等控制位都依赖它。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Byte2\u003c/td>\u003ctd>UserData[0]\u003c/td>\u003ctd class=\"key-cell\" rowspan=\"6\">\u003ccode>CanNmUserDataEnabled = true\u003c/code>\u003cbr>\u003ccode>CanNmUserDataLength = 6\u003c/code>\u003cbr>\u003ccode>CanNmComUserDataSupport = false\u003c/code>\u003c/td>\u003ctd rowspan=\"6\">当前不是 COM 信号自动承载 UserData。UserData、PN Info、CarWakeUp bit 的位置需要按客户 NM Matrix 和 CanNm 配置统一规划；当前 Byte2~Byte7 是可用 UserData 区域。若后续启用 PNC，PN Info 可能占用其中部分字节，具体看 \u003ccode>PnInfoOffset\u003c/code> / \u003ccode>PnInfoLength\u003c/code>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Byte3\u003c/td>\u003ctd>UserData[1]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Byte4\u003c/td>\u003ctd>UserData[2]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Byte5\u003c/td>\u003ctd>UserData[3]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Byte6\u003c/td>\u003ctd>UserData[4]\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Byte7\u003c/td>\u003ctd>UserData[5]\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>常见 CBV 位\u003c/h4>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 6.779%;\">\u003ccol style=\"width: 22.84%;\">\u003ccol style=\"width: 70.381%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>CBV bit\u003c/th>\u003cth>常见含义\u003c/th>\u003cth>当前 DF_XY 怎么看\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"key-cell\">bit0\u003c/td>\u003ctd>Repeat Message Request\u003c/td>\u003ctd>用于请求进入/保持 Repeat Message，常见于唤醒扩散、节点发现。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">bit3\u003c/td>\u003ctd>NM Coordinator Sleep Ready\u003c/td>\u003ctd>Coordinator 睡眠准备相关；当前未启用 Coordinator 时通常不用。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">bit4\u003c/td>\u003ctd>Active Wakeup\u003c/td>\u003ctd>表示本节点主动唤醒网络；是否使用取决于 CanNm ActiveWakeup 相关配置。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">bit6\u003c/td>\u003ctd>PNI, Partial Network Information\u003c/td>\u003ctd>表示 NM PDU 中携带 PN 信息；当前 DF_XY PNC 关闭，不能按 PN 有效位理解。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>PDU 引用和物理 Controller\u003c/h4>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>RxPduId / CanNmRxPduRef(EB)\u003c/strong> 和  \u003cstrong>TxPduId / CanNmTxPduRef(EB) \u003c/strong>只是在 CanNm 里引用 PDU。\n\u003cstrong>真正的 CAN ID、HRH、HTH、Controller 绑定在 CanIf/EcuC。\u003c/strong>\u003c/code>\u003c/pre>\n\u003cdiv class=\"warnbox\">所以即使 CanNm 周期正确、ComM FullCom了、CanSM Controller STARTED了，如果 CanNm PDU Ref 或 CanIf HTH/HRH/Range/DLC 错了，NM 仍然可能收发不通。\u003c/div>\n\u003ch3 id=\"7-6-功能开关\">7.6 功能开关\u003c/h3>\n\u003cdiv class=\"param-grid canNm-switch-grid\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_PASSIVE_MODE_ENABLED / CanNmPassiveModeEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>节点只被动参与 NM，通常不主动发 NM。\n\u003cstrong>关闭: \u003c/strong>节点可以主动请求网络并发送 NM。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_COM_CONTROL_ENABLED / CanNmComControlEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>允许通过 Nm/ComM 控制 NM 通信使能。\n\u003cstrong>关闭: \u003c/strong>无法通过标准路径动态 Disable/Enable NM 通信。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>支持 Get/Set NM UserData API。\n\u003cstrong>关闭: \u003c/strong>不能使用 NM UserData API。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>NM UserData 来自 COM I-PDU / 信号路径。\n\u003cstrong>关闭: \u003c/strong>UserData 不走 COM 信号承载。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_BUS_LOAD_REDUCTION_ENABLED / CanNmBusLoadReductionEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>可用 MsgReducedTime 降低 NM 发送频率。\n\u003cstrong>关闭: \u003c/strong>MsgReducedTime 即使配置也不生效。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_REMOTE_SLEEP_IND_ENABLED / CanNmRemoteSleepIndEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>能通知远端节点都准备睡眠。\n\u003cstrong>关闭: \u003c/strong>不产生 RemoteSleep indication。\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_PN_SUPPORTED / CanNmPnSupported(EB)；PnEnabled / CanNmPnEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>启用 PN 信息过滤、EIRA/ERA、PN 唤醒相关行为。\n\u003cstrong>关闭: \u003c/strong>PNC disabled，PN offset/length/mask 不生效。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CanNmCarWakeUpRxEnabled / CanNmCarWakeUpRxEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开:\u003c/strong>\n    解析 NM PDU 的 Car WakeUp bit 并上报。\n\u003cstrong>关闭:\u003c/strong>\n    不解析 Car WakeUp。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\n\u003ch2 class=\"major-break\" id=\"8-Nm-配置项\">8. Nm 配置项\u003c/h2>\n\u003cdiv class=\"chapter-dense-intro\">\u003cdiv class=\"compact-card wide\">\u003cdiv class=\"card-title\">第 8 章核心定位\u003c/div>\u003cp>Nm 是统一门面。即使系统里只有 CanNm，通常也会配置 Nm，因为上层不应该直接绑死某一种 BusNm。\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM / App  -&gt; Nm API  -&gt; CanNm\u003c/code>\u003c/pre>\u003cp>如果以后换成 FrNm、UdpNm，或者一个 ECU 有多种 NM，总体接口仍然可以通过 Nm 抽象。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"chapter-scan-note\">速查方式：先确认 Nm 通道是否正确桥接 ComM 和 CanNm；再看 UserData、StateChange、RemoteSleep、Coordinator 等开关是否按项目需要启用。\u003c/div>\n\u003cdiv class=\"chapter-dense-grid chapter-8-grid\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-1-Nm-在链路里的位置\">8.1 Nm 桥接关系\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>ComM Channel ESC_M\n    -&gt; Nm Channel ChassisCan1NmCluster\n        -&gt; CanNm Channel CanNmChannelConfig_0\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>NmComMChannelRef -&gt; ComM Channel\u003c/strong>：\u003cbr>Nm 通道必须桥接到正确 ComM Channel，例如 ESC_M。\n\u003cstrong>NmStandardBusType = NM_BUSNM_CANNM\u003c/strong>：该 Nm 通道下接 CanNm。\u003cbr>\u003c/code>\u003c/pre>\u003cp>\u003cstrong>Nm 的核心职责：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. 给 ComM 提供统一 NM API。\n2. 把 Nm_NetworkRequest / Nm_NetworkRelease 转发给 CanNm。\n3. 把 CanNm 的状态变化回调给上层。\n4. 统一处理 UserData、RemoteSleep、Coordinator 等抽象能力。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-2-NmStandardBusType-Standard-Bus-Type-EB\">8.2 StandardBusType / NmStandardBusType(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>NM_BUSNM_CANNM\n\u003cstrong>含义: \u003c/strong>这个 Nm 通道下接的是 CanNm。\u003cbr>\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM 调 Nm_NetworkRequest()\n    -&gt; Nm 根据 BusNm 类型转发\n        -&gt; CanNm_NetworkRequest()\u003c/code>\u003c/pre>\u003cp>\u003cstrong>如果配错：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM 请求网络，但 Nm 转不到正确 BusNm。\n表现可能是 ComM 状态看似变化，但 CanNm 不发 NM。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-3-NmComMChannelRef-ComM-channel-reference-EB\">8.3 ComMChannelRef / NmComMChannelRef(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>ESC_M\n\u003cstrong>含义: \u003c/strong>Nm 通道绑定到 ComM 的 ESC_M 通道。\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">引用: \u003c/span>\u003c/code>ComM ESC_M   -&gt; Nm ESC_M  -&gt; CanNm\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">如果配错:\u003c/span>\u003c/code>ComM 的 FullCom 请求和 Nm/CanNm 不在同一条逻辑链路上。\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>可能出现 CanSM Controller 已经 STARTED，但 CanNm 不按预期请求网络。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-4-NmComControlEnabled-Communication-Control-Enabled-EB\">8.4 NM_COM_CONTROL_ENABLED / NmComControlEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>true\n\u003cstrong>含义:  \u003c/strong>允许通过 Nm/ComM 控制 NM 通信使能。\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">打开:  \u003c/span>\u003c/code>ComM / Nm 可以走标准接口控制 NM 通信行为。\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">关闭:  \u003c/span>\u003c/code>标准路径下动态控制 NM 通信能力受限。\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">排查点:\u003c/span>\u003c/code>客户说“ComM 已经请求 FullCom，但 NM 通信控制不起作用”，要看 NM_COM_CONTROL_ENABLED / NmComControlEnabled(EB) 和 CANNM_COM_CONTROL_ENABLED / CanNmComControlEnabled(EB) 是否一致。\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-5-NmUserDataEnabled-User-Data-Enabled-EB\">8.5 NM_USER_DATA_ENABLED / NmUserDataEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>true\n\u003cstrong>含义: \u003c/strong>Nm API 层开放 UserData 能力。\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">注意:\u003c/span>\u003c/code>NM_USER_DATA_ENABLED / NmUserDataEnabled(EB) = true 只是 Nm 抽象层允许 UserData。\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB) 也要打开，CanNm 层才真正支持。\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">还要区分两条路线:\u003c/span>\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>API 路线:  \u003c/strong>Nm / CanNm UserData API 设置用户数据。\n\u003cstrong>COM 信号路线: \u003c/strong>COM I-PDU / Signal 填 NM UserData。\u003cbr>需要 CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB) = true。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-6-NmStateChangeIndEnabled-State-Change-Indication-Enabled-EB\">8.6 NM_STATE_CHANGE_IND_ENABLED / NmStateChangeIndEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>true\n\u003cstrong>含义: \u003c/strong>Nm 状态变化可以通知上层。\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">排查: \u003c/span>\u003c/code>客户说“上层收不到 NM 状态变化”，不要只看 CanNm。\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>要同时查：\u003cbr>\u003c/strong>    NM_STATE_CHANGE_IND_ENABLED / NmStateChangeIndEnabled(EB)\n    CANNM_STATE_CHANGE_IND_ENABLED / CanNmStateChangeIndEnabled(EB)\n    BswM / RTE 回调配置\n    上层 callback 是否生成\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-7-NmCoordinatorSupportEnabled-Coordinator-Support-Enabled-EB\">8.7 NM_COORDINATOR_SUPPORT_ENABLED / NmCoordinatorSupportEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>false\n\u003cstrong>含义:  \u003c/strong>当前不是 NM Coordinator，不做多网络协调睡眠。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>打开后影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>多个网络之间可能需要协调进入睡眠。\nCBV 里的 Coordinator Sleep Ready 位才有实际意义。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>当前项目理解：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>DF_XY 当前不做 NM Coordinator。\n所以不要把 CBV bit3 当成本项目睡眠主逻辑。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-8-NmRemoteSleepIndEnabled-Remote-Sleep-Indication-Enabled-EB\">8.8 NM_REMOTE_SLEEP_IND_ENABLED / NmRemoteSleepIndEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>false\n\u003cstrong>含义:  \u003c/strong>当前不处理远程睡眠指示。\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">打开时: \u003c/span>\u003c/code>Nm/CanNm 可以上报远端节点都准备睡眠的语义。\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">关闭时: \u003c/span>\u003c/code>不会产生 RemoteSleep indication。\u003c/pre>\u003cpre class=\"dense-pre\" style=\"background: rgb(232, 237, 248); outline: rgba(79, 136, 216, 0.35) dashed 1px; cursor: text;\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">排查: \u003c/span>\u003c/code>\u003cstrong style=\"background-color: initial; font-size: inherit;\">客户说“为什么没有远端睡眠通知”，要查：\u003c/strong>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>    NM_REMOTE_SLEEP_IND_ENABLED / NmRemoteSleepIndEnabled(EB)\n    CANNM_REMOTE_SLEEP_IND_ENABLED / CanNmRemoteSleepIndEnabled(EB)\n    对端 NM 行为\n    BswM/RTE 回调\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"8-9-Nm-常用-API-按方向理解\">8.9 Nm 常用 API 按方向理解&nbsp;\u003cspan style=\"background-color: rgb(251, 252, 255); color: rgb(26, 28, 46); font-size: 10pt;\">Nm 的接口按方向分三类：上层主动调用、BusNm 状态上报、查询/数据类接口。\u003c/span>\u003c/div>\u003cp>\u003cspan style=\"font-size: 10pt;\">\u003cb>上层主动调用：\u003c/b>\u003c/span>\u003c/p>\u003cpre class=\"dense-pre\">\u003cb>Nm_NetworkRequest(Channel)\u003c/b>\n    上层请求网络。 通常由 ComM 在 FullCom Network Requested 时调用。 Nm 再转发到 CanNm_NetworkRequest。\n\u003cb>Nm_NetworkRelease(Channel)\u003c/b>\n    上层释放网络。 通常由 ComM 在没有用户保持通信时调用。 Nm 再转发到 CanNm_NetworkRelease。\n\u003cb>Nm_PassiveStartUp(Channel)\u003c/b>\n    被动启动网络管理。 常用于检测到网络活动后，让 NM 进入网络相关状态，但不一定代表本节点主动请求网络。\u003ccode>\u003c/code>\u003c/pre>\u003cp>\u003cstrong>通信控制类：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cb>Nm_EnableCommunication(Channel)\u003c/b>\u003cbr>    关闭指定 NM Channel 的 NM PDU 发送能力。停止该通道继续发送 NM 报文。只控制NM报文\u003cbr>\u003cb>Nm_DisableCommunication(Channel)\u003c/b>\u003cbr>    恢复指定 NM Channel 的 NM PDU 发送能力。允许该通道重新发送 NM 报文。\u003c/code>只控制NM报文\u003cbr>\u003cb>注意：\u003c/b>是否可用要看 NM_COM_CONTROL_ENABLED / NmComControlEnabled(EB) 和 CANNM_COM_CONTROL_ENABLED / CanNmComControlEnabled(EB)。 如果配置关闭，接口可能不可用或不起预期作用。\u003c/pre>\u003cp>\u003cstrong>UserData 类：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cb>Nm_SetUserData(Channel, data)/ Nm_GetUserData(Channel, data)/ Nm_GetPduData(Channel, data)\u003c/b>\u003cbr>\u003cb>含义：\u003c/b>\u003c/code>设置或读取 NM UserData / NM PDU 数据。\u003cbr>是否可用要看 NM_USER_DATA_ENABLED / NmUserDataEnabled(EB)、CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB)。\u003cbr>如果希望 UserData 由 COM 信号填，还要看 CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB)。\u003c/pre>\u003cp>\u003cstrong>状态查询类：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>\u003cb>Nm_GetState(Channel, &amp;state, &amp;mode)\u003cbr>Nm_GetBusSynchronizationStatus(Channel, &amp;status)\nNm_CheckRemoteSleepIndication(Channel, &amp;status)\u003c/b>\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cfont color=\"#10235a\">\u003cb>含义： \u003c/b>\u003c/font>\u003c/code>用于确认 NM 当前状态、同步状态、远端睡眠指示。是否有完整能力取决于对应开关和供应商实现。\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-10-Nm-CanNm-ComM-的调用方向\">8.10 Nm / CanNm / ComM 的调用方向\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cb>请求网络方向：\u003c/b>App / DCM / BswM\n    -&gt; ComM_RequestComMode(...) -&gt; ComM 决策是否 FullCom\n          -&gt; Nm_NetworkRequest()\n              -&gt; CanNm_NetworkRequest()\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cspan style=\"font-weight: 800; color: rgb(16, 35, 90);\">释放网络方向：\u003cbr>\u003c/span>\u003c/code>所有 ComM User释放/DCM InactiveDiagnostic/没有PNC和BswM保持\u003cbr>     -&gt; ComM 判断可释放\u003cbr>         -&gt; Nm_NetworkRelease()\u003cbr>             -&gt; CanNm_NetworkRelease()\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cfont color=\"#10235a\">\u003cb>状态上报方向：\u003cbr>\u003c/b>\u003c/font>\u003c/code>CanNm 状态变化 -&gt; Nm 抽象层 -&gt; ComM/ BswM/ RTE/ 应用回调\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cfont color=\"#10235a\">\u003cb>常见上报语义：\u003cbr>\u003c/b>\u003c/font>\u003c/code>Network Start Indication  = 睡眠中收到 NM，网络被别人拉起\nNetwork Mode              = NM 已进入网络模式；\nPrepare Bus Sleep Mode    = 正在准备睡眠；\nBus Sleep Mode            = 已进入最终睡眠模式；\nRemote Sleep Indication   = 其它节点都准备睡；\nRemote Sleep Cancellation = 其它节点准备睡的状态被取消；\nState Change Notification = 底层 NM 状态变化明细上报。\u003cbr>\u003cb>注意：\u003c/b>\u003cspan style=\"background-color: initial; font-size: inherit;\">CanNm 状态变化先到 Nm，再通知 ComM/BswM/RTE。\u003c/span>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-13-Nm-章节注意事项\">8.13 Nm 章节注意事项\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>1. Nm 是抽象层，不是 CanIf。\n   CAN ID、HRH、HTH 不在 Nm 配。\n2. Nm 是抽象层，不是 CanSM。\n   Controller Start/Stop/Sleep 不在 Nm 配。\n3. Nm 是抽象层，不是 ComM。\n   是否允许 FullCom、是否被 NoWakeup/NoCom 阻塞，由 ComM 决策。\n4. Nm 配错 Ref，会让 ComM、CanNm 不在一条链路上。\n   表现可能像 CanNm 不工作，但根因是绑定错。\n5. 只打开 NM_USER_DATA_ENABLED / NmUserDataEnabled(EB) 不够。\n   CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB)、CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB) 路线也要确认。\n6. 只打开 NM_STATE_CHANGE_IND_ENABLED / NmStateChangeIndEnabled(EB) 不够。\n   CanNm 状态通知、BswM/RTE callback 也要确认。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"8-11-Nm-配置和生成代码重点\">8.11 Nm 配置和生成代码重点\u003c/div>\u003cp>\u003cstrong>配置位置：&nbsp;\u003c/strong>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">Nm -&gt; NmConf_NmChannelConfig_ChassisCan1NmCluster / NmChannelConfig(EB)\u003c/span>\u003c/p>\u003cp>\u003cstrong>当前关键配置：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>StandardBusType / NmStandardBusType(EB)                     = NM_BUSNM_CANNM\nComMChannelRef / NmComMChannelRef(EB)                 = ESC_M\nNM_COM_CONTROL_ENABLED / NmComControlEnabled(EB)       = true\nNM_USER_DATA_ENABLED / NmUserDataEnabled(EB)                     = true\nNM_STATE_CHANGE_IND_ENABLED / NmStateChangeIndEnabled(EB) = true\nNM_COORDINATOR_SUPPORT_ENABLED / NmCoordinatorSupportEnabled(EB) = false\nNM_REMOTE_SLEEP_IND_ENABLED / NmRemoteSleepIndEnabled(EB) = false\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"8-12-Nm-常见故障定位\">8.12 Nm 常见故障定位\u003c/div>\u003cp>\u003cstrong>ComM 请求了，但 CanNm 不发 NM：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. ComMChannelRef / NmComMChannelRef(EB) 是否指向 ESC_M。\n2. StandardBusType / NmStandardBusType(EB) 是否为 NM_BUSNM_CANNM。\n3. Nm 是否真的转发到 CanNm。\n4. CanNm 通道是否与同一个 ComM Channel 对齐。\n5. CanSM Controller 是否已经 STARTED。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>上层收不到 NM 状态变化：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. NM_STATE_CHANGE_IND_ENABLED / NmStateChangeIndEnabled(EB) 是否 true。\n2. CANNM_STATE_CHANGE_IND_ENABLED / CanNmStateChangeIndEnabled(EB) 是否 true。\n3. BswM / RTE callback 是否配置。\n4. 上层是否注册或生成了对应回调。\n5. CanNm 状态是否真的发生变化。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>UserData 设置/读取不生效：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. NM_USER_DATA_ENABLED / NmUserDataEnabled(EB) 是否 true。\n2. CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB) 是否 true。\n3. 是否误以为 CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB)=true。\n4. 当前 DF_XY CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB)=false，所以不是 COM 信号自动填。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>RemoteSleep 没有通知：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. NM_REMOTE_SLEEP_IND_ENABLED / NmRemoteSleepIndEnabled(EB) 是否 true。\n2. CANNM_REMOTE_SLEEP_IND_ENABLED / CanNmRemoteSleepIndEnabled(EB) 是否 true。\n3. 对端节点是否真的进入远端睡眠条件。\n4. BswM/RTE 是否配置接收该通知。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>Coordinator 行为没有出现：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>1. NM_COORDINATOR_SUPPORT_ENABLED / NmCoordinatorSupportEnabled(EB) 当前是 false。\n2. 当前项目不要按 Coordinator 逻辑解释睡眠。\n3. CBV 的 Coordinator Sleep Ready 位当前通常不是主线逻辑。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-14-Nm-客户话术翻译\">8.14 Nm 客户话术翻译\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>“ComM 请求了，但 NM 没反应”\n    查 ComMChannelRef / NmComMChannelRef(EB)、StandardBusType / NmStandardBusType(EB)、CanNm channel ref、CanSM Started。\n“上层收不到 NM 状态变化”\n    查 NM_STATE_CHANGE_IND_ENABLED / NmStateChangeIndEnabled(EB)、CANNM_STATE_CHANGE_IND_ENABLED / CanNmStateChangeIndEnabled(EB)、BswM/RTE 回调。\n“为什么没有 RemoteSleep”\n    查 NM_REMOTE_SLEEP_IND_ENABLED / NmRemoteSleepIndEnabled(EB)、CANNM_REMOTE_SLEEP_IND_ENABLED / CanNmRemoteSleepIndEnabled(EB)、对端状态。\n“UserData API 不生效”\n    查 NM_USER_DATA_ENABLED / NmUserDataEnabled(EB)、CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB)、CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB)。\n“这个项目是不是 Coordinator”\n    查 NM_COORDINATOR_SUPPORT_ENABLED / NmCoordinatorSupportEnabled(EB)。当前 DF_XY = false。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"8-15-Nm-章节口诀\">8.15 Nm 章节口诀\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>Nm 不决定 Controller 是否 Start。\nNm 不直接配置 CAN ID。\nNm 是 ComM 和 CanNm 中间的统一 API 门面。\n\u003cstrong>ComM 要网络:\u003c/strong>\n    ComM -&gt; Nm_NetworkRequest -&gt; CanNm_NetworkRequest\n\u003cstrong>ComM 释放网络:\u003c/strong>\n    ComM -&gt; Nm_NetworkRelease -&gt; CanNm_NetworkRelease\n\u003cstrong>CanNm 状态变化:\u003c/strong>\n    CanNm -&gt; Nm callback -&gt; ComM / BswM / RTE\u003c/code>\u003c/pre>\u003c/div>\n\u003c/div>\n\u003c/main>\u003c/div>\u003c/body>\u003c/html>\n","notes/08/8.4.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>8.4 · Wakeup、PNC 与 Partial Networking Filter\u003c/title>\u003cstyle>\n\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--navy:#1b2340;--accent:#4f88d8}\nbody{color:#1a1c2e;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n#wrap{margin:auto}#main{background:white;box-shadow:0 1px 6px #0000001a}\n#main h1{border-bottom:2px solid #1b2340;padding-bottom:10px;margin-bottom:14px;color:#0d1530}\n#main h2{color:#152060;border-bottom:1.5px solid #3a6ab8;padding-bottom:5px}\n#main h3{color:#1a346a;padding-left:9px;border-left:3px solid var(--accent)}\n#main h4{color:#253872}#main ul,#main ol{padding-left:22px}\n#main hr{border:0;border-top:1px solid #dde2ee;margin:10px 0}\n#main pre{background:#f2f4f8;border-left:3px solid #9aadd0;border-radius:0 4px 4px 0;margin:8px 0;overflow-wrap:anywhere}\n#main pre,#main code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}\n#main code{background:#e6ecf7;padding:0 3px;border-radius:2px;overflow-wrap:anywhere}\n#main pre code{background:none;padding:0;font-size:inherit}\n#main blockquote{border-left:3px solid #aab8d8;padding:8px 12px;background:#f5f7fc;color:#555}\n#main table{width:100%;border-collapse:collapse;table-layout:fixed}\n#main th,#main td{border:1px solid #d9e1f2;vertical-align:top;overflow-wrap:anywhere}\n#main th{background:#eaf0fb;color:#1a346a}#main tr:nth-child(even) td{background:#fbfcff}\n#main .key-cell{font-weight:700;color:#10235a}\n#main .keybox,#main .dense-note,#main .chapter-scan-note{border-left:3px solid #4f88d8;background:#f5f8ff;padding:10px 12px;m e-table td { padding: 1.8px 3px; }\n\n  #main .nm-state-svg { margin: 1pt 0; }\n\n  #main .nm-state-table { font-size: 6.45pt; line-height: 1.04; margin: .8pt 0; }\n\n  #main .nm-state-table th, #main .nm-state-table td { padding: .8px 1.5px; }\n\n:root{--bar-h:0px}\nbody{font-size:15px;line-height:1.6;background:#edf1f6}\n#wrap{max-width:960px;padding:18px 14px 32px}\n#main{padding:20px 18px;border-radius:12px;overflow-wrap:anywhere}\n#main h1{font-size:23px;line-height:1.35;text-align:left}\n#main h2{font-size:20px;line-height:1.4;margin:24px 0 12px}\n#main h3{font-size:17px;line-height:1.4;margin:18px 0 8px}\n#main h4{font-size:15px}\n#main p,#main li{font-size:15px;line-height:1.65;margin:7px 0}\n#main code{font-size:13px}\n#main pre,#main pre.dense-pre{font-size:13px;line-height:1.55;padding:10px;white-space:pre-wrap}\n#main .param-card pre,#main .flow-card pre,#main .compact-card pre{font-size:13px;line-height:1.55}\n#main table{font-size:13px;line-height:1.55;margin:12px 0}\n#main th,#main td{padding:8px 7px}\n#main .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}\n#main .table-scroll>table{min-width:620px}\n#main .param-title,#main .flow-title,#main .card-title{font-size:15px;line-height:1.5;padding:8px}\n#main .chapter-dense-grid .param-card table,#main .chapter-quickref table{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card pre,#main .chapter-quickref pre{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card h4{font-size:15px}\n#main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{gap:12px}\n#main .nm-state-svg{min-width:800px}\n#main .figure-scroll{overflow-x:auto}\n#main .lesson-toc{padding:12px 16px;background:#f3f6fc;border-radius:8px}\n#main .lesson-toc a{display:block;padding:6px 0;color:#27558a}\n#main .source-note{font-size:13px;color:#52627c;background:#f3f6fc;padding:12px;border-left:3px solid #4f88d8}\n@media(max-width:600px){\n #main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{grid-template-columns:1fr}\n #main{padding:18px 14px}#wrap{padding:12px 8px 24px}\n #main .table-scroll:before{content:'左右滑动查看表格';display:block;font-size:12px;color:#65708a;margin-top:8px}\n #main .figure-scroll:before{content:'左右滑动查看完整状态图';display:block;font-size:12px;color:#65708a;margin-top:8px}\n}\n@media print{\n body{font-size:10pt;background:white}#wrap,#main{padding:0}\n #main .lesson-toc{display:none}#main .table-scroll,#main .figure-scroll{overflow:visible}\n #main .table-scroll>table,#main .nm-state-svg{min-width:0}\n #main h2.major-break{break-before:auto!important;page-break-before:auto!important}\n #main table,#main p,#main li{font-size:9pt}#main pre,#main code{font-size:8pt}\n}\n\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"wrap\">\u003cmain id=\"main\">\n\u003ch1>8.4 · Wakeup、PNC 与 Partial Networking Filter\u003c/h1>\n\u003cp class=\"source-note\">整理自 NM 配置打印版笔记。DF_XY、ESC_M / ESC_S、参数数值及开关状态均为原笔记中的项目示例，请结合实际项目核对。本笔记覆盖本课相关内容，不代表完整课程教案。\u003c/p>\n\u003cnav class=\"lesson-toc\" aria-label=\"本课目录\">\u003ca href=\"#附录-A-PNC-专题-原理与配置端到端\">附录 B：唤醒专题：原理、配置与排查\u003c/a>\u003ca href=\"#pn-config\">PN / PNC 配置与开关联动\u003c/a>\u003c/nav>\n\u003ch2 class=\"appendix-title major-break\" id=\"附录-A-PNC-专题-原理与配置端到端\">\u003cspan style=\"font-size: 12pt;\">附录 B：唤醒专题：原理、配置与排查\u003c/span>\u003c/h2>\n\u003cdiv class=\"keybox\">\u003cspan class=\"tag\">当前项目提醒\u003c/span>当前 \u003ccode>CanNmCarWakeUpRxEnabled = false\u003c/code>，\u003ccode>NmCarWakeUpRxEnabled = false\u003c/code>，所以当前不解析 NM PDU 的 CarWakeUp bit，也不会形成 CarWakeUp 上报链。下面保留唤醒原理和配置方法，方便后续学习。\u003c/div>\n\u003ch3 id=\"B-1-先分清四种-唤醒\">B.1 先分清四种“唤醒”\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 17.487%;\">\u003ccol style=\"width: 33.808%;\">\u003ccol style=\"width: 23.705%;\">\u003ccol style=\"width: 25%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>含义\u003c/th>\u003cth>主查模块\u003c/th>\u003cth>典型误区\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>物理唤醒\u003c/td>\u003ctd>ECU 从低功耗被总线/引脚/Transceiver 唤醒。\u003c/td>\u003ctd class=\"key-cell\">EcuM、CanTrcv、MCU Wake Source、CanIf Wakeup\u003c/td>\u003ctd>软件 DCM/ComM/CanNm 通常挡不住第一次物理唤醒。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>逻辑通信唤醒\u003c/td>\u003ctd>系统已经醒来后，请求某通信通道进入 FullCom。\u003c/td>\u003ctd class=\"key-cell\">ComM、BswM、CanSM\u003c/td>\u003ctd>这不是硬件唤醒，而是通信模式请求。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>NM Active Wakeup\u003c/td>\u003ctd>NM CBV 里的 Active Wakeup bit，表示本节点主动唤醒网络。\u003c/td>\u003ctd class=\"key-cell\">CanNm CBV / ActiveWakeup 配置\u003c/td>\u003ctd>不要和 CarWakeUp bit 混为一谈。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CarWakeUp\u003c/td>\u003ctd>NM PDU 里客户定义的 Car WakeUp 语义 bit，被 CanNm/Nm 解析后上报。\u003c/td>\u003ctd class=\"key-cell\">CanNm、Nm、BswM/EcuM\u003c/td>\u003ctd>当前 DF_XY 关闭，byte/bit 有值也不触发语义。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Selective Wake / PN Wake\u003c/td>\u003ctd>Transceiver/Controller 根据特定 ID/Pattern/PN 决定是否唤醒。\u003c/td>\u003ctd>CanTrcv、CanIf、CanSM、EcuM、PNC\u003c/td>\u003ctd>它可以和 PNC 联动，但不是普通 PNC 配置本身。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"B-2-ComM-逻辑通信唤醒链路\">B.2 ComM 逻辑通信唤醒链路\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>App / DCM / BswM 请求通信\u003c/strong>\n    -&gt; ComM_RequestComMode(User, COMM_FULL_COMMUNICATION)\n        -&gt; ComM 检查 NoCom / NoWakeup / CommunicationAllowed / Inhibition\n            -&gt; CanSM_RequestComMode(Network, FULL)\n                -&gt; CanIf / CanDrv / CanTrcv 拉起 Controller / Transceiver\n                    -&gt; Nm_NetworkRequest / CanNm_NetworkRequest\n                        -&gt; NM 报文保持网络\u003c/code>\u003c/pre>\n\u003ch3 id=\"B-3-硬件唤醒链路\">B.3 硬件唤醒链路\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>总线活动 / Wake Pattern / Transceiver Wake\u003c/strong>\n    -&gt; CanTrcv / CAN Controller / MCU Wake Source\n        -&gt; EcuM_CheckWakeup / EcuM_SetWakeupEvent\n            -&gt; BswM / EcuM 唤醒处理\n                -&gt; ComM_CommunicationAllowed / ComM_RequestComMode\n                    -&gt; CanSM 拉起 Controller\u003c/code>\u003c/pre>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 22.97%;\">\u003ccol style=\"width: 32.815%;\">\u003ccol style=\"width: 44.215%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>配置点\u003c/th>\u003cth>作用\u003c/th>\u003cth>排查\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"key-cell\">EcuM Wake Source\u003c/td>\u003ctd>定义哪些硬件源可以唤醒 ECU。\u003c/td>\u003ctd>物理能醒但软件无反应，查 EcuM wake source / validation。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CanTrcv Wakeup / Selective Wake\u003c/td>\u003ctd>Transceiver 层的唤醒/选择性唤醒能力。\u003c/td>\u003ctd>只有特定 ID/Pattern 能唤醒时重点查这里。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">CanIf Wakeup Support\u003c/td>\u003ctd class=\"key-cell\">CanIf 向上报告 Controller/Transceiver wakeup。\u003c/td>\u003ctd>底层有 wake，但上层不知道时查 CanIf/EcuM 回调。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">BswM wake rules\u003c/td>\u003ctd>唤醒后决定是否允许通信、是否请求 FullCom。\u003c/td>\u003ctd>物理醒了但 CAN 不通信，查 BswM/ComM 逻辑。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"B-4-CarWakeUp-配置链路\">B.4 CarWakeUp 配置链路\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 14.939%;\">\u003ccol style=\"width: 42.53%;\">\u003ccol style=\"width: 42.531%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>模块\u003c/th>\u003cth>关键配置\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"key-cell\">CanNm\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmCarWakeUpRxEnabled\u003c/code>、CarWakeUp Byte/Bit\u003c/td>\u003ctd>决定是否解析收到 NM PDU 里的 CarWakeUp bit。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">Nm\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>NmCarWakeUpRxEnabled\u003c/code>\u003c/td>\u003ctd>决定 Nm 抽象层是否接收/上报 CarWakeUp 语义。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">BswM/EcuM\u003c/td>\u003ctd>CarWakeUp 相关 rule / wake source\u003c/td>\u003ctd>决定收到 CarWakeUp 后系统行为。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">CanIf\u003c/td>\u003ctd>Rx PDU / HRH / Range / DLC\u003c/td>\u003ctd>NM PDU 必须先能被 CanIf 收到并上送 CanNm。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"B-5-Active-Wakeup-Bit-不是-CarWakeUp\">B.5 Active Wakeup Bit 不是 CarWakeUp\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 11.83%;\">\u003ccol style=\"width: 35.535%;\">\u003ccol style=\"width: 52.635%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>Active Wakeup\u003c/th>\u003cth>CarWakeUp\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>位置\u003c/td>\u003ctd>通常在 CBV bit4\u003c/td>\u003ctd>客户定义的 NM PDU byte/bit\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>语义\u003c/td>\u003ctd>本节点主动唤醒网络的标识\u003c/td>\u003ctd>车辆唤醒/整车唤醒语义\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>主配置\u003c/td>\u003ctd class=\"key-cell\">CanNm ActiveWakeup 相关配置\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmCarWakeUpRxEnabled\u003c/code> / \u003ccode>NmCarWakeUpRxEnabled\u003c/code>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>当前 DF_XY\u003c/td>\u003ctd>看 CBV/CanNm 配置是否使用\u003c/td>\u003ctd>关闭，不解析\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"B-6-唤醒问题排查口诀\">B.6 唤醒问题排查口诀\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>先问“有没有物理醒”：\u003c/strong>\n    没醒 -&gt; 查 CanTrcv / Wake Source / Selective Wake / 供电。\n\u003cstrong>再问“醒了有没有允许通信”：\u003c/strong>\n    醒了但不通信 -&gt; 查 EcuM / BswM / ComM_CommunicationAllowed / ComM_RequestComMode。\n\u003cstrong>再问“Controller 有没有起来”：\u003c/strong>\n    ComM 请求了但 Controller 不起 -&gt; 查 CanSM / CanIf / CanDrv / mode indication。\n\u003cstrong>最后问“NM 有没有保持网络”：\u003c/strong>\n    Controller 起了但网络不保持 -&gt; 查 Nm / CanNm / NM PDU / PNC / CarWakeUp。\u003c/code>\u003c/pre>\u003ch2 id=\"pn-config\">PN / PNC 配置与开关联动\u003c/h2>\u003cdiv class=\"chapter-dense-grid\">\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CANNM_PN_SUPPORTED / CanNmPnSupported(EB)；PnEnabled / CanNmPnEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开: \u003c/strong>启用 PN 信息过滤、EIRA/ERA、PN 唤醒相关行为。\n\u003cstrong>关闭: \u003c/strong>PNC disabled，PN offset/length/mask 不生效。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\">CanNmCarWakeUpRxEnabled / CanNmCarWakeUpRxEnabled(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>打开:\u003c/strong>\n    解析 NM PDU 的 Car WakeUp bit 并上报。\n\u003cstrong>关闭:\u003c/strong>\n    不解析 Car WakeUp。\u003cbr>\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-6-ComMSynchronousWakeUp-Synchronous-Wake-Up-EB\">9.6 COMM_SYNCHRONOUS_WAKE_UP / ComMSynchronousWakeUp(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前: \u003c/strong>true\n\u003cstrong>含义: \u003c/strong>同步唤醒相关通道。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>多COMM通道项目中，一个通道唤醒可能带动相关通道一起进入通信准备\u003c/code>\u003c/pre>\u003cp>\u003cstrong>注意：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>客户说“为什么这个通道被一起带起来”，要查 SynchronousWakeUp、PNC、BswM rules、Channel mapping。\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-9-ComMNoWakeup-No-Wakeup-EB\">9.9 NoWakeup / ComMNoWakeup(EB)\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>false\n\u003cstrong>含义:  \u003c/strong>如果 true，禁止通过该通道唤醒通信。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>影响：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>请求 FullCom 不一定能把通道从低功耗拉起来。\u003c/code>\u003c/pre>\u003cp>\u003cstrong>相关接口：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>ComM_PreventWakeUp(Channel, TRUE/FALSE)\u003cbr>\u003cbr>\nComM_GetInhibitionStatus(Channel, &amp;status)\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"9-10-Mode-Limitation-和-Wakeup-Inhibition\">9.10 Mode Limitation 和 Wakeup Inhibition\u003c/div>\u003cpre class=\"dense-pre\">\u003cspan style=\"color: rgb(21, 32, 96); font-family: DengXian, 等线, &quot;Microsoft YaHei UI&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, system-ui, sans-serif; font-size: 11.9333px; white-space: normal; background-color: rgb(237, 243, 252);\">\u003cb>Mode Limitation：\u003c/b>\u003c/span>\u003cstrong style=\"background-color: initial;\">\u003cfont color=\"#1a1c2e\" face=\"DengXian, 等线, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, Source Han Sans SC, system-ui, sans-serif\">\u003cspan style=\"font-size: 13.3333px;\">\u003cbr>\u003c/span>\u003c/font>作用:  \u003c/strong>\u003cspan style=\"background-color: initial; font-size: inherit;\">允许运行时限制某通道或整个 ECU 到 NoCom。\u003c/span>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>接口:\u003c/strong>\n    ComM_LimitChannelToNoComMode(Channel, TRUE/FALSE)\n    ComM_LimitECUToNoComMode(TRUE/FALSE)\u003cbr>\u003cspan style=\"font-weight: 800; text-wrap-mode: wrap;\">\u003cfont color=\"#152060\" face=\"DengXian, 等线, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, Source Han Sans SC, system-ui, sans-serif\">\u003cspan style=\"font-size: 11.9333px; white-space-collapse: collapse; background-color: rgb(237, 243, 252);\">Wakeup Inhibition：\u003cbr>\u003c/span>\u003c/font>\u003c/span>\u003c/code>\u003cstrong style=\"background-color: initial; font-size: inherit;\">作用:  \u003c/strong>\u003cspan style=\"background-color: initial; font-size: inherit;\">允许运行时阻止某通道唤醒。\u003cbr>\u003c/span>\u003cspan style=\"background-color: initial; font-size: inherit;\">\u003cb>接口:\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>\u003c/span>\u003cfont color=\"#10235a\">\u003cb>     \u003c/b>\u003c/font>ComM_PreventWakeUp(Channel, TRUE/FALSE)\u003cbr>\u003cb>FullCom 请求失败时，不要只看 CanSM。 \u003c/b>\u003cspan style=\"background-color: initial; font-size: inherit;\">\u003cb>查：\u003c/b>\u003cfont color=\"#10235a\">\u003cb>\u003cbr>\u003c/b>\u003c/font>\u003c/span>    User 请求是否存在\u003cbr>    User 是否映射到 Channel\u003cbr>    ComM_CommunicationAllowed和CommunicationAllowed     gate(API) 是否为 TRUE\u003cbr>    NoCom / NoWakeup 是否置位\u003cbr>    PreventWakeUp 是否置位\u003cbr>    LimitChannelToNoCom / LimitECUToNoCom 是否置位\u003cbr>    DCM 是否 ActiveDiagnostic\u003cbr>\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card wide\">\u003cdiv class=\"param-title\" id=\"9-11-ComMPncSupport-Support-for-Partial-Network-Cluster-PNC-EB-ComMPncEnabled-partial-networking-enabled-in-this-configu\">9.11 ComMPncSupport / ComMPncEnabled\u003c/div>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>当前:  \u003c/strong>false / false\n\u003cstrong>含义:  \u003c/strong>当前 ComM 不处理 PNC。\u003cbr>\u003c/code>\u003cb style=\"background-color: initial; font-size: inherit;\">打开后：\u003c/b>\u003cspan style=\"background-color: initial; font-size: inherit;\">ComM 要处理 PNC ID、PNC 与 Channel/User 映射、EIRA/ERA 信号。\u003cbr>\u003c/span>\u003cb>联动模块：\u003c/b>\u003c/pre>\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM:\u003c/strong>\n    COMM_PNC_SUPPORT / ComMPncSupport(EB) \u003cbr>    PncEnabled / ComMPncEnabled(EB)\n    Pnc / ComMPnc(EB)\n    PncId / ComMPncId(EB)\n    PNC-channel-user mapping\n    EIRA / ERA ComSignal\n\u003cstrong>CanNm:\u003c/strong>\n    CANNM_PN_SUPPORTED / CanNmPnSupported(EB)\n    PnEnabled / CanNmPnEnabled(EB)\n    PnInfoOffset / PnInfoLength\n    PnFilterMask\n\u003cstrong>CanIf:\u003c/strong>\n    CANIF_PUBLIC_PN_SUPPORT / CanIfPublicPnSupport(EB)\n\u003cstrong>CanSM:\u003c/strong>\n    CANSM_PNSUPPORT / CanSMPNSupport(EB)\n    CANSM_PARTIALNETWORKING / CanSMActivatePN(EB)\n\u003cstrong>Com / PduR / BswM:\u003c/strong>\n    EIRA / ERA / routing / rules\u003c/code>\u003c/pre>\u003cpre class=\"dense-pre\">\u003cfont color=\"#10235a\">\u003cb>结论：\u003cbr>\u003c/b>\u003c/font>PNC 不是只开 ComM 一个勾。 任何一层没配全，都可能导致 PN 唤醒、PN 保持、PN 释放不符合预期。\u003c/pre>\u003c/div>\n\u003cdiv class=\"param-card\">\u003cdiv class=\"param-title\" id=\"10-7-CanSM-PN-配置\">10.7 CanSM PN 配置\u003c/div>\u003cp>\u003cstrong>当前：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>CANSM_PNSUPPORT / CanSMPNSupport(EB) = false\nCANSM_PARTIALNETWORKING / CanSMActivatePN(EB) = false\u003c/code>\u003c/pre>\u003cp>\u003cstrong>含义：\u003c/strong>\u003cspan style=\"background-color: initial; font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;JetBrains Mono&quot;, &quot;Courier New&quot;, monospace; font-size: inherit; white-space: pre-wrap;\">CanSM 当前不参与 PN 唤醒链路。\u003c/span>\u003c/p>\u003cp>\u003cstrong>如果客户要求 PNC / Selective Wake：\u003c/strong>\u003c/p>\u003cpre class=\"dense-pre\">\u003ccode>不能只打开 CANSM_PARTIALNETWORKING / CanSMActivatePN(EB)\n\u003cstrong>还要同步检查：\u003c/strong>\n    COMM_PNC_SUPPORT / ComMPncSupport(EB) / PncEnabled / ComMPncEnabled(EB)\n    CANNM_PN_SUPPORTED / CanNmPnSupported(EB)；PnEnabled / CanNmPnEnabled(EB)\n    CANIF_PUBLIC_PN_SUPPORT / CanIfPublicPnSupport(EB)\n    Com/PduR EIRA/ERA\n    BswM rules\n    CanTrcv selective wake 能力\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\n\u003c/main>\u003c/div>\u003c/body>\u003c/html>\n","notes/08/8.6.html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>8.6 · Ignition ON/OFF 全链路与典型网络管理故障\u003c/title>\u003cstyle>\n\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--navy:#1b2340;--accent:#4f88d8}\nbody{color:#1a1c2e;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n#wrap{m
