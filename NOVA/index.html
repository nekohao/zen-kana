<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>BSW Learning · AUTOSAR 跳槽学习系统</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#07101d;--bg2:#0b1424;--panel:#111c2f;--panel2:#16243b;--panel3:#0d1728;
  --text:#edf4ff;--muted:#91a3c0;--line:#263b5b;--blue:#78a8ff;--green:#68d39b;
  --i0:#a8b6ca;--i0b:rgba(159,176,199,.22);--i0bg:rgba(133,151,180,.08);
  --i1:#ffd36b;--i1b:rgba(255,196,69,.38);--i1bg:rgba(255,183,38,.10);
  --i2:#ff9a72;--i2b:rgba(255,108,72,.56);--i2bg:rgba(255,82,52,.13);
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#07101d,#0a1424 45%,#07101d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{color:inherit}
.app{min-height:100dvh;padding-bottom:calc(78px + var(--safe-b))}
.view{display:none;max-width:760px;margin:0 auto;padding:calc(12px + var(--safe-t)) 14px 24px}
.view.active{display:block}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 16px}
.top h1{font-size:28px;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.5px}
.top p{margin:5px 0 0;color:var(--muted);font-size:12px}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid #345078;background:linear-gradient(135deg,#1b355b,#13233d);display:grid;place-items:center;font-weight:900;color:#cfe1ff}
.card{background:linear-gradient(145deg,rgba(19,31,52,.97),rgba(12,22,39,.97));border:1px solid var(--line);border-radius:19px;box-shadow:0 16px 38px rgba(0,0,0,.16)}
.hero{padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-95px;background:radial-gradient(circle,rgba(120,168,255,.18),transparent 68%);pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#8eacd7;font-weight:850}
.hero-id{font:900 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#a9c9ff;margin-top:10px}
.hero-title{font-size:22px;line-height:1.25;font-weight:900;margin:5px 0 9px;max-width:90%}
.meta-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.level{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;border:1px solid transparent}
.level.l0{color:var(--i0);border-color:var(--i0b);background:var(--i0bg)}
.level.l1{color:var(--i1);border-color:var(--i1b);background:var(--i1bg);box-shadow:0 0 13px rgba(255,178,37,.05)}
.level.l2{color:var(--i2);border-color:var(--i2b);background:linear-gradient(135deg,rgba(255,83,55,.18),rgba(255,136,73,.08));box-shadow:0 0 17px rgba(255,77,50,.09)}
.soft-pill{border:1px solid #2d466b;color:#a9bad4;background:#101c30;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:750}
.intensity-0{border-color:#24354f}
.intensity-1{border-color:#30435f}
.intensity-2{border-color:rgba(220,166,61,.33);background:linear-gradient(145deg,rgba(34,31,31,.98),rgba(19,24,36,.98))}
.intensity-3{border-color:rgba(255,151,62,.45);background:linear-gradient(145deg,rgba(45,30,27,.98),rgba(19,23,35,.98));box-shadow:0 12px 28px rgba(149,77,26,.08)}
.intensity-4{border-color:rgba(255,102,70,.62);background:linear-gradient(145deg,rgba(52,29,29,.98),rgba(19,22,34,.98));box-shadow:0 14px 34px rgba(198,60,35,.12),inset 3px 0 0 rgba(255,110,77,.68)}
.primary{width:100%;border:1px solid #4b79b5;background:linear-gradient(135deg,#27558a,#1b3f6b);padding:13px 15px;border-radius:13px;font-weight:900;cursor:pointer}
.secondary{width:100%;border:1px solid #334b70;background:#14233a;padding:12px 14px;border-radius:13px;font-weight:800;cursor:pointer}
.primary:active,.secondary:active,.row:active,.chapter-card:active{transform:scale(.99)}
.progress-card{padding:16px;margin:12px 0}
.progress-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:9px}
.progress-num{font-size:28px;font-weight:900}.progress-num small{font-size:13px;color:var(--muted);font-weight:700}
.progress-pct{font-size:13px;color:#a8bcda;font-weight:800}
.track{height:8px;background:#07101d;border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,#78a8ff,#68d39b);border-radius:inherit}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:20px 2px 10px}
.section-head h2{font-size:18px;margin:0}.section-head span{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{padding:13px 14px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}
.row-list,.chapter-list{display:grid;gap:8px}
.row,.chapter-card{width:100%;text-align:left;border:1px solid var(--line);border-radius:15px;background:#101b2e;padding:13px 14px;display:flex;align-items:center;gap:11px;cursor:pointer}
.row-id{font:900 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#a6c8ff;min-width:40px}
.row-main{flex:1;min-width:0}.row-title{display:block;font-weight:820;font-size:14px;line-height:1.35}.row-meta{display:block;color:var(--muted);font-size:10.5px;margin-top:4px}
.go{font-size:23px;color:#7890b3}
.chapter-num{width:38px;height:38px;border-radius:11px;background:#0b1526;border:1px solid #2b4264;display:grid;place-items:center;font:900 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#b4d0fb}
.chapter-main{flex:1}.chapter-title{font-size:14px;font-weight:850;line-height:1.35}.chapter-meta{font-size:10.5px;color:var(--muted);margin-top:4px}.mini-track{height:4px;background:#07101d;border-radius:999px;margin-top:8px;overflow:hidden}.mini-track i{display:block;height:100%;background:#68d39b}
.search{position:relative;margin:8px 0 11px}.search input{width:100%;border:1px solid #2d4569;background:#0c1728;color:#fff;border-radius:14px;padding:12px 13px 12px 39px;outline:none}.search svg{position:absolute;width:17px;height:17px;left:13px;top:50%;transform:translateY(-50%);fill:none;stroke:#7890b4;stroke-width:1.8}
.caption{font-size:10px;color:#8094b3;font-weight:800;margin:7px 2px}
.segment{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:13px}
.segment button{border:1px solid #2c4263;background:#0f1a2d;color:#a9b7cb;border-radius:10px;min-height:38px;font-weight:850;cursor:pointer}
.segment button.active{border-color:#6c91c3;color:#fff;background:#1a3458}
.segment button.lv0.active{border-color:var(--i0b);background:var(--i0bg);color:var(--i0)}
.segment button.lv1.active{border-color:var(--i1b);background:var(--i1bg);color:var(--i1)}
.segment button.lv2.active{border-color:var(--i2b);background:var(--i2bg);color:var(--i2)}
.kp-group{font-size:12px;color:#aac0df;font-weight:850;margin:17px 3px 8px}.kp-list{display:grid;gap:7px}
.kp{display:flex;gap:10px;padding:11px 12px;border:1px solid #263b5a;background:#0f1a2d;border-radius:13px}
.kp input{width:20px;height:20px;accent-color:#68d39b;flex:0 0 auto}.kp-content{flex:1;min-width:0}.kp-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.kp-code{font:850 11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#9fc1f8}.kp-title{font-weight:800;font-size:13px}.kp-desc{display:block;color:#91a3be;font-size:11px;line-height:1.45;margin-top:4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:100;height:calc(66px + var(--safe-b));padding:5px 12px var(--safe-b);background:rgba(8,15,27,.94);backdrop-filter:blur(18px);border-top:1px solid #253650;display:flex;justify-content:center;gap:2px}
.tabbar button{width:min(25%,130px);border:0;background:transparent;color:#7287a8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:760;cursor:pointer}
.tabbar svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}.tabbar button.active{color:#9ec5ff}
.detail,.note-view{position:fixed;inset:0;z-index:160;background:#08111f;transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.85,.2,1);visibility:hidden}
.detail.open,.note-view.open{transform:none;visibility:visible}.no-anim{transition:none!important}
.detail-head{height:calc(54px + var(--safe-t));padding:var(--safe-t) 12px 0;display:flex;align-items:center;border-bottom:1px solid #263851;background:rgba(8,17,31,.96);backdrop-filter:blur(16px)}
.back{border:0;background:transparent;color:#94bfff;font-weight:850;font-size:15px;padding:9px 8px;cursor:pointer}
.detail-title{flex:1;min-width:0;text-align:center;padding-right:48px}.detail-title b{display:block;font-size:13px}.detail-title small{display:block;color:#7f93b1;font-size:9.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-scroll,.note-scroll{height:calc(100dvh - 54px - var(--safe-t));overflow:auto;padding:14px max(14px,env(safe-area-inset-left)) calc(32px + var(--safe-b));max-width:760px;margin:auto}
.point-list{display:grid;gap:7px;margin:11px 0 17px}.point{border:1px solid #293e5e;background:#0e1a2d;border-radius:12px;padding:10px 11px}.point-top{display:flex;gap:8px;align-items:center}.point-code{font:850 11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#9ec3ff}.point-title{font-weight:820;font-size:13px}.point-desc{font-size:11px;color:#94a6c2;margin-top:4px;line-height:1.45}
.actions{display:grid;gap:8px}.note-button{border-color:#6b5b2f;background:linear-gradient(135deg,#493a18,#322914);color:#ffe3a0}
.sheet-bg,.modal-bg{display:none;position:fixed;inset:0;z-index:250;background:rgba(2,7,14,.72);backdrop-filter:blur(5px);align-items:flex-end;justify-content:center}
.sheet-bg.open,.modal-bg.open{display:flex}.sheet{width:min(100%,560px);background:#111d31;border:1px solid #314a6e;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + var(--safe-b));box-shadow:0 -18px 60px rgba(0,0,0,.35)}.handle{width:42px;height:4px;background:#4a5d78;border-radius:999px;margin:2px auto 15px}.sheet h3{margin:0 0 5px;font-size:18px}.sheet p{margin:0 0 14px;color:#9bacC7;font-size:12px}.sheet-actions{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(82px + var(--safe-b));transform:translateX(-50%);z-index:400;background:#152642;border:1px solid #42699f;color:#eaf2ff;border-radius:12px;padding:10px 13px;font-size:12px;box-shadow:0 12px 35px rgba(0,0,0,.3);max-width:88vw}
.me-card{padding:15px 16px;margin-bottom:9px}.me-row{display:flex;align-items:center;gap:12px}.me-icon{width:39px;height:39px;border-radius:12px;background:#142742;border:1px solid #315078;display:grid;place-items:center}.me-main{flex:1}.me-main b{font-size:14px}.me-main span{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}.me-card button{border:0;background:transparent;color:#99bfff;font-weight:800;cursor:pointer}
.auth-card{width:min(92vw,460px);margin:auto;background:#111d31;border:1px solid #365173;border-radius:18px;padding:18px;align-self:center}.auth-card h2{margin:0 0 4px}.auth-card p{color:var(--muted);font-size:11px;margin:0 0 12px}.auth-card input{width:100%;margin:5px 0;border:1px solid #334d72;background:#091426;color:#fff;border-radius:10px;padding:11px}.auth-actions{display:grid;gap:7px;margin-top:9px}.auth-msg{font-size:11px;color:#a9bddb;min-height:18px;margin-top:9px;white-space:pre-wrap}
.protocol{padding:17px}.protocol h2{font-size:17px;margin:16px 0 6px}.protocol h2:first-child{margin-top:0}.protocol p,.protocol li{font-size:12px;color:#b5c3d8;line-height:1.58}.empty{text-align:center;color:#7186a5;padding:35px 12px}
.loading{min-height:100dvh;display:grid;place-items:center;color:#9db2d0;font-weight:800}
.note-scroll{background:#edf1f6;color:#171b24}.note-scroll .page{min-height:0}
@media(min-width:900px){.view{max-width:980px;padding-left:24px;padding-right:24px}.chapter-list{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}.detail-scroll,.note-scroll{max-width:900px}.tabbar{left:50%;right:auto;transform:translateX(-50%);width:520px;border:1px solid #293c59;border-bottom:0;border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div id="loading" class="loading">正在加载课程数据…</div>
<div id="app" class="app" hidden>
  <section id="home" class="view active"></section>
  <section id="courses" class="view"></section>
  <section id="knowledge" class="view"></section>
  <section id="me" class="view"></section>
  <nav class="tabbar">
    <button data-tab="home" class="active" onclick="switchTab('home')"><svg viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7v9.1a1.2 1.2 0 0 1-1.2 1.2H4.2A1.2 1.2 0 0 1 3 19.8z"/><path d="M9 21v-7h6v7"/></svg><span>首页</span></button>
    <button data-tab="courses" onclick="switchTab('courses')"><svg viewBox="0 0 24 24"><path d="M4 4.5h6.5A2.5 2.5 0 0 1 13 7v13a2.5 2.5 0 0 0-2.5-2.5H4z"/><path d="M20 4.5h-6.5A2.5 2.5 0 0 0 11 7v13a2.5 2.5 0 0 1 2.5-2.5H20z"/></svg><span>课程</span></button>
    <button data-tab="knowledge" onclick="switchTab('knowledge')"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 7.2 12 11.5l7.5-4.3z"/><path d="M4.5 12 12 16.3l7.5-4.3M4.5 16.8 12 21l7.5-4.2"/></svg><span>知识库</span></button>
    <button data-tab="me" onclick="switchTab('me')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>我的</span></button>
  </nav>
</div>

<div id="detail" class="detail" aria-hidden="true">
  <div class="detail-head"><button class="back" onclick="backPage()">‹ 返回</button><div id="detailTitle" class="detail-title"></div></div>
  <div id="detailBody" class="detail-scroll"></div>
</div>
<div id="noteView" class="note-view" aria-hidden="true">
  <div class="detail-head"><button class="back" onclick="backPage()">‹ 返回</button><div id="noteTitle" class="detail-title"></div><button class="back" style="font-size:12px" onclick="openNoteStandalone()">独立打开</button></div>
  <div id="noteBody" class="note-scroll"></div>
</div>

<div id="copySheet" class="sheet-bg" onclick="sheetBackdrop(event)">
  <div class="sheet"><div class="handle"></div><h3>学习提示词已复制</h3><p>已包含当前课程全部 Z 知识点、重要性/学习深度以及完整教学协议。旧笔记不会改变本次 Prompt。</p><div class="sheet-actions"><button class="primary" onclick="openChatGPT()">打开 ChatGPT</button><button class="secondary" onclick="closeSheet()">留在这里</button></div></div>
</div>

<div id="authModal" class="modal-bg" onclick="authBackdrop(event)">
  <div class="auth-card">
    <h2>云同步</h2><p>沿用原学习系统的 Supabase 账号与进度表。本机即使未登录也会保存进度。</p>
    <div id="authLoggedOut">
      <input id="authEmail" type="email" autocomplete="email" placeholder="邮箱">
      <input id="authPassword" type="password" autocomplete="current-password" placeholder="密码">
      <div class="auth-actions"><button class="primary" onclick="signIn()">邮箱 + 密码登录</button><button class="secondary" onclick="sendMagicLink()">发送 Magic Link</button><button class="secondary" onclick="closeAuth()">取消</button></div>
    </div>
    <div id="authLoggedIn" hidden>
      <div class="card" style="padding:13px;margin:10px 0"><b id="authUserEmail"></b><div style="color:#91a3c0;font-size:11px;margin-top:4px" id="authSummary"></div></div>
      <div class="auth-actions"><button class="primary" onclick="syncAll(true)">立即同步</button><button class="secondary" onclick="signOut()">退出登录</button><button class="secondary" onclick="closeAuth()">关闭</button></div>
    </div>
    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<script>
const VERSION='2026.09.30.1';
const SUPABASE_URL='https://zrzplqwauuruyssgcwqt.supabase.co';
const SUPABASE_KEY='sb_publishable_YENvfSv64ZLopoXrXNNbqw_se6XJYs3';
const KP_PREFIX='autosar-kp-', KP_TS_PREFIX='autosar-kp-ts-';
let DATA=null, courseById=new Map(), kpById=new Map(), chapterById=new Map(), COURSE_MAP={};
let state={tab:'home',courseFilter:'ALL',courseQuery:'',kpFilter:'ALL',kpQuery:'',currentCourse:null,notePath:null};
let sb=null,user=null,syncBusy=false,settings={};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const levelChip=(label,n)=>`<span class="level l${n}">${label} ${n}</span>`;
const intensity=(i,d)=>`intensity-${Math.max(0,Math.min(4,Number(i||0)+Number(d||0)))}`;
const kpKey=id=>KP_PREFIX+id;
const kpDone=id=>localStorage.getItem(kpKey(id))==='1';
const kpTs=id=>Number(localStorage.getItem(KP_TS_PREFIX+id)||0);
function markLocal(id,done,ts=Date.now()){localStorage.setItem(kpKey(id),done?'1':'0');localStorage.setItem(KP_TS_PREFIX+id,String(ts));}
function courseDone(id){const ids=COURSE_MAP[id]||[];return !!ids.length&&ids.every(kpDone)}
function progress(){
  const kpIds=[...kpById.keys()],kpD=kpIds.filter(kpDone).length;
  const cs=[...courseById.values()],cD=cs.filter(c=>courseDone(c.id)).length;
  return {kpDone:kpD,kpTotal:kpIds.length,courseDone:cD,courseTotal:cs.length,coursePct:Math.round(cD/cs.length*100||0),kpPct:Math.round(kpD/kpIds.length*100||0)};
}
function iconSearch(){return `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.2 4.2"/></svg>`}
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function rememberCourse(id){
  localStorage.setItem('autosar-last-course',id);
  let r=[];try{r=JSON.parse(localStorage.getItem('autosar-recent-courses')||'[]')}catch(e){}
  r=[id,...r.filter(x=>x!==id)].slice(0,5);localStorage.setItem('autosar-recent-courses',JSON.stringify(r));
  if(user)saveSettings({last_course:id});
}
function lastCourse(){
  const cloud=settings.last_course;
  if(cloud&&courseById.has(cloud))return cloud;
  const l=localStorage.getItem('autosar-last-course');if(l&&courseById.has(l))return l;
  const first=[...courseById.values()].find(c=>!courseDone(c.id));return first?.id||[...courseById.keys()][0];
}
function recentCourses(){let a=[];try{a=JSON.parse(localStorage.getItem('autosar-recent-courses')||'[]')}catch(e){}return a.filter(x=>courseById.has(x)).slice(0,4)}
function top(title,sub){return `<div class="top"><div><h1>${esc(title)}</h1><p>${esc(sub||'')}</p></div><button class="avatar" onclick="switchTab('me')" aria-label="我的">${user?'✓':'BSW'}</button></div>`}
function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===tab));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderTab(tab); if(user)saveSettings({last_module:tab});
  window.scrollTo({top:0,behavior:'instant'});
}
function renderTab(tab){({home:renderHome,courses:renderCourses,knowledge:renderKnowledge,me:renderMe}[tab]||renderHome)()}
function renderHome(){
  const p=progress(),id=lastCourse(),c=courseById.get(id),recent=recentCourses().map(x=>courseById.get(x)).filter(Boolean);
  $('#home').innerHTML=`${top('BSW Learning','AUTOSAR Classic · 跳槽学习系统')}

function buildPrompt(id){
  const c=courseById.get(String(id));if(!c)return'';
  const ch=chapterById.get(Number(String(id).split('.')[0]));
  const pointText=c.points.map(p=>`- ${p.id}｜${p.title}：${p.desc}`).join('\n');
  const importanceRule={0:'重要性 0：低优先投入。先建立可用理解，命中具体 JD / 项目需求时再扩展。',1:'重要性 1：中等优先。掌握工程主链、关键机制和常见排查方法。',2:'重要性 2：最高优先。必须形成稳定、可复述、可 Debug、可承受面试追问的能力。'}[c.importance];
  const depthRule={0:'学习深度 0（了解）：知道它解决什么问题、基本边界和典型使用场景即可，不做无收益的实现深挖。',1:'学习深度 1（工程掌握）：要能解释主数据流/调用链、关键配置如何影响 Runtime、常见异常和基本 Debug。',2:'学习深度 2（深入掌握）：必须能解释状态机/时序/Runtime 因果、关键配置、异常路径、观测点和完整 RCA，并能承受中高级面试连续追问。'}[c.depth];
  return `我要直接开始学习 AUTOSAR BSW 课程 ${c.id}《${c.title}》。请把下面内容视为本次新对话的完整学习上下文，不需要再问我“想学什么”“基础如何”或让我重新选择教学模式，直接按流程开课。

【我的背景与学习目标】
- 我不是 AUTOSAR 零基础，而是做 AUTOSAR Classic BSW 的车载嵌入式软件工程师，主方向是 Communication Stack / 诊断 / 故障管理及 ECU 集成。
- 我有真实量产项目和 EB tresos、CANoe、Trace32 等工程工具经验；对 COM、PduR、CanIf、CanTp、CanSM、CanNm/Nm、ComM、DCM、DEM、BswM、NvM、E2E 等模块已有不同程度的实际接触。
- 目标不是“看懂名词”，而是系统补齐底层原理、Runtime 调用链/状态机/时序、配置与行为的因果关系、真实 Debug 能力，以及中高级 BSW 跳槽面试表达。
- 已经熟悉的工程概念不要长时间停留在入门定义；但遇到我可能只有“会配置、没吃透原理”的地方，要把底层逻辑补齐。
- 本 App 可能存在独立的历史笔记文件，但它们只用于阅读，不代表我已经掌握，也不要因为存在笔记而跳过任何教学内容。

【当前课程元信息】
- 课程：${c.id}《${c.title}》
- 所属章节：第 ${ch?.id||String(c.id).split('.')[0]} 章 · ${ch?.title||''}
- 重要性：${c.importance}
- 学习深度：${c.depth}
- 建议学习单元：${c.duration}
- ${importanceRule}
- ${depthRule}
- 注意：建议时间只用于限制“主题边界”，不是回答字数上限。知识密度高时允许分多个教学回合完成，不能为了塞进 30 分钟而删掉关键机制。

【等级定义】
- 重要性 0 = 低；1 = 中；2 = 高。数字越大，学习优先级越高。
- 学习深度 0 = 浅；1 = 中；2 = 深。数字越大，需要掌握得越深入。
- “重要性”和“学习深度”是两条独立轴：重要性决定投入优先级，学习深度决定需要理解到什么程度。

【本课必须完整覆盖的 Z 知识点】
${pointText}

【教学总原则】
1. 把本课作为一个完整工程主题讲。Z 点是覆盖清单，不是让你逐条念定义；要主动把它们串成同一条数据流、调用链、状态机、时序或 Debug 闭环。
2. 每个关键结论都尽量回答“为什么”。本课为“重要性 ${c.importance} / 学习深度 ${c.depth}”，教学深度必须匹配上面的等级定义。
3. AUTOSAR 标准行为、供应商实现、项目特例必须明确区分。不要把 EB/Vector/某 OEM 的实现习惯说成 AUTOSAR 通用规定。
4. 严禁为了显得专业而编造：AUTOSAR API、配置字段、SWS 条款号、回调关系、标准时序、供应商菜单路径或项目数据。无法确认就明确说“未核实 / 版本相关 / 供应商相关”。
5. 资料可信度优先级：AUTOSAR 官方 SWS/EXP > ISO/CiA/IEEE 等正式标准 > 芯片/Vector/Elektrobit/ETAS 等官方资料 > OEM/Tier1 公开技术资料 > 明确标注的工程经验。真实面经只用于判断“怎么考”，不能当技术事实来源。
6. 如果当前对话具备联网/检索能力，涉及标准接口、关键机制、时序、配置语义等事实时优先核对官方材料；如果没有核对到，不要伪造出处。

【固定教学状态机】
A. 本课路线图（1 屏内）：告诉我这节课最终要建立什么能力、各 Z 点之间是什么关系。
B. 心智模型：解决什么问题、在 AUTOSAR 哪一层、上下游是谁、数据/控制从哪里来又到哪里去。
C. 核心原理：机制、状态转换条件、关键时序、数据流/调用链，以及关键参数之间的因果关系。
D. Runtime：涉及 API / Callback / MainFunction / Task / ISR 时，明确“谁调用谁、何时调用、数据怎么走、失败路径怎样”。能画 ASCII 图时就画简洁图。
E. 配置工程化：关键 AUTOSAR 配置如何改变 Runtime 行为；再映射到 EB tresos/DaVinci 等工具。具体厂商字段只有确认可靠时才写。
F. 工程场景：至少给 1 个与真实 ECU 开发接近的例子，把配置、Runtime 和总线/诊断现象串起来。
G. Debug：如果学习深度 >= 1，至少完成 1 个“现象 → 假设 → 分层观测点 → 证据 → 根因 → 修复 → 回归”的完整 RCA；重要性 2 或学习深度 2 的通信/诊断主航道尽量给 2～3 个。要告诉我 CANoe/Trace32/日志/变量/总线抓包分别看什么。
H. 面试模式：重要性 2/1 的核心问题同时给出“理解版”与“面试回答骨架”。重要性 2 + 学习深度 2 的问题至少准备：30 秒回答 → 2 分钟展开 → 面试官继续追问 3～5 层，并指出哪些回答会暴露“只会配置不会原理”。
I. 小测闭环：本课末尾给 3～8 题，不要立即给答案。题目混合：定义/概念、因果、Runtime/时序、真实 Debug 场景。等我回答后逐题标记 ✓正确 / △不完整 / ✗错误，只针对薄弱点纠正；确认掌握后再宣布本课完成。

【互动节奏】
- 先给 A“本课路线图”，然后直接进入 B 的第一小节。
- 每完成一个自然大模块，可以用 1 个很短的理解检查确认我跟上，再继续；不要每讲两句话就停下来问。
- 如果我中途追问，先回答追问，再回到当前教学状态继续，不要丢失课程进度。
- 不要因为我已经有项目经验就跳过基础机制；也不要把显而易见的入门定义讲得过长。

【课后打印笔记协议】
当我说“现在总结打印笔记吧”时，为本课生成独立、可打印的 A4 单文件 HTML 工程笔记。必须覆盖本课全部 Z 点，并包含：范围/目录、总体心智模型、原理/状态机/时序、关键配置、API/Runtime、Debug 手册、面试追问、易错点、“最后只记这些”速查、权威来源。状态机/调用链/时序优先用内嵌 SVG；高密度但可读，不要为了少页数压掉关键原理。

现在不要复述以上规则，也不要先问问题。直接输出本课路线图，然后开始第一个教学模块。`;
}
async function copyCoursePrompt(id){
  const text=buildPrompt(id);let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}
  if(!ok){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove()}
  if(ok){$('#copySheet').classList.add('open')}else toast('复制失败，请长按手动复制')
}
function closeSheet(){$('#copySheet').classList.remove('open')}function sheetBackdrop(e){if(e.target===e.currentTarget)closeSheet()}
function openChatGPT(){window.open('https://chatgpt.com/','_blank')}
function openProtocol(push=true,noAnim=false){
  $('#detailTitle').innerHTML='<b>教学协议</b><small>Study Prompt Engine</small>';
  $('#detailBody').innerHTML=`<div class="card protocol"><h2>固定教学顺序</h2><p>路线图 → 心智模型 → 核心原理 → Runtime → 配置工程化 → 工程场景 → Debug → 面试模式 → 小测闭环。</p><h2>两条等级轴</h2><p>重要性 0/1/2 控制学习优先级；学习深度 0/1/2 控制需要理解到多深。数字越大越高。</p><h2>资料规则</h2><p>优先 AUTOSAR 官方、ISO 等标准与工具厂商官方资料；标准行为、供应商实现、项目特例必须区分；不允许编造 API、字段、SWS 条款或项目数据。</p><h2>笔记与教学互不影响</h2><p>notes/ 下的独立 HTML 只是阅读资产，不代表课程已经学习，也不会让 ChatGPT 自动跳过任何内容。</p></div>`;
  showDetail(noAnim);if(push)history.pushState({page:'protocol',tab:state.tab},'');
}
function openAuth(){updateAuthUI();$('#authModal').classList.add('open')}function closeAuth(){$('#authModal').classList.remove('open')}function authBackdrop(e){if(e.target===e.currentTarget)closeAuth()}
function authMsg(s){$('#authMsg').textContent=s||''}
function updateAuthUI(){
  $('#authLoggedOut').hidden=!!user;$('#authLoggedIn').hidden=!user;
  if(user){$('#authUserEmail').textContent=user.email||user.id;$('#authSummary').textContent=`本机进度 ${progress().kpDone}/${progress().kpTotal} 个知识点`}
  if(DATA)renderMe();
}
async function initSupabase(){
  if(!window.supabase){return}
  try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data}=await sb.auth.getSession();user=data.session?.user||null;updateAuthUI();
    sb.auth.onAuthStateChange(async(event,session)=>{user=session?.user||null;updateAuthUI();if(user&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))await syncAll(false)});
    if(user)await syncAll(false);
  }catch(e){console.warn(e)}
}
async function signIn(){if(!sb)return authMsg('Supabase 尚未加载。');const email=$('#authEmail').value.trim(),password=$('#authPassword').value;authMsg('正在登录…');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return authMsg('登录失败：'+error.message);user=data.user;updateAuthUI();authMsg('登录成功，正在同步…');await syncAll(true)}
async function sendMagicLink(){if(!sb)return authMsg('Supabase 尚未加载。');const email=$('#authEmail').value.trim();if(!email)return authMsg('请先填写邮箱。');const redirectTo=location.origin+location.pathname;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo}});authMsg(error?'发送失败：'+error.message:'Magic Link 已发送，请检查邮箱。')}
async function signOut(){if(!sb)return;await sb.auth.signOut();user=null;settings={};updateAuthUI();authMsg('已退出。本机进度仍保留。')}
async function saveRows(rows){
  if(!user||!sb||!rows.length)return;
  const now=new Date().toISOString(),payload=rows.map(r=>({user_id:user.id,knowledge_id:r.id,completed:!!r.completed,completed_at:r.completed?(r.completed_at||now):null,updated_at:r.updated_at||now}));
  const {error}=await sb.from('autosar_study_progress').upsert(payload,{onConflict:'user_id,knowledge_id'});if(error)throw error;
}
async function syncOne(id,done){if(!user||!sb)return;try{await saveRows([{id,completed:done,updated_at:new Date().toISOString()}]);toast('云端已同步')}catch(e){console.warn(e);toast('云同步失败，本机已保存')}}
async function syncCourse(id,done){if(!user||!sb)return;try{const now=new Date().toISOString();await saveRows((COURSE_MAP[id]||[]).map(k=>({id:k,completed:done,updated_at:now})));toast('整节课程已同步')}catch(e){console.warn(e);toast('云同步失败，本机已保存')}}
async function syncAll(show=true){
  if(!user||!sb||syncBusy)return;syncBusy=true;if(show)authMsg('正在合并云端与本机进度…');
  try{
    const {data:rows,error}=await sb.from('autosar_study_progress').select('knowledge_id,completed,completed_at,updated_at').eq('user_id',user.id);if(error)throw error;
    const cloud=new Map((rows||[]).map(r=>[r.knowledge_id,r])),upload=[];
    for(const id of kpById.keys()){
      const r=cloud.get(id),localRaw=localStorage.getItem(kpKey(id)),localExists=localRaw!==null,localDone=localRaw==='1',lts=kpTs(id),cts=r?.updated_at?Date.parse(r.updated_at):0;
      if(!r){if(localExists&&(localDone||lts)){const ts=lts||Date.now();upload.push({id,completed:localDone,updated_at:new Date(ts).toISOString()})}}
      else if(localExists&&lts>cts)upload.push({id,completed:localDone,updated_at:new Date(lts).toISOString()});
      else markLocal(id,!!r.completed,cts||Date.now());
    }
    if(upload.length)await saveRows(upload);
    await loadSettings();refreshAll();updateAuthUI();if(show)authMsg(`同步完成：${progress().kpDone}/${progress().kpTotal} 个知识点完成。`);
  }catch(e){console.warn(e);if(show)authMsg('同步失败：'+(e.message||e))}
  finally{syncBusy=false}
}
async function saveSettings(patch){
  if(!user||!sb)return;settings={...settings,...patch};const row={user_id:user.id,last_course:settings.last_course??null,last_module:settings.last_module||'home',theme:'auto',font_size:'normal',density:'normal',expanded_chapters:[],updated_at:new Date().toISOString()};
  const {error}=await sb.from('autosar_user_settings').upsert(row,{onConflict:'user_id'});if(error)console.warn(error)
}
async function loadSettings(){if(!user||!sb)return;const {data,error}=await sb.from('autosar_user_settings').select('*').eq('user_id',user.id).maybeSingle();if(!error&&data)settings=data}
async function checkUpdate(){
  if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg){await reg.update();toast('已检查更新；如有新版本会自动替换缓存。');return}}
  toast('当前环境未启用 Service Worker。')
}
async function init(){
  try{
    const res=await fetch('./data/courses.json',{cache:'no-store'});if(!res.ok)throw new Error('courses.json '+res.status);DATA=await res.json();
    DATA.chapters.forEach(ch=>{chapterById.set(Number(ch.id),ch);ch.courses.forEach(c=>{courseById.set(c.id,c);COURSE_MAP[c.id]=c.points.map(p=>p.id)})});
    DATA.knowledgeChapters.forEach(ch=>ch.points.forEach(k=>kpById.set(k.id,k)));
    $('#loading').remove();$('#app').hidden=false;renderHome();renderCourses();renderKnowledge();renderMe();
    history.replaceState({page:null,tab:'home'},'');
    await initSupabase();
    const m=location.hash.match(/^#course=(.+)$/);if(m&&courseById.has(decodeURIComponent(m[1]))){const cid=decodeURIComponent(m[1]);history.replaceState({page:'lesson',id:cid,tab:'courses'},'');switchTab('courses');setTimeout(()=>openLesson(cid,false,true),0)}
    if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v='+VERSION).catch(console.warn);
  }catch(e){$('#loading').textContent='课程数据加载失败：'+e.message}
}
init();
</script>
