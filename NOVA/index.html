t:1.65;margin:7px 0}\n#main code{font-size:13px}\n#main pre,#main pre.dense-pre{font-size:13px;line-height:1.55;padding:10px;white-space:pre-wrap}\n#main .param-card pre,#main .flow-card pre,#main .compact-card pre{font-size:13px;line-height:1.55}\n#main table{font-size:13px;line-height:1.55;margin:12px 0}\n#main th,#main td{padding:8px 7px}\n#main .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}\n#main .table-scroll>table{min-width:620px}\n#main .param-title,#main .flow-title,#main .card-title{font-size:15px;line-height:1.5;padding:8px}\n#main .chapter-dense-grid .param-card table,#main .chapter-quickref table{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card pre,#main .chapter-quickref pre{font-size:13px;line-height:1.55}\n#main .chapter-dense-grid .param-card h4{font-size:15px}\n#main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{gap:12px}\n#main .nm-state-svg{min-width:800px}\n#main .figure-scroll{overflow-x:auto}\n#main .lesson-toc{padding:12px 16px;background:#f3f6fc;border-radius:8px}\n#main .lesson-toc a{display:block;padding:6px 0;color:#27558a}\n#main .source-note{font-size:13px;color:#52627c;background:#f3f6fc;padding:12px;border-left:3px solid #4f88d8}\n@media(max-width:600px){\n #main .compact-grid,#main .param-grid,#main .flow-grid,#main .chapter-dense-grid,#main .chapter-dense-intro{grid-template-columns:1fr}\n #main{padding:18px 14px}#wrap{padding:12px 8px 24px}\n #main .table-scroll:before{content:'左右滑动查看表格';display:block;font-size:12px;color:#65708a;margin-top:8px}\n #main .figure-scroll:before{content:'左右滑动查看完整状态图';display:block;font-size:12px;color:#65708a;margin-top:8px}\n}\n@media print{\n body{font-size:10pt;background:white}#wrap,#main{padding:0}\n #main .lesson-toc{display:none}#main .table-scroll,#main .figure-scroll{overflow:visible}\n #main .table-scroll>table,#main .nm-state-svg{min-width:0}\n #main h2.major-break{break-before:auto!important;page-break-before:auto!important}\n #main table,#main p,#main li{font-size:9pt}#main pre,#main code{font-size:8pt}\n}\n\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv id=\"wrap\">\u003cmain id=\"main\">\n\u003ch1>8.6 · Ignition ON/OFF 全链路与典型网络管理故障\u003c/h1>\n\u003cp class=\"source-note\">整理自 NM 配置打印版笔记。DF_XY、ESC_M / ESC_S、参数数值及开关状态均为原笔记中的项目示例，请结合实际项目核对。本笔记覆盖本课相关内容，不代表完整课程教案。\u003c/p>\n\u003cnav class=\"lesson-toc\" aria-label=\"本课目录\">\u003ca href=\"#4-DF-XY-当前关键快照\">4. DF_XY 当前关键快照\u003c/a>\u003ca href=\"#12-客户需求怎么落配置\">12. 客户需求怎么落配置\u003c/a>\u003ca href=\"#13-排查清单-故障现象到定位路径\">13. 排查清单：故障现象到定位路径\u003c/a>\u003ca href=\"#14-开关联动速查-不用全背但要知道谁影响谁\">14. 开关联动速查：不用全背但要知道谁影响谁\u003c/a>\u003ca href=\"#15-常见排查入口-一页现场卡\">15. 常见排查入口：一页现场卡\u003c/a>\u003c/nav>\n\u003ch2 class=\"major-break\" id=\"4-DF-XY-当前关键快照\">4. DF_XY 当前关键快照\u003c/h2>\n\u003ch3 id=\"4-1-DF-XY-快照逐项解释\">4.1 DF_XY 快照逐项解释\u003c/h3>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>ComM Channel = ESC_M, ID 0\u003c/strong>\n    意味着 ComM 里有一个通道叫 ESC_M，通道 ID 是 0。 App / DCM / PNC / BswM 如果要请求这一路 CAN 通信，最终都要落到这个 ComM Channel。\n    当前结论：后面 Nm、CanNm、CanSM 都必须引用同一个 ESC_M，否则通路断。\n\u003cstrong>Nm Channel = ChassisCan1NmCluster, ID 0\u003c/strong>\n    意味着 Nm 抽象层有一个 NM 通道，通道 ID 是 0。 Nm 不直接发 CAN，它负责把 ComM 的 NM 请求转给具体 BusNm。\n    当前结论：这个 Nm Channel 必须通过 ComMChannelRef / NmComMChannelRef(EB) 对到 ComM 的 ESC_M。\n\u003cstrong>StandardBusType / NmStandardBusType(EB) = NM_BUSNM_CANNM\u003c/strong>\n    意味着 Nm 这个通道下面接的是 CanNm， ComM 调 Nm_NetworkRequest 后，会走到 CanNm_NetworkRequest。\n    当前结论：这是 CAN NM 通路，后续排查要看 CanNm / CanIf / CanSM。\n\u003cstrong>CanNm_ChanConfig / CanNmChannelConfig_0(EB)\u003c/strong>\n    意味着 CanNm 当前只有一个主要 Channel 配置实例。\n    这个实例里放 NM 周期、Timeout、NID/CBV、UserData、PNC、CarWakeUp 等配置。\n    当前结论：改 NM 报文和 NM 状态机参数，主要看这个 Channel。\n\u003cstrong>nmChannelId / CanNmComMNetworkHandleRef(EB) = ESC_M\u003c/strong>\n    意味着 CanNm Channel 绑定到 ComM 的 ESC_M。 ComM 请求 ESC_M 后，Nm/CanNm 才知道操作哪一路 NM。\n    当前结论：这条引用是通的；如果发不出 NM，不能优先怀疑这里断。\n\u003cstrong>CanSM Network = ESC_M\u003c/strong>\n    意味着 CanSM 也有一个名为 ESC_M 的 CAN Network。\n    ComM 请求 FullCom / SilentCom / NoCom 后，CanSM 用这个 Network 去控制底层 Controller。\n    当前结论：CanSM 侧也和 ComM 通道名对齐。\n\u003cstrong>CtrlRef / CanSMController(EB) = ESC_M / ESC_S\u003c/strong>\n    意味着 CanSM 的 \u003cb>ESC_M Network 会一起控制两个 CAN Controller\u003c/b>。\n    ComM 只有一路 ESC_M 请求时，CanSM 可以把 ESC_M 和 ESC_S 两个 controller 一起 START/STOP/SLEEP。\n    当前结论：这不是“两路 NM”，而是一条逻辑 Network 控两个 Controller。\n\u003cstrong>CanIf Controllers: ESC_M = 0, ESC_S = 1\u003c/strong>\n    意味着 CanIf 底层有两个 Controller ID。\n    CanIf 的 Rx/Tx PDU 会具体绑定到某个 Controller/HRH/HTH。\n    当前结论：NM 报文真正走哪个物理 Controller，要看 CanIf PDU，不只看 CanSM controller list。\u003c/code>\u003c/pre>\n\u003cp>核心时间快照：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>MainFunctionPeriod / CanNmMainFunctionPeriod(EB) = 5 ms\u003c/strong>\n    意味着 CanNm 主函数 5ms 调一次。\n\u003cstrong>MsgCycleTime / CanNmMsgCycleTime(EB) = 100 ms\u003c/strong>\n    意味着正常 NM 周期发送间隔是 100ms。 CanNm 处于需要周期发 NM 且底层可发时生效。\n    当前结论：客户说“NM 周期”，主要看这个参数；但底层未 FullCom/未 STARTED 时它不会让 NM 发出来。\n\u003cstrong>CanNmMsgCycleOffset / CanNmMsgCycleOffset(EB) = 5 ms\u003c/strong>\n    意味着本节点 NM 首发相位偏移 5ms。 用来避免多个节点同一时刻一起发 NM。\n    当前结论：它影响首发错峰，不是正常周期本身。\n\u003cstrong>MsgTimeoutTime / CanNmMsgTimeoutTime(EB) = 40 ms\u003c/strong>\n    意味着本节点发出 NM 后，等待 TxConfirmation 的超时时间是 40ms。 目的是“我这帧 NM 有没有发送确认”。\n    当前结论：它不是网络管理 Timeout；发不出/TxConfirm 不回时看它。\n\u003cstrong>CanNmTime / CanNmTimeoutTime(EB) = 1 s\u003c/strong>\n\u003cp>意味着 CanNm 的 NM Timeout Timer 时间是 1s。它不能简单理解为“1s 没收到 NM 报文就进入 ReadySleep”。\u003c/p>\u003cpre>\u003ccode>需要区分当前 CanNm 所在状态：\n1. 如果当前在 Normal Operation：\n   CanNmTimeoutTime 到期后，通常是重启 NM Timeout Timer，并可能报 CANNM_E_NETWORK_TIMEOUT。\n   它不会因为 Timeout 到期就直接进入 ReadySleep。\n   从 Normal Operation 进入 ReadySleep 的关键条件是本地 Network Release，也就是本节点已经释放网络请求。\n2. 如果当前已经在 ReadySleep：\n   此时如果 1s 内没有有效 NM 活动继续刷新 / 保持 NM Timeout Timer， CanNm 才会从 ReadySleep 进入 PrepareBusSleep。\n当前结论：客户问“对端不发后多久认为网络释放”，不能只看 CanNmTimeoutTime。\n这个配置项更准确表示为：本节点已释放网络并处于 ReadySleep 后，如果 1s 内没有有效 NM 活动，则进入 PrepareBusSleep。\n   它不等于最终睡眠时间，最终进入 BusSleep 还要继续叠加 CanNmWaitBusSleepTime，并受 ComM / CanSM / 本地 Network Request / 其它节点 NM 活动影响。\u003c/code>\u003c/pre>\u003cstrong>RMSTime / CanNmRepeatMessageTime(EB) = 515 ms\u003c/strong>\n    意味着 RMS 持续 515ms。 这是状态持续窗口，不是快发慢发周期。\n    当前结论：客户问“Repeat Message 持续多久”，看它；客户问“NM 周期”，看 MsgCycleTime / CanNmMsgCycleTime(EB)。\n\u003cstrong>WBSTime / CanNmWaitBusSleepTime(EB) = 5 s\u003c/strong>\n    意味着在 PrepareBusSleep 后等待 5s 才进入 BusSleep。 它是 NM 睡眠前等待，不是 EcuM 最终下电。\n\u003cstrong>COMM_T_MIN_FULL_COM_MODE_DURATION / ComMTMinFullComModeDuration(EB) = 5 s\u003c/strong>\n    意味着 ComM 进入 FullCom 后至少保持 5s。 即使上层释放请求，也可能要等最短 FullCom 时间到。\n    当前结论：诊断/应用释放后不立刻睡，先查这个是否还没到。\n\u003cstrong>ModeReqRepTime / CanSMModeRequestRepetitionTime(EB) = 5 ms\u003c/strong>\n    意味着 CanSM 请求 CanIf/CanDrv 切 Controller 模式失败时，每 5ms 重试一次。\n    它影响 Controller START/STOP/SLEEP 模式切换重试节奏。\n    当前结论：ComM 请求 FullCom 但 Controller 起不来时，要看 CanSM 重试和 mode indication。\n\u003cstrong>BorTimeL1 / CanSMBorTimeL1(EB) = 0.5 s\u003c/strong>\n    意味着 BusOff 后 L1 快速恢复等待 0.5s。 偶发 BusOff 时恢复比较快。\n    当前结论：BusOff 快恢复阶段看它。\n\u003cstrong>BorTimeL2 / CanSMBorTimeL2(EB) = 2.0 s\u003c/strong>\n    意味着连续 BusOff 进入 L2 后，恢复等待 2s。 L2 比 L1 更保守。\n    当前结论：频繁 BusOff 后恢复变慢，是这个阶段在起作用。\n\u003cstrong>BorTimeTxEnsured / CanSMBorTimeTxEnsured(EB) = 1.0 s\u003c/strong>\n    意味着 BusOff 恢复后还要观察 1s 稳定发送。 稳定后 CanSM 才认为恢复可靠。\n    当前结论：BusOff 恢复不是 Controller 一 STARTED 就算彻底结束。\u003c/code>\u003c/pre>\n\u003cp>功能开关快照：\u003c/p>\n\u003cpre class=\"dense-pre\">\u003ccode>\u003cstrong>COMM_PNC_SUPPORT / ComMPncSupport(EB) = false\u003c/strong>\n    意味着 ComM 全局不支持 PNC。 ComM 不会按 PNC 对象管理功能簇请求。\n\u003cstrong>CANNM_PN_SUPPORTED / CanNmPnSupported(EB) = false\u003c/strong>\n    意味着 CanNm 全局不支持 PNC。 CanNm 不会按 PN vector / PN filter mask 解析 NM 里的 PN 信息。\n    当前结论：即使 CANNM_PN_INFO_OFFSET / CanNmPnInfoOffset(EB) 有值，当前也不生效。\n\u003cstrong>CANIF_PUBLIC_PN_SUPPORT / CanIfPublicPnSupport(EB) = false\u003c/strong>\n    意味着 CanIf 不启用 Partial Network features。\n    CanIf PN filter 和部分 transceiver PN 通知链不会按 PN 生效。\n    当前结论：底层 PN 支持当前关闭。\n\u003cstrong>CANSM_PNSUPPORT / CanSMPNSupport(EB) = false\u003c/strong>\n    意味着 CanSM 不启用 Partial Networking 支持。\n    CANSM_PARTIALNETWORKING / CanSMActivatePN(EB) 即使有字段，也不能形成有效 PN 模式管理。\n    当前结论：CanSM 当前不参与 PN 唤醒链。\n\u003cstrong>CanNmCarWakeUpRxEnabled / CanNmCarWakeUpRxEnabled(EB) = false\u003c/strong>\n    意味着 CanNm 不解析收到 NM PDU 里的 CarWakeUp bit。 byte/bit 配置值不会触发 CarWakeUp 语义。\n\u003cstrong>NM_CAR_WAKEUPRX_INDICATION / NmCarWakeUpRxEnabled(EB) = false\u003c/strong>\n    意味着 Nm 抽象层也不启用 CarWakeUp 接收语义。 即使 CanNm 侧打开，Nm/BswM/EcuM 上报链也要同步确认。\n    当前结论：当前 CarWakeUp 链路整体不成立。\n\u003cstrong>CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB) = true\u003c/strong>\n    意味着 CanNm 支持 UserData API 方式访问 NM UserData。\n    可以通过 \u003cb>Nm_SetUserData / CanNm_SetUserData\u003c/b> 类接口处理用户数据，具体看配置和实现。。\n\u003cstrong>CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB) = false\u003c/strong>\n    意味着 NM UserData 不是由 COM 信号来填。 不能按“ComSignal 自动填 NM UserData”理解当前工程。\n    当前结论：当前 UserData 是 API/内部方式，不是 COM 信号来填。\n\u003cstrong>UserDataLength / CanNmUserDataLength(EB) = 6\u003c/strong>\n    意味着 8 字节 NM PDU 扣掉 NID 和 CBV 后，剩余 6 字节 UserData。 当前布局就是 Byte2~Byte7。\n    当前结论：PNC/CarWakeUp/UserData 如果启用，通常都要在这 6 字节里分配含义。\n\u003cstrong>CANNM_NODE_ID_ENABLED / CanNmNodeIdEnabled(EB) = true\u003c/strong>\n    意味着 NM PDU 会携带 Node ID。 对端可以从 NM 报文识别发送节点。\n    当前结论：当前 Byte0 的 NID 有效。\n\u003cstrong>CanNmNodeId / CanNmNodeId(EB) = 8\u003c/strong>\n    意味着本节点发送 NM 时，NID 字节填 8。\n\u003cstrong>NidPos / CanNmPduNidPosition(EB) = CANNM_PDU_BYTE_0\u003c/strong>\n    当前结论：NM 报文 Byte0 = NodeId。\n\u003cstrong>CbvPos / CanNmPduCbvPosition(EB) = CANNM_PDU_BYTE_1\u003c/strong>\n    意味着 CBV 放在 Byte1。CBV 承载 Repeat Message Request、Active Wakeup、PNI 等控制位。\n\u003cstrong>COMM_NM_VARIANT_OF_CHANNEL / ComMNmVariant(EB) = FULL\u003c/strong>\n    意味着ComM 会通过 Nm_NetworkRequest / Nm_NetworkRelease 参与 NM 网络管理。\n    当前结论：ComM 不只是控制 CanSM，还会联动 Nm/CanNm。\n\u003cstrong>CANSM_ENHANCED_BUSOFF_REPORTING / CanSMEnhancedBusOffReporting(EB) = true\u003c/strong>\n    意味着 CanSM 启用增强 BusOff 上报能力。 BusOff 恢复状态和 DEM 上报会更完整。\n    当前结论：BusOff 排查要看 CanSM BOR 和 DEM 事件，不要只看 CanNm。\u003c/code>\u003c/pre>\n\u003ch2 class=\"major-break\" id=\"12-客户需求怎么落配置\">12. 客户需求怎么落配置\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 11.58%;\">\u003ccol style=\"width: 18.057%;\">\u003ccol style=\"width: 29.197%;\">\u003ccol style=\"width: 21.166%;\">\u003ccol style=\"width: 20.001%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>客户需求/问题\u003c/th>\u003cth>先确认\u003c/th>\u003cth>主改/主查配置\u003c/th>\u003cth>联动风险\u003c/th>\u003cth>验证点\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>NM 周期改为 X ms\u003c/td>\u003ctd>是正常周期，还是唤醒初期快发？\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>MsgCycleTime / CanNmMsgCycleTime(EB)\u003c/code>\u003c/td>\u003ctd>周期变小会增加 BusLoad；周期变大可能影响对端 Timeout。\u003c/td>\u003ctd>Trace 看 NM 周期\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>唤醒后快速发 N 帧，间隔 X ms\u003c/td>\u003ctd>N 是否大于 1；是否真的需要 immediate NM。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ImmediateNmTransmissions / CanNmImmediateNmTransmissions(EB)\u003c/code>、\u003ccode>ImmediateNmCycleTime / CanNmImmediateNmCycleTime(EB)\u003c/code>\u003c/td>\u003ctd>短时间负载增加；\u003ccode>RepeatMessageTime\u003c/code>必须大于快发序列时间。\u003c/td>\u003ctd>Trace 看唤醒初期是否出现 N 帧快发\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Repeat Message 持续 X ms\u003c/td>\u003ctd>客户说的是 Repeat 状态窗口，不是 NM 周期。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>RMSTime / CanNmRepeatMessageTime(EB)\u003c/code>\u003c/td>\u003ctd>影响唤醒扩散、节点发现、Repeat Message Request 行为。\u003c/td>\u003ctd>状态机日志/Trace 看 RMS 持续时间。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>节点 ID 是 X，放 Byte Y\u003c/td>\u003ctd>NodeId 是否启用；对端 NM Matrix 是否一致。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CANNM_NODE_ID_ENABLED / CanNmNodeIdEnabled(EB)\u003c/code>、\u003ccode>CanNmNodeId / CanNmNodeId(EB)\u003c/code>、\u003ccode>NidPos / CanNmPduNidPosition(EB)\u003c/code>\u003c/td>\u003ctd>改 NID 位置会影响 UserData/PN/CarWakeUp 布局。\u003c/td>\u003ctd>Trace 看 ByteY 是否为 NodeId；对端是否能识别节点。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CBV 放 Byte Y\u003c/td>\u003ctd>客户对 Repeat/ActiveWakeup/PNI 的 bit 定义。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CbvPos / CanNmPduCbvPosition(EB)\u003c/code>\u003c/td>\u003ctd>对端 CBV 解析必须同步；PNI/ActiveWakeup 都依赖 CBV。\u003c/td>\u003ctd>Trace 看 CBV Byte；对端是否正确解析 control bits。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>NM UserData 长度/内容\u003c/td>\u003ctd>UserData 是 API/internal，还是 COM 信号承载？\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CANNM_USER_DATA_ENABLED / CanNmUserDataEnabled(EB)\u003c/code>、\u003ccode>UserDataLength / CanNmUserDataLength(EB)\u003c/code>、\u003ccode>CANNM_COM_USER_DATA_SUPPORT / CanNmComUserDataSupport(EB)\u003c/code>\u003c/td>\u003ctd>PN Info、CarWakeUp、UserData 可能争用字节布局。\u003c/td>\u003ctd>Trace 看 Byte2~Byte7；生成代码/接口确认数据来源。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>开启 PNC\u003c/td>\u003ctd>客户是否真的要求 PNC，还是普通唤醒/网络保持？\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>COMM_PNC_SUPPORT / ComMPncSupport(EB)\u003c/code>、\u003ccode>CANNM_PN_SUPPORTED / CanNmPnSupported(EB)\u003c/code>、\u003ccode>CANIF_PUBLIC_PN_SUPPORT / CanIfPublicPnSupport(EB)\u003c/code>、\u003ccode>CANSM_PNSUPPORT / CanSMPNSupport(EB)\u003c/code>\u003c/td>\u003ctd>必须端到端配 ComM/CanNm/CanIf/CanSM/Com/PduR/BswM，不能只开一个模块。\u003c/td>\u003ctd>看 PN bit、EIRA/ERA、BswM rule、目标 PNC 是否保持网络。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PN 信息从 Byte X 开始，长度 Y\u003c/td>\u003ctd>是否和 NID/CBV/UserData 冲突。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CANNM_PN_INFO_OFFSET / CanNmPnInfoOffset(EB)\u003c/code>、\u003ccode>CANNM_PN_INFO_LENGTH / CanNmPnInfoLength(EB)\u003c/code>、\u003ccode>PnFilterMask / CanNmPnFilterMaskByte(EB)\u003c/code>\u003c/td>\u003ctd>PNI bit、PN vector、PN filter mask 必须一致。\u003c/td>\u003ctd>构造 PN vector，验证目标 PNC 是否被识别/保持。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Car WakeUp bit 在 byte/bit\u003c/td>\u003ctd>这是 NM 报文语义，还是硬件唤醒源？\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmCarWakeUpRxEnabled / CanNmCarWakeUpRxEnabled(EB)\u003c/code>、\u003ccode>NM_CAR_WAKEUPRX_INDICATION / NmCarWakeUpRxEnabled(EB)\u003c/code>、\u003cbr>\u003ccode>CanNmCarWakeUpBytePosition / CanNmCarWakeUpBytePosition(EB)\u003c/code>、\u003ccode>CanNmCarWakeUpBitPosition / CanNmCarWakeUpBitPosition(EB)\u003c/code>\u003c/td>\u003ctd class=\"key-cell\">CanNm/Nm/BswM/EcuM 链路要同步；不要和 Active Wakeup bit 混。\u003c/td>\u003ctd>发带 CarWakeUp bit 的 NM，看是否上报到上层。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>诊断时保持不睡\u003c/td>\u003ctd>诊断是否通过 DCM 正常进入 ActiveDiagnostic。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>COMM_DCM_ENABLED / ComMDcmUsage(EB)\u003c/code>、\u003cbr>\u003ccode>Dcm_RxComMChannelIDs / DcmDslProtocolRxComMChannelRef(EB)\u003c/code>\u003c/td>\u003ctd>还会受 NoCom/NoWakeup/CommunicationAllowed 限制。\u003c/td>\u003ctd>诊断开始看 \u003ccode>ComM_DCM_ActiveDiagnostic\u003c/code>；结束看 \u003ccode>InactiveDiagnostic\u003c/code>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>BusOff 恢复慢/快一点\u003c/td>\u003ctd>是 L1 慢，还是连续 BusOff 进入 L2。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>BorTimeL1 / CanSMBorTimeL1(EB)\u003c/code>、\u003ccode>BorTimeL2 / CanSMBorTimeL2(EB)\u003c/code>、\u003ccode>BorCounterL1ToL2 / CanSMBorCounterL1ToL2(EB)\u003c/code>、\u003ccode>BorTimeTxEnsured / CanSMBorTimeTxEnsured(EB)\u003c/code>\u003c/td>\u003ctd>调短恢复时间不能解决物理层/ACK/波特率/ID 冲突问题。\u003c/td>\u003ctd>制造 BusOff，看恢复节奏、DEM、CanSM 状态。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>收不到对端 NM\u003c/td>\u003ctd>总线上有没有这帧；CAN ID/DLC 是否匹配。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>sortedRxLPduConfig / CanIfRxPduCanIdRange(EB)\u003c/code>、\u003ccode>canId / CanIfRxPduCanIdRangeLowerCanId(EB) (0x0 -&gt; 0x1fffffff)\u003c/code>、\u003ccode>upperRangeCanId / CanIfRxPduCanIdRangeUpperCanId(EB) (0x0 -&gt; 0x1fffffff)\u003c/code>、\u003ccode>targetPduId / CanIfRxPduTargetPduID(EB) (0 -&gt; 65535)\u003c/code>、\u003ccode>userType / CanIfRxPduUpperLayerRef(EB)\u003c/code>、\u003ccode>RxPduId / CanNmRxPduRef(EB)\u003c/code>\u003c/td>\u003ctd class=\"key-cell\">CanIf 区间没覆盖对端 CAN ID，或 TargetPduID / UpperLayerRef / CanNmRxPduRef 没对齐时，CanNm 不会有有效 RxIndication。\u003c/td>\u003ctd>Trace + Lower/UpperCanId + TargetPduID + UpperLayerRef + CanNm_RxIndication 闭环。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>发不出本节点 NM\u003c/td>\u003ctd>Controller 是否 STARTED；CanNm 是否在 Network Mode。\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>COMM_NM_VARIANT_OF_CHANNEL / ComMNmVariant(EB)\u003c/code>、\u003ccode>CtrlRef / CanSMController(EB)\u003c/code>、\u003ccode>TxPduId / CanNmTxPduRef(EB)\u003c/code>、\u003ccode>hthConfigPtr / CanIfHthCfg(EB)\u003c/code>\u003c/td>\u003ctd>不要只改 CanNmMsgCycleTime；底层没起来再短周期也发不出。\u003c/td>\u003ctd>看 ComM/CanSM/CanNm 状态、CanIf TxConfirmation、总线 Trace。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"13-排查清单-故障现象到定位路径\">13. 排查清单：故障现象到定位路径\u003c/h2>\n\u003cdiv class=\"keybox\">\u003cspan class=\"tag\">定位原则\u003c/span>排查要从“现象”倒推链路，不要从“字段名”倒推。每个问题都要同时看状态机、PDU 映射、生成代码和总线 Trace。\u003c/div>\n\u003ch3 id=\"13-1-改配置前先确认\">13.1 改配置前先确认\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 46.762%;\">\u003ccol style=\"width: 53.238%;\">\u003c/colgroup>\u003cthead>\u003ctr>\u003cth>确认项\u003c/th>\u003cth>为什么重要\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>客户需求到底是周期、状态持续时间、Timeout，还是物理唤醒？\u003c/td>\u003ctd>同一句“多久睡/多久发”可能分别对应 CanNm、ComM、CanSM、EcuM。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>当前通道是哪个 ComM Channel / CanSM Network / CanNm Channel？\u003c/td>\u003ctd>防止改错网络或改了一个没有被引用的 Channel。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>NM 报文物理走哪个 Controller？\u003c/td>\u003ctd class=\"key-cell\">CanSM 管两个 Controller 不等于一帧 NM 自动发到两个 Controller。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>当前功能是否真的开启？\u003c/td>\u003ctd>PNC、CarWakeUp、BusLoadReduction、Immediate NM 等都有总开关/通道开关。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>客户 Matrix 和 EB 配置是否一致？\u003c/td>\u003ctd>NID/CBV/PN/UserData 字节位置必须和对端一致。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"13-3-故障现象到排查路径\">13.3 故障现象到排查路径\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 11.321%;\">\u003ccol style=\"width: 24.016%;\">\u003ccol style=\"width: 23.627%;\">\u003ccol style=\"width: 21.036%;\">\u003ccol style=\"width: 20.001%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>现象\u003c/th>\u003cth>第一层\u003c/th>\u003cth>第二层\u003c/th>\u003cth>第三层\u003c/th>\u003cth>最后确认\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>不发 NM\u003c/td>\u003ctd class=\"key-cell\">ComM 是否 FullCom，是否被 NoCom/NoWakeup/CommunicationAllowed 压住。\u003c/td>\u003ctd class=\"key-cell\">CanSM Controller 是否 STARTED，CanIf PDU mode 是否允许 Tx。\u003c/td>\u003ctd class=\"key-cell\">CanNm 是否 NetworkRequested / Repeat / Normal，TxPduRef 是否正确。\u003c/td>\u003ctd class=\"key-cell\">CanIf TxConfirmation、总线 Trace、HTH/CAN ID/DLC。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>收不到 NM\u003c/td>\u003ctd>Trace 先确认总线上是否有对端 NM。\u003c/td>\u003ctd class=\"key-cell\">CanIf Rx ID/Range/HRH/DLC 是否匹配。\u003c/td>\u003ctd class=\"key-cell\">CanNmRxPduRef 是否引用正确 CanIf Rx PDU。\u003c/td>\u003ctd class=\"key-cell\">CanNm_RxIndication 是否进来，CBV/NID/PN 解析是否正确。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>释放后不睡\u003c/td>\u003ctd class=\"key-cell\">ComM User/DCM/BswM/App/PNC 是否还保持 FullCom。\u003c/td>\u003ctd class=\"key-cell\">ComMTMinFullComModeDuration 是否未到。\u003c/td>\u003ctd class=\"key-cell\">CanNmTimeoutTime、ReadySleep、PrepareBusSleep、WaitBusSleepTime 是否按预期走。\u003c/td>\u003ctd class=\"key-cell\">EcuM/CanTrcv/硬件下电链路是否还有保持源。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>FullCom 不起来\u003c/td>\u003ctd>User Mapping、ComM_RequestComMode 是否正确。\u003c/td>\u003ctd>CommunicationAllowed、Mode Limitation、Wakeup Inhibition 是否挡住。\u003c/td>\u003ctd class=\"key-cell\">CanSMComMNetworkHandleRef、Controller mode indication 是否正确。\u003c/td>\u003ctd class=\"key-cell\">Nm/CanNm 引用是否对齐，CanIf PDU 是否通。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PNC 不工作\u003c/td>\u003ctd>确认 ComM/CanNm/CanIf/CanSM PNC 总开关都打开。\u003c/td>\u003ctd>PNC mapping、PN info offset/length、PN filter mask 是否一致。\u003c/td>\u003ctd>Com EIRA/ERA、PduR routes、BswM rules 是否完整。\u003c/td>\u003ctd>Trace 看 PNI + PN vector；验证目标 PNC 是否保持/释放。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>时间不准\u003c/td>\u003ctd>确认主函数周期是否就是配置里的 MainFunctionPeriod。\u003c/td>\u003ctd>确认配置值是否能被 MainFunctionPeriod 整除。\u003c/td>\u003ctd>生成代码 tick 是否按预期换算。\u003c/td>\u003ctd>Trace/日志测量是否从正确状态边界开始。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>BusOff 反复\u003c/td>\u003ctd>先确认是 L1 还是 L2 阶段。\u003c/td>\u003ctd>看 CanSM BOR 参数和 DEM 上报。\u003c/td>\u003ctd>查 CanIf/CanDrv mode、TxEnsured 观察期。\u003c/td>\u003ctd>查物理层、ACK、波特率、采样点、终端电阻、ID 冲突、BusLoad。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"14-开关联动速查-不用全背但要知道谁影响谁\">14. 开关联动速查：不用全背但要知道谁影响谁\u003c/h2>\n\u003cdiv class=\"keybox\">\u003cspan class=\"tag\">记忆方式\u003c/span>不用机械背所有开关，但要知道哪些开关会改变状态机、报文布局、收发路径和跨模块联动。\u003c/div>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 13.99%;\">\u003ccol style=\"width: 33.808%;\">\u003ccol style=\"width: 27.202%;\">\u003ccol style=\"width: 25%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>必须关注的开关/参数\u003c/th>\u003cth>影响范围\u003c/th>\u003cth>现场判断\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd class=\"key-cell\">ComM 模式控制\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMNmVariant\u003c/code>、\u003ccode>ComMDcmUsage\u003c/code>、\u003ccode>ComMTMinFullComModeDuration\u003c/code>\u003c/td>\u003ctd>决定是否通过 Nm 管网络、诊断是否能保持通信、FullCom 最短保持时间。\u003c/td>\u003ctd>诊断后不睡、FullCom 不起来，先看这些。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">ComM 限制/抑制\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMNoCom\u003c/code>、\u003ccode>ComMNoWakeup\u003c/code>、\u003ccode>ComMModeLimitationEnabled\u003c/code>、\u003ccode>ComMWakeupInhibitionEnabled\u003c/code>\u003c/td>\u003ctd>可能压住 FullCom 或阻止唤醒。\u003c/td>\u003ctd>请求存在但通道不起，查 MaxMode 和 inhibition status。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">CanNm 时间\u003c/td>\u003ctd>\u003ccode>MsgCycleTime\u003c/code>、\u003ccode>MsgTimeoutTime\u003c/code>、\u003ccode>TimeoutTime\u003c/code>、\u003ccode>RepeatMessageTime\u003c/code>、\u003ccode>WaitBusSleepTime\u003c/code>\u003c/td>\u003ctd>决定 NM 周期、TxConfirm 超时、网络超时、Repeat 状态、PrepareBusSleep 等待。\u003c/td>\u003ctd>客户说“时间不对”，先分清是哪种时间。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">CanNm 报文布局\u003c/td>\u003ctd>\u003ccode>NidPosition\u003c/code>、\u003ccode>CbvPosition\u003c/code>、\u003ccode>UserDataLength\u003c/code>、\u003ccode>NodeId\u003c/code>\u003c/td>\u003ctd>影响对端解析和本节点 NM 内容。\u003c/td>\u003ctd>内容不对时查 Matrix、CanNm、CanIf 三者一致性。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PNC\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>ComMPncSupport\u003c/code>、\u003ccode>CanNmPnSupported\u003c/code>、\u003ccode>CanIfPublicPnSupport\u003c/code>、\u003ccode>CanSMPNSupport\u003c/code>\u003c/td>\u003ctd>必须端到端打开才形成 PNC 链路。\u003c/td>\u003ctd>当前 DF_XY 全关，不能用 PNC 解释当前网络保持。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CarWakeUp\u003c/td>\u003ctd class=\"key-cell\">\u003ccode>CanNmCarWakeUpRxEnabled\u003c/code>、\u003ccode>NmCarWakeUpRxEnabled\u003c/code>\u003c/td>\u003ctd>决定是否解析 NM PDU 里的 CarWakeUp bit 并上报。\u003c/td>\u003ctd>当前关闭，byte/bit 配置不会形成 CarWakeUp 语义。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">CanSM BusOff\u003c/td>\u003ctd>\u003ccode>BorTimeL1\u003c/code>、\u003ccode>BorTimeL2\u003c/code>、\u003ccode>BorCounterL1ToL2\u003c/code>、\u003ccode>BorTimeTxEnsured\u003c/code>、DEM event\u003c/td>\u003ctd>决定 BusOff 恢复节奏和诊断上报。\u003c/td>\u003ctd>BusOff 问题不要只看 CanNm。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"key-cell\">CanIf 收发路径\u003c/td>\u003ctd>Rx/Tx PDU、CAN ID、HRH/HTH、Range、DLC、UpperLayer\u003c/td>\u003ctd>决定 NM 报文能不能进/出 CanNm。\u003c/td>\u003ctd>Controller 已 STARTED 但报文不通，重点查 CanIf。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"15-常见排查入口-一页现场卡\">15. 常见排查入口：一页现场卡\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable class=\"resizable-table\">\u003ccolgroup>\u003ccol style=\"width: 8.981%;\">\u003ccol style=\"width: 55.742%;\">\u003ccol style=\"width: 35.277%;\">\u003c/colgroup>\n\u003cthead>\u003ctr>\u003cth>入口\u003c/th>\u003cth>一眼判断链路\u003c/th>\u003cth>最容易误判的点\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>不发 NM\u003c/td>\u003ctd class=\"key-cell\">ComM FullCom -&gt; CanSM STARTED -&gt; Nm/CanNm NetworkRequest -&gt; CanIf TxPdu/HTH -&gt; TxConfirmation/Trace\u003c/td>\u003ctd>只改 \u003ccode>CanNmMsgCycleTime\u003c/code> 不能让没起来的 Controller 发 NM。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>收不到 NM\u003c/td>\u003ctd>Trace 有帧 -&gt; CanIf Rx ID/Range/HRH/DLC -&gt; CanNmRxPduRef -&gt; CanNm_RxIndication\u003c/td>\u003ctd class=\"key-cell\">CanIf 收不到时，CanNm 配再对也没用。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>诊断不通\u003c/td>\u003ctd class=\"key-cell\">ComM FullCom -&gt; CanSM STARTED -&gt; CanIf PDU mode -&gt; CanTp/PduR/DCM 路由 -&gt; 会话/安全/S3\u003c/td>\u003ctd>诊断报文内容归 DCM/CanTp；通道能不能通信归 ComM/CanSM。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>诊断后不睡\u003c/td>\u003ctd class=\"key-cell\">DCM Inactive -&gt; ComM 请求源清空 -&gt; TMinFullCom 到期 -&gt; CanNm Timeout -&gt; WaitBusSleep -&gt; EcuM/CanTrcv\u003c/td>\u003ctd>不能把“5s 不睡”直接等同于 \u003ccode>CanNmWaitBusSleepTime\u003c/code>。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>BusOff\u003c/td>\u003ctd class=\"key-cell\">CanSM BOR -&gt; L1/L2/TxEnsured -&gt; DEM -&gt; CanIf/CanDrv -&gt; 物理层/ACK/BusLoad\u003c/td>\u003ctd>BusOff 不是 NM 协议问题。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PNC\u003c/td>\u003ctd class=\"key-cell\">ComM PNC -&gt; CanNm PN Info/PNI -&gt; CanIf/CanSM PN -&gt; Com EIRA/ERA -&gt; PduR/BswM/EcuM\u003c/td>\u003ctd>只打开 CanNm 的 PN 不等于 PNC 生效。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>唤醒\u003c/td>\u003ctd>物理唤醒源 -&gt; EcuM/CanTrcv/CanIf -&gt; ComM 逻辑请求 -&gt; CanSM STARTED -&gt; Nm/CanNm 网络保持\u003c/td>\u003ctd>CarWakeUp、ActiveWakeup、SelectiveWake、PNC 不是同一个概念。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/main>\u003c/div>\u003c/body>\u003c/html>\n"}</script>

[{"id":"Z2-01","title":"整数类型与溢出","desc":"signed/unsigned、整型提升、截断、移位、溢出、固定宽度类型 uint8/uint16/uint32。"},{"id":"Z2-08","title":"字节序与位操作","desc":"little/big endian、位域风险、mask、set/clear/test bit、报文解析。"},{"id":"Z2-07","title":"结构体/联合体","desc":"内存布局、padding、alignment、union 使用风险。"},{"id":"Z2-10","title":"栈/堆/静态区","desc":"生命周期、碎片、栈溢出、为什么安全关键 ECU 通常谨慎使用动态分配。"}]},{"id":"2.2","title":"const / volatile / static / extern：存储、可见性与优化边界","importance":2,"depth":2,"duration":"≈30 min","points":[{"id":"Z2-02","title":"const","desc":"const 变量、指针与 const 的组合、接口设计中的只读约束。"},{"id":"Z2-03","title":"volatile","desc":"寄存器、ISR/任务共享变量、编译器优化；理解 volatile 不等于原子性/线程安全。"},{"id":"Z2-04","title":"static / extern","desc":"作用域、生命周期、translation unit、内部/外部链接。"}]},{"id":"2.3","title":"指针、数组与函数指针","importance":2,"depth":2,"duration":"≈30 min","points":[{"id":"Z2-05","title":"指针与数组","desc":"数组退化、多级指针、指针算术、sizeof 差异。"},{"id":"Z2-06","title":"函数指针","desc":"callback、驱动接口、状态机/表驱动；能手写简单例子。"}]},{"id":"2.4","title":"宏、inline 与未定义行为","importance":2,"depth":2,"duration":"≈25–30 min","points":[{"id":"Z2-09","title":"宏与 inline","desc":"宏副作用、括号、条件编译、inline 与函数宏的取舍。"},{"id":"Z2-11","title":"未定义行为","desc":"越界、野指针、悬空指针、严格别名、未初始化、整数问题。"}]},{"id":"2.5","title":"可重入、线程安全、原子性与竞态","importance":2,"depth":2,"duration":"≈30 min","points":[{"id":"Z2-12","title":"可重入与线程安全","desc":"reentrant、共享状态、临界区、ISR 可调用性。"},{"id":"Z2-13","title":"原子性与竞态","desc":"读改写、临界区、中断屏蔽、原子指令概念。"}]},{"id":"2.6","title":"从编译到启动：ELF、链接脚本、Startup 与 MemMap","importance":2,"depth":2,"duration":"≈35 min","points":[{"id":"Z2-14","title":"编译流程","desc":"预处理 → 编译 → 汇编 → 链接；每阶段输入输出。"},{"id":"Z2-15","title":"目标文件与符号","desc":"text/data/bss/rodata、symbol、relocation、library。"},{"id":"Z2-16","title":"链接脚本/内存映射","desc":"Flash/RAM 分区、section placement、map 文件怎么看。"},{"id":"Z2-17","title":"启动过程","desc":"Reset → startup → stack/data/bss/init → constructors(如有) → main。"},{"id":"Z2-18","title":"AUTOSAR MemMap","desc":"START_SEC/STOP_SEC、编译器抽象、为什么要做 section 映射。"}]},{"id":"2.7","title":"编 <script>

let DATA=null, courseById=new Map(), kpById=new Map(), chapterById=new Map(), COURSE_MAP={};

function progress(){
  const kpIds=[...kpById.keys()],kpD=kpIds.filter(kpDone).length;
  const cs=[...courseById.values()],cD=cs.filter(c=>courseDone(c.id)).length;
  return {kpDone:kpD,kpTotal:kpIds.length,courseDone:cD,courseTotal:cs.length,coursePct:Math.round(cD/cs.length*100||0),kpPct:Math.round(kpD/kpIds.length*100||0)};
}
function iconSearch(){return `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.2 4.2"/></svg>`}
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function rememberCourse(id){
  localStorage.setItem('autosar-last-course',id);
  let r=[];try{r=JSON.parse(localStorage.getItem('autosar-recent-courses')||'[]')}catch(e){}
  r=[id,...r.filter(x=>x!==id)].slice(0,5);localStorage.setItem('autosar-recent-courses',JSON.stringify(r));

}
function lastCourse(){
  const cloud=settings.last_course;
  if(cloud&&courseById.has(cloud))return cloud;
  const l=localStorage.getItem('autosar-last-course');if(l&&courseById.has(l))return l;
  const first=[...courseById.values()].find(c=>!courseDone(c.id));return first?.id||[...courseById.keys()][0];
}
function recentCourses(){let a=[];try{a=JSON.parse(localStorage.getItem('autosar-recent-courses')||'[]')}catch(e){}return a.filter(x=>courseById.has(x)).slice(0,4)}
function renderHeader(title,sub){return `<div class="top"><div><h1>${esc(title)}</h1><p>${esc(sub||'')}</p></div><button class="avatar" onclick="switchTab('me')" aria-label="我的">${user?'✓':'BSW'}</button></div>`}
function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===tab));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderTab(tab);if(!history.state?.page)history.replaceState({page:null,tab},''); if(user)saveSettings({last_module:tab});
  $('#'+tab).scrollTop=0;
}
function renderTab(tab){({home:renderHome,courses:renderCourses,knowledge:renderKnowledge,notes:renderNotes,me:renderMe}[tab]||renderHome)()}
function renderHome(){
  const p=progress(),id=lastCourse(),c=courseById.get(id),recent=recentCourses().map(x=>courseById.get(x)).filter(Boolean);
  $('#home').innerHTML=`${renderHeader('BSW Learning','AUTOSAR Classic · 跳槽学习系统')}
  ${c?`<div class="card hero ${intensity(c.importance,c.depth)}"><div class="eyebrow">Continue Learning</div><div class="hero-id">${esc(c.id)}</div><div class="hero-title">${esc(c.title)}</div><div class="meta-row">${levelChip('重要性',c.importance)}${levelChip('学习深度',c.depth)}<span class="soft-pill">${esc(c.duration)}</span></div><div style="height:13px"></div><button class="primary" onclick="openLesson('${esc(c.id)}')">${courseDone(c.id)?'再次复习':'继续学习'} →</button></div>`:''}
  <div class="card progress-card"><div class="progress-head"><div><div class="eyebrow">课程进度</div><div class="progress-num">${p.courseDone}<small> / ${p.courseTotal}</small></div></div><div class="progress-pct">${p.coursePct}%</div></div><div class="track"><i style="width:${p.coursePct}%"></i></div></div>
  <div class="stats"><div class="card stat"><b>${p.kpDone}</b><span>已掌握知识点</span></div><div class="card stat"><b>${p.kpTotal-p.kpDone}</b><span>待补知识点</span></div></div>
  <div class="section-head"><h2>快速入口</h2><span>按需要进入</span></div>
  <div class="stats"><button class="card stat" style="color:inherit;text-align:left" onclick="state.courseFilter='2';switchTab('courses')"><b style="color:var(--i2)">2</b><span>高重要性课程</span></button><button class="card stat" style="color:inherit;text-align:left" onclick="state.courseQuery='debug';switchTab('courses')"><b>Debug</b><span>场景课程</span></button></div>
  ${recent.length?`<div class="section-head"><h2>最近学习</h2><span>${recent.length} 节</span></div><div class="row-list">${recent.map(courseRow).join('')}</div>`:''}`;
}
function courseRow(c){return `<button class="row ${intensity(c.importance,c.depth)}" onclick="openLesson('${esc(c.id)}')"><span class="row-id">${esc(c.id)}</span><span class="row-main"><span class="row-title">${esc(c.title)}</span><span class="row-meta">重要性 ${c.importance} · 学习深度 ${c.depth} · ${esc(c.duration)}</span></span><span class="go">›</span></button>`}
function renderCourses(){
  const q=state.courseQuery.trim().toLowerCase(),f=state.courseFilter;
  let matches=[...courseById.values()].filter(c=>(f==='ALL'||String(c.importance)===String(f))&&(!q||(`${c.id} ${c.title} ${c.points.map(p=>p.title+' '+p.desc).join(' ')}`).toLowerCase().includes(q)));

  if(q){
    body=`<div class="row-list">${matches.map(courseRow).join('')||'<div class="empty">没有找到匹配课程。</div>'}</div>`;
  }else{
    const cards=DATA.chapters.map(ch=>{
      const visible=ch.courses.filter(c=>f==='ALL'||String(c.importance)===String(f));if(!visible.length)return'';

    body=`<div class="chapter-list">${cards}</div>`;

  $('#courses').innerHTML=`${renderHeader('课程',`${courseById.size} 节正式课程 · ${chapterById.size} 章`)}${search}${seg}${body}`;

function renderKnowledge(){
  const q=state.kpQuery.trim().toLowerCase(),f=state.kpFilter;
  let groups='';
  for(const ch of DATA.knowledgeChapters){
    const arr=ch.points.filter(k=>(f==='ALL'||String(k.importance)===String(f))&&(!q||(`${k.id} ${k.title} ${k.desc}`).toLowerCase().includes(q)));

    groups+=`<div class="kp-group">第 ${ch.id} 章 · ${esc(ch.title)}</div><div class="kp-list">${arr.map(k=>`<label class="kp"><input type="checkbox" ${kpDone(k.id)?'checked':''} onchange="toggleKp('${esc(k.id)}',this.checked)"><span class="kp-content"><span class="kp-line"><span class="kp-code">${esc(k.id)}</span><span class="kp-title">${esc(k.title)}</span>${levelChip('重要性',k.importance)}</span><span class="kp-desc">${esc(k.desc)}</span></span></label>`).join('')}</div>`;

async function fetchNoteText(path){
  const controller=new AbortController();let timer;
  try{
    const timeout=new Promise((_,reject)=>{
      timer=setTimeout(()=>{reject(new Error('笔记请求超时'));controller.abort()},5000);
    });
    return await Promise.race([(async()=>{
      const res=await fetch(new URL('./'+path,document.baseURI),{signal:controller.signal});
      if(!res.ok)throw new Error('HTTP '+res.status);return res.text();
    })(),timeout]);
  }finally{clearTimeout(timer)}
}

【我的背景与学习目标】
- 我不是 AUTOSAR 零基础，而是做 AUTOSAR Classic BSW 的车载嵌入式软件工程师，主方向是 Communication Stack / 诊断 / 故障管理及 ECU 集成。

【等级定义】
- 重要性 0 = 低；1 = 中；2 = 高。数字越大，学习优先级越高。
- 学习深度 0 = 浅；1 = 中；2 = 深。数字越大，需要掌握得越深入。
- “重要性”和“学习深度”是两条独立轴：重要性决定投入优先级，学习深度决定需要理解到什么程度。

${pointText}

【教学总原则】
1. 把本课作为一个完整工程主题讲。Z 点是覆盖清单，不是让你逐条念定义；要主动把它们串成同一条数据流、调用链、状态机、时序或 Debug 闭环。

3. AUTOSAR 标准行为、供应商实现、项目特例必须明确区分。不要把 EB/Vector/某 OEM 的实现习惯说成 AUTOSAR 通用规定。
4. 严禁为了显得专业而编造：AUTOSAR API、配置字段、SWS 条款号、回调关系、标准时序、供应商菜单路径或项目数据。无法确认就明确说“未核实 / 版本相关 / 供应商相关”。
5. 资料可信度优先级：AUTOSAR 官方 SWS/EXP > ISO/CiA/IEEE 等正式标准 > 芯片/Vector/Elektrobit/ETAS 等官方资料 > OEM/Tier1 公开技术资料 > 明确标注的工程经验。真实面经只用于判断“怎么考”，不能当技术事实来源。
6. 如果当前对话具备联网/检索能力，涉及标准接口、关键机制、时序、配置语义等事实时优先核对官方材料；如果没有核对到，不要伪造出处。

【固定教学状态机】
A. 本课路线图（1 屏内）：告诉我这节课最终要建立什么能力、各 Z 点之间是什么关系。
B. 心智模型：解决什么问题、在 AUTOSAR 哪一层、上下游是谁、数据/控制从哪里来又到哪里去。
C. 核心原理：机制、状态转换条件、关键时序、数据流/调用链，以及关键参数之间的因果关系。
D. Runtime：涉及 API / Callback / MainFunction / Task / ISR 时，明确“谁调用谁、何时调用、数据怎么走、失败路径怎样”。能画 ASCII 图时就画简洁图。

F. 工程场景：至少给 1 个与真实 ECU 开发接近的例子，把配置、Runtime 和总线/诊断现象串起来。
G. Debug：如果学习深度 >= 1，至少完成 1 个“现象 → 假设 → 分层观测点 → 证据 → 根因 → 修复 → 回归”的完整 RCA；重要性 2 或学习深度 2 的通信/诊断主航道尽量给 2～3 个。要告诉我 CANoe/Trace32/日志/变量/总线抓包分别看什么。
H. 面试模式：重要性 2/1 的核心问题同时给出“理解版”与“面试回答骨架”。重要性 2 + 学习深度 2 的问题至少准备：30 秒回答 → 2 分钟展开 → 面试官继续追问 3～5 层，并指出哪些回答会暴露“只会配置不会原理”。

现在不要复述以上规则，也不要先问问题。直接输出本课路线图，然后开始第一个教学模块。`;

    let settled=false;
    const finish=ok=>{if(settled)return;settled=true;resolve(ok)};
    script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    script.async=true;
    script.onload=()=>finish(true);
    script.onerror=()=>finish(false);
    document.head.appendChild(script);
    setTimeout(()=>finish(!!window.supabase),7000);
  });
  return supabaseLoadPromise;
}
async function initSupabase(){
  const loaded=window.supabase?true:await loadSupabaseRuntime();
  if(!loaded||!window.supabase){console.warn('Supabase CDN unavailable; local learning remains usable.');updateAuthUI();return}
  try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data}=await sb.auth.getSession();user=data.session?.user||null;updateAuthUI();
    sb.auth.onAuthStateChange(async(event,session)=>{user=session?.user||null;updateAuthUI();if(user&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED'))await syncAll(false)});
    if(user)await syncAll(false);
  }catch(e){console.warn(e)}
}
async function signIn(){if(!sb)return authMsg('Supabase 尚未加载。');const email=$('#authEmail').value.trim(),password=$('#authPassword').value;authMsg('正在登录…');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return authMsg('登录失败：'+error.message);user=data.user;updateAuthUI();authMsg('登录成功，正在同步…');await syncAll(true)}
async function sendMagicLink(){if(!sb)return authMsg('Supabase 尚未加载。');const email=$('#authEmail').value.trim();if(!email)return authMsg('请先填写邮箱。');const redirectTo=location.origin+location.pathname;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo}});authMsg(error?'发送失败：'+error.message:'Magic Link 已发送，请检查邮箱。')}
async function signOut(){if(!sb)return;await sb.auth.signOut();user=null;settings={};updateAuthUI();authMsg('已退出。本机进度仍保留。')}
async function saveRows(rows){
  if(!user||!sb||!rows.length)return;
  const now=new Date().toISOString(),payload=rows.map(r=>({user_id:user.id,knowledge_id:r.id,completed:!!r.completed,completed_at:r.completed?(r.completed_at||now):null,updated_at:r.updated_at||now}));
  const {error}=await sb.from('autosar_study_progress').upsert(payload,{onConflict:'user_id,knowledge_id'});if(error)throw error;
}
async function syncOne(id,done){if(!user||!sb)return;try{await saveRows([{id,completed:done,updated_at:new Date().toISOString()}]);toast('云端已同步')}catch(e){console.warn(e);toast('云同步失败，本机已保存')}}
async function syncCourse(id,done){if(!user||!sb)return;try{const now=new Date().toISOString();await saveRows((COURSE_MAP[id]||[]).map(k=>({id:k,completed:done,updated_at:now})));toast('整节课程已同步')}catch(e){console.warn(e);toast('云同步失败，本机已保存')}}
async function syncAll(show=true){
  if(!user||!sb||syncBusy)return;syncBusy=true;if(show)authMsg('正在合并云端与本机进度…');
  try{
    const {data:rows,error}=await sb.from('autosar_study_progress').select('knowledge_id,completed,completed_at,updated_at').eq('user_id',user.id);if(error)throw error;
    const cloud=new Map((rows||[]).map(r=>[r.knowledge_id,r])),upload=[];
    for(const id of kpById.keys()){
      const r=cloud.get(id),localRaw=localStorage.getItem(kpKey(id)),localExists=localRaw!==null,localDone=localRaw==='1',lts=kpTs(id),cts=r?.updated_at?Date.parse(r.updated_at):0;
      if(!r){if(localExists&&(localDone||lts)){const ts=lts||Date.now();upload.push({id,completed:localDone,updated_at:new Date(ts).toISOString()})}}
      else if(localExists&&lts>cts)upload.push({id,completed:localDone,updated_at:new Date(lts).toISOString()});
      else markLocal(id,!!r.completed,cts||Date.now());
    }
    if(upload.length)await saveRows(upload);
    await loadSettings();refreshAll();updateAuthUI();if(show)authMsg(`同步完成：${progress().kpDone}/${progress().kpTotal} 个知识点完成。`);
  }catch(e){console.warn(e);if(show)authMsg('同步失败：'+(e.message||e))}
  finally{syncBusy=false}
}
async function saveSettings(patch){
  if(!user||!sb)return;settings={...settings,...patch};const row={user_id:user.id,last_course:settings.last_course??null,last_module:settings.last_module||'home',theme:'auto',font_size:'normal',density:'normal',expanded_chapters:[],updated_at:new Date().toISOString()};
  const {error}=await sb.from('autosar_user_settings').upsert(row,{onConflict:'user_id'});if(error)console.warn(error)
}
async function loadSettings(){if(!user||!sb)return;const {data,error}=await sb.from('autosar_user_settings').select('*').eq('user_id',user.id).maybeSingle();if(!error&&data)settings=data}
async function checkUpdate(){
  if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg){await reg.update();toast('已检查更新；如有新版本会自动替换缓存。');return}}
  toast('当前环境未启用 Service Worker。')
}
function validateCourseData(data){
  if(!data||!Array.isArray(data.chapters)||!data.chapters.length||
     !Array.isArray(data.knowledgeChapters)||!data.knowledgeChapters.length)
    throw new Error('课程数据格式不正确');
  const ids=new Set();
  for(const ch of data.knowledgeChapters){
    if(!Array.isArray(ch.points))throw new Error('知识点数据不完整');
    for(const p of ch.points){
      if(!p.id||ids.has(p.id))throw new Error('知识点编号缺失或重复');
      ids.add(p.id);
    }
  }
  const courses=new Set();
  for(const ch of data.chapters){
    if(!Array.isArray(ch.courses))throw new Error('章节数据不完整');
    for(const c of ch.courses){
      if(!c.id||courses.has(c.id)||!Array.isArray(c.points)||!c.points.length||
         c.points.some(p=>!ids.has(p.id)))throw new Error('课程关联数据不完整');
      courses.add(c.id);
    }
  }
  return data;
}
async function fetchCourseData(){
  const controller=new AbortController();let timer;
  try{
    const timeout=new Promise((_,reject)=>{
      timer=setTimeout(()=>{reject(new Error('课程请求超时'));controller.abort()},5000);
    });
    const request=(async()=>{
      const url=new URL('./data/courses.json',document.baseURI);
      const res=await fetch(url,{cache:'no-store',signal:controller.signal});
      if(!res.ok)throw new Error('courses.json HTTP '+res.status);
      return validateCourseData(await res.json());
    })();
    return await Promise.race([request,timeout]);
  }finally{clearTimeout(timer)}
}
async function loadCourseData(){
  // Course rendering has no network dependency when the page contains its bundle.
  try{
    const snapshot=document.getElementById('courseSnapshot');
    if(snapshot)return validateCourseData(JSON.parse(snapshot.textContent));
  }catch(e){console.warn('Bundled courses invalid; trying the course file.',e)}
  return fetchCourseData();
}
function setCourseData(data){
  const courses=new Map(),points=new Map(),chapters=new Map(),mapping={};
  data.chapters.forEach(ch=>{chapters.set(Number(ch.id),ch);ch.courses.forEach(c=>{
    courses.set(c.id,c);mapping[c.id]=c.points.map(p=>p.id);
  })});
  data.knowledgeChapters.forEach(ch=>ch.points.forEach(k=>points.set(k.id,k)));
  DATA=data;courseById=courses;kpById=points;chapterById=chapters;COURSE_MAP=mapping;
}
async function refreshCourseData(){
  try{
    const latest=await fetchCourseData();
    if(JSON.stringify(latest)===JSON.stringify(DATA))return;
    setCourseData(latest);refreshAll();
    const page=history.state,scroll=$('#detailBody').scrollTop;
    if(page?.page==='lesson'&&courseById.has(page.id))openLesson(page.id,false,true);
    if(page?.page==='chapter'&&chapterById.has(Number(page.id)))openChapter(page.id,false,true);
    $('#detailBody').scrollTop=scroll;
  }catch(e){console.warn('Course update unavailable; existing courses remain usable.',e)}
}
function showLoadingError(error){
  const loading=$('#loading');if(!loading)return;
  loading.hidden=false;$('#app').hidden=true;
  loading.innerHTML=`<div style="max-width:460px;padding:24px;text-align:center"><p>课程加载失败：${esc(error.message||error)}</p><button class="primary" onclick="location.reload()">重新加载</button></div>`;
}
function registerWorker(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
    navigator.serviceWorker.register('./sw.js?v='+VERSION,{updateViaCache:'none'}).catch(console.warn);
}
async function init(){
  try{
    setCourseData(await loadCourseData());
    $('#app').hidden=false;renderHome();renderCourses();renderKnowledge();renderNotes();renderMe();
    $('#loading').hidden=true;
    history.replaceState({page:null,tab:'home'},'');
    // Supabase is optional and must never block the course UI boot.
    // Let the first screen paint before starting optional network work.
    setTimeout(()=>{registerWorker();refreshCourseData();initSupabase().catch(console.warn)},0);
    const m=location.hash.match(/^#course=(.+)$/);if(m&&courseById.has(decodeURIComponent(m[1]))){const cid=decodeURIComponent(m[1]);history.replaceState({page:'lesson',id:cid,tab:'courses'},'');switchTab('courses');setTimeout(()=>openLesson(cid,false,true),0)}

  }catch(e){console.error(e);showLoadingError(e)}
}
init();
</script>
