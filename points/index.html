<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" name="viewport"/>
<meta content="#f4f5f9" id="themeColorMeta" name="theme-color"/>
<meta content="light" name="color-scheme"/>
<script>
  (() => {
    const FINGERPRINT_KEY = "appRemoteHtmlFingerprintV1";
    const UPDATE_PARAM = "__app_refresh";
    const CACHE_BUST_PARAM = "__html_fingerprint_check";
    const CHECK_DEBOUNCE_MS = 1200;
    const RELOAD_GUARD_KEY = "appFingerprintReloadGuardV1";
    const RELOAD_GUARD_MS = 45000;

    let lastCheckAt = 0;
    let checkPromise = null;

    function pageUrl({ forCheck = false } = {}) {
      const url = new URL(window.location.href);
      url.hash = "";
      url.searchParams.delete(UPDATE_PARAM);
      url.searchParams.delete(CACHE_BUST_PARAM);
      if (forCheck) url.searchParams.set(CACHE_BUST_PARAM, String(Date.now()));
      return url;
    }

    function cleanUpdateParams() {
      try {
        const url = new URL(window.location.href);
        if (!url.searchParams.has(UPDATE_PARAM) && !url.searchParams.has(CACHE_BUST_PARAM)) return;
        url.searchParams.delete(UPDATE_PARAM);
        url.searchParams.delete(CACHE_BUST_PARAM);
        history.replaceState(history.state, "", `${url.pathname}${url.search}${url.hash}`);
      } catch (_) {}
    }

    async function sha256Hex(text) {
      try {
        if (window.crypto?.subtle && window.TextEncoder) {
          const bytes = new TextEncoder().encode(text);
          const digest = await crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, "0")).join("");
        }
      } catch (_) {}

      // Small deterministic fallback for browsers where SubtleCrypto is unavailable.
      let h1 = 0x811c9dc5;
      let h2 = 0x9e3779b9;
      for (let i = 0; i < text.length; i += 1) {
        const c = text.charCodeAt(i);
        h1 ^= c;
        h1 = Math.imul(h1, 0x01000193);
        h2 ^= c + ((i & 255) << 8);
        h2 = Math.imul(h2, 0x85ebca6b);
      }
      return `fallback-${(h1 >>> 0).toString(16).padStart(8, "0")}${(h2 >>> 0).toString(16).padStart(8, "0")}-${text.length}`;
    }

    function getReloadGuard() {
      try { return JSON.parse(sessionStorage.getItem(RELOAD_GUARD_KEY) || "null"); }
      catch (_) { return null; }
    }

    function setReloadGuard(fingerprint) {
      try {
        sessionStorage.setItem(RELOAD_GUARD_KEY, JSON.stringify({ fingerprint, at: Date.now() }));
      } catch (_) {}
    }

    function clearReloadGuard() {
      try { sessionStorage.removeItem(RELOAD_GUARD_KEY); } catch (_) {}
    }

    function reloadLatest(fingerprint) {
      const guard = getReloadGuard();
      if (guard && guard.fingerprint === fingerprint && Date.now() - Number(guard.at || 0) < RELOAD_GUARD_MS) {
        return false;
      }
      setReloadGuard(fingerprint);
      const url = pageUrl();
      url.searchParams.set(UPDATE_PARAM, fingerprint.slice(0, 16));
      url.searchParams.set(CACHE_BUST_PARAM, String(Date.now()));
      window.location.replace(url.href);
      return true;
    }

    async function fetchRemoteFingerprint() {
      const response = await fetch(pageUrl({ forCheck: true }).href, {
        cache: "no-store",
        credentials: "same-origin",
        headers: { "Cache-Control": "no-cache" }
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
