name: Points repository checks
on:
  push:
    paths: ["points/**", "AGENTS.md", ".github/workflows/points-hygiene.yml"]
  pull_request:
    paths: ["points/**", "AGENTS.md", ".github/workflows/points-hygiene.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node points/scripts/check-repo.mjs
      - run: node points/tests/repository-policy.test.mjs
      - run: python points/scripts/build-sql-backup.py --check
      - run: node points/tests/release-artifacts.test.mjs
      - run: node points/tests/release-cache.test.mjs
      - run: node points/tests/release-update.test.mjs
