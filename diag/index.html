<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#101417"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DiagTutor"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="icon" href="icon.svg"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles.css"/>
<title>诊断学习手册 · Diag Tutor</title>
</head>
<body>
<div class="app">
  <div class="scroll-meter" id="scrollMeter"></div>

  <header class="topbar glass">
    <button id="menuBtn" class="icon-btn" title="目录" aria-label="目录">☰</button>
    <a class="brand" href="#/" aria-label="Diag Tutor 首页">
      <span class="brand-mark">UDS</span>
      <span>
        <span class="brand-title">Diag Tutor</span>
        <span class="brand-subtitle">车载诊断学习手册</span>
      </span>
    </a>
    <div class="top-progress" id="topProgress">0 / 0</div>
    <div class="spacer"></div>
    <button id="viewBtn" class="icon-btn" title="切换视图" aria-label="切换视图">◧</button>
    <button id="verBtn" class="icon-btn badge" title="版本信息" aria-label="版本信息">ⓘ</button>
  </header>

  <main class="app-main">
    <aside class="sidebar" id="sidebar"></aside>
    <article class="content lesson" id="content">加载中...</article>
  </main>
</div>

<div class="mask" id="verMask">
  <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="verTitle">
    <h3 id="verTitle">版本信息</h3>
    <div class="kv"><span class="k">本地版本</span><span class="v" id="verLocal">-</span></div>
    <div class="kv"><span class="k">云端版本</span><span class="v" id="verRemote">检测中...</span></div>
    <div class="kv"><span class="k">本地构建时间</span><span class="v" id="verLocalTime">-</span></div>
    <div class="kv"><span class="k">云端构建时间</span><span class="v" id="verRemoteTime">-</span></div>
    <div class="kv"><span class="k">更新说明</span><span class="v notes" id="verNotes">-</span></div>
    <div class="row">
      <button class="btn" id="verClose">关闭</button>
      <button class="btn primary" id="verUpdate">立即更新</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
