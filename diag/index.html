<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f3f4f7"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="DiagTutor"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="icon" href="icon.svg"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles.css"/>
<title>诊断学习手册 · Diag Tutor</title>
</head>
<body>
<div class="app">
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="scroll-meter" id="scrollMeter"></div>

  <aside class="rail glass" aria-label="主导航">
    <a class="brand" href="#/home" aria-label="Diag Tutor 首页">
      <span class="brand-mark">DT</span>
      <span>
        <span class="brand-title">Diag Tutor</span>
        <span class="brand-subtitle">UDS · DCM · DEM</span>
      </span>
    </a>
    <nav class="nav-tabs">
      <a class="nav-link" id="navHome" href="#/home"></a>
      <a class="nav-link" id="navCourses" href="#/courses"></a>
      <a class="nav-link" id="navLearn" href="#/learn"></a>
    </nav>
    <button id="verBtn" class="version-chip badge" type="button">v<span id="versionText">-</span></button>
  </aside>

  <header class="mobile-header glass">
    <a class="brand compact" href="#/home" aria-label="Diag Tutor 首页">
      <span class="brand-mark">DT</span>
      <span class="brand-title">Diag Tutor</span>
    </a>
    <button id="mobileVerBtn" class="round-info badge" type="button" aria-label="版本信息">ⓘ</button>
  </header>

  <main class="stage" id="stage" aria-live="polite">加载中...</main>

  <nav class="bottom-tabs glass" aria-label="主导航">
    <a class="bottom-link" id="bottomHome" href="#/home"></a>
    <a class="bottom-link" id="bottomCourses" href="#/courses"></a>
    <a class="bottom-link" id="bottomLearn" href="#/learn"></a>
  </nav>
</div>

<div class="mask" id="verMask">
  <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="verTitle">
    <h3 id="verTitle">版本信息</h3>
    <div class="kv"><span class="k">本地版本</span><span class="v" id="verLocal">-</span></div>
    <div class="kv"><span class="k">云端版本</span><span class="v" id="verRemote">检测中...</span></div>
    <div class="kv"><span class="k">本地构建时间</span><span class="v" id="verLocalTime">-</span></div>
    <div class="kv"><span class="k">云端构建时间</span><span class="v" id="verRemoteTime">-</span></div>
    <div class="kv"><span class="k">更新说明</span><span class="v notes" id="verNotes">-</span></div>
    <div class="row">
      <button class="btn" id="verClose" type="button">关闭</button>
      <button class="btn primary" id="verUpdate" type="button">立即更新</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
